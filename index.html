<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>PIE Tracker — Personal Income Expense Tracker</title>
<meta name="description" content="PIE Tracker — a private income and expense tracker with multi-currency support, analysis and optional Google Drive sync.">
<meta name="theme-color" content="#0B0D10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PIE Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="icon" type="image/svg+xml" id="favIcon" href="">
<link rel="apple-touch-icon" href="./icon.png">
<style>
.pet-update-check-status {
  min-height: 18px;
  margin-top: 7px;
  text-align: center;
  color: var(--text-faint);
  font-size:calc(12px*var(--fs,1));
}

/* PET - Check for Updates */
.pet-check-update-btn {
  width: 100%;
  min-height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 12px;
  padding: 9px 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: transparent;
  color: var(--text);
  font-size:calc(14px*var(--fs,1));
  font-weight: 700;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.pet-check-update-btn:active {
  transform: scale(.99);
}
.pet-check-update-btn.is-checking {
  opacity: .65;
  pointer-events: none;
}

/* PET - New Version Notification */
.pet-update-notice {
  position: fixed; left: 16px; right: 16px;
  bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 99999;
  display: none; padding: 14px; border: 1px solid rgba(217,164,65,.45);
  border-radius: 14px; background: var(--bg-elev); color: var(--text);
  box-shadow: 0 10px 28px rgba(0,0,0,.35);
}
.pet-update-notice.is-visible { display: block; }
.pet-update-title { margin: 0 0 5px; font-size:calc(15px*var(--fs,1)); font-weight: 800; }
.pet-update-text { margin: 0 0 12px; color: var(--text-faint); font-size:calc(13px*var(--fs,1)); line-height: 1.45; }
.pet-update-actions { display: flex; gap: 8px; justify-content: flex-end; }
.pet-update-actions button { min-height: 40px; padding: 8px 15px; border-radius: 10px; font-size:calc(14px*var(--fs,1)); font-weight: 700; cursor: pointer; }
.pet-update-later { border: 1px solid var(--border); background: transparent; color: var(--text); }
.pet-update-now { border: 0; background: var(--accent); color: #fff; }

/* PET - Share App */
.pet-share-card { position: relative; }
.pet-share-card p { margin-bottom: 12px; }
.pet-share-btn {
  width: 100%; min-height: 48px; display: flex; align-items: center;
  justify-content: center; gap: 9px; margin-top: 14px; padding: 12px 18px;
  border: none; border-radius: 12px; background: var(--accent); color: #fff;
  font-size:calc(15px*var(--fs,1)); font-weight: 700; cursor: pointer;
  box-shadow: 0 3px 8px rgba(0,0,0,.12);
  -webkit-tap-highlight-color: transparent;
  transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease;
}
.pet-share-btn:active { transform: scale(.98); box-shadow: 0 2px 5px rgba(0,0,0,.10); }
.pet-share-icon { width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.pet-share-icon svg { width: 20px; height: 20px; display: block; }

:root{
  --bg:#0B0D10;
  --bg-elev:#14171C;
  --bg-elev-2:#1C2027;
  --bg-elev-3:#252A33;
  --border:#262B33;
  --border-soft:#1D2129;
  --text:#E8E6E1;
  --text-dim:#9AA0AC;
  --text-faint:#5B616C;
  --accent:#D9A441;
  --accent-soft:rgba(217,164,65,.14);
  --accent-ink:#171308;
  --expense:#E2665A;
  --expense-soft:rgba(226,102,90,.14);
  --paid:#4FAE8C;
  --paid-soft:rgba(79,174,140,.14);
  --radius:14px;
  --radius-sm:9px;
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,"Roboto Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;background:var(--bg);color:var(--text);font-family:var(--font-ui);
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select,textarea{font-family:inherit;color:inherit;}
input,textarea{background:var(--bg-elev-2);border:1px solid var(--border);color:var(--text);
  border-radius:var(--radius-sm);padding:11px 12px;font-size:calc(16px*var(--fs,1));width:100%;}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;}
button{background:none;border:none;cursor:pointer;font-size:calc(15px*var(--fs,1));}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
.hidden{display:none !important;}

#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}

/* ---- Top bar ---- */
.topbar{
  padding:16px 18px 10px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;background:var(--bg);z-index:20;border-bottom:1px solid var(--border-soft);
}
.brand{font-size:calc(19px*var(--fs,1));font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:8px;}

.brand-copy{display:flex;flex-direction:column;line-height:1.08;gap:3px;}
.brand-copy #brandTitle{font-size:calc(19px*var(--fs,1));font-weight:800;letter-spacing:.2px;color:var(--text);}
.brand-copy small{font-size:calc(10px*var(--fs,1));font-weight:600;color:var(--text-dim);white-space:nowrap;}
.brand .coin{width:26px;height:26px;border-radius:8px;background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:calc(15px*var(--fs,1));font-weight:800;font-family:Georgia,serif;}
.period-nav{display:flex;align-items:center;gap:2px;}
.period-nav button{padding:6px 8px;color:var(--text-dim);font-size:calc(18px*var(--fs,1));line-height:1;}
.period-nav button:active{color:var(--accent);}
.period-label{font-size:calc(13px*var(--fs,1));color:var(--text-dim);min-width:96px;text-align:center;font-weight:600;}

/* ---- Views / tabs ---- */
main{flex:1;overflow-y:auto;padding:0 0 90px;}
.view{display:none;padding:14px 18px 20px;}
.view.active{display:block;}

.tabbar{
  position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;
  display:flex;background:var(--bg-elev);border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom);z-index:30;
}
.tabbar button{
  flex:1;padding:11px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--text-faint);font-size:calc(11px*var(--fs,1));font-weight:600;letter-spacing:.3px;
}
.tabbar button .ic{font-size:calc(19px*var(--fs,1));}
.tabbar button.active{color:var(--accent);}
.calendar-summary{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:15px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;}
.calendar-summary .label{font-size:calc(11px*var(--fs,1));color:var(--text-faint);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px;}
.calendar-summary .amt{font-size:calc(25px*var(--fs,1));font-weight:800;color:var(--expense);}
.calendar-summary-right{display:flex;flex-direction:column;gap:5px;font-size:calc(11px*var(--fs,1));color:var(--text-dim);}
.calendar-summary-right .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;}
.expense-dot{background:var(--accent);}.pending-dot{background:var(--expense);}
.calendar-card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.calendar-weekdays,.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);}
.calendar-weekdays{border-bottom:1px solid var(--border);background:var(--bg-elev-2);}
.calendar-weekdays div{text-align:center;padding:9px 2px;font-size:calc(10px*var(--fs,1));font-weight:800;color:var(--text-faint);text-transform:uppercase;letter-spacing:.35px;}
.calendar-cell{min-height:82px;border-right:1px solid var(--border-soft);border-bottom:1px solid var(--border-soft);padding:7px 5px;position:relative;cursor:pointer;transition:background .12s ease;overflow:hidden;}
.calendar-cell:nth-child(7n){border-right:none;}
.calendar-cell:hover{background:var(--bg-elev-2);}
.calendar-cell.other-month{opacity:.28;}
.calendar-cell.today{box-shadow:none;}
.calendar-cell.selected{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent);}
.calendar-day-num{font-size:calc(11px*var(--fs,1));font-weight:800;color:var(--text-dim);}
.calendar-cell.today .calendar-day-num{color:var(--accent);}
.calendar-amount{margin-top:7px;font-size:calc(12px*var(--fs,1));font-weight:800;color:var(--expense);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.calendar-pending{font-size:calc(9px*var(--fs,1));font-weight:800;color:var(--expense);margin-top:2px;}
.calendar-dots{display:flex;gap:3px;margin-top:6px;align-items:center;}
.calendar-dots span{width:6px;height:6px;border-radius:50%;background:var(--accent);}
.calendar-dots span.pending{background:var(--expense);}
.calendar-more{font-size:calc(9px*var(--fs,1));color:var(--text-faint);font-weight:800;}
.calendar-day-details{margin-top:14px;}
.calendar-day-details h4{margin:0 0 12px;font-size:calc(13px*var(--fs,1));color:var(--text-faint);text-transform:uppercase;letter-spacing:.5px;}
.calendar-detail-total{font-size:calc(20px*var(--fs,1));font-weight:800;color:var(--expense);margin-bottom:8px;}
.calendar-detail-empty{padding:16px 0;color:var(--text-faint);font-size:calc(13px*var(--fs,1));}
@media(max-width:430px){.calendar-cell{min-height:70px;padding:6px 3px}.calendar-amount{font-size:calc(10px*var(--fs,1))}.calendar-weekdays div{font-size:calc(9px*var(--fs,1))}}


/* ---- Summary strip ---- */
.summary-strip{
  background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 18px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:flex-end;
}
.summary-strip .label{font-size:calc(11px*var(--fs,1));color:var(--text-faint);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px;}
.summary-strip .amt{font-size:calc(28px*var(--fs,1));font-weight:700;color:var(--expense);}
.summary-strip .sub{font-size:calc(12px*var(--fs,1));color:var(--text-dim);text-align:right;}

/* ---- Transaction list ---- */
.day-group{margin-bottom:6px;}
.day-head{display:flex;justify-content:space-between;align-items:center;padding:14px 2px 6px;}
.day-head .d{font-size:calc(12px*var(--fs,1));color:var(--text-faint);font-weight:700;letter-spacing:.4px;text-transform:uppercase;}
.day-head .t{font-size:calc(12px*var(--fs,1));color:var(--text-dim);}
.txn-row{
  display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--border-soft);
}
.txn-row:active{background:var(--bg-elev);}
.txn-chip{
  width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  font-size:calc(18px*var(--fs,1));flex-shrink:0;background:var(--bg-elev-2);
}
.txn-mid{flex:1;min-width:0;}
.txn-note{font-size:calc(14.5px*var(--fs,1));font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.txn-meta{font-size:calc(12px*var(--fs,1));color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
.txn-right{text-align:right;flex-shrink:0;}
.txn-amt{font-size:calc(15px*var(--fs,1));font-weight:700;}
.txn-status{font-size:calc(10px*var(--fs,1));font-weight:700;letter-spacing:.4px;text-transform:uppercase;margin-top:2px;}
.txn-status.paid{color:var(--paid);}
.txn-status.pending{color:var(--expense);}

.empty-state{padding:60px 20px;text-align:center;color:var(--text-faint);}
.empty-state .ic{font-size:calc(34px*var(--fs,1));margin-bottom:10px;}
.empty-state .msg{font-size:calc(14px*var(--fs,1));line-height:1.5;}

/* ---- FAB ---- */
.fab{
  position:fixed;bottom:86px;right:calc(50% - 260px + 20px);
  width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
  font-size:calc(26px*var(--fs,1));font-weight:600;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 20px rgba(217,164,65,.35);z-index:25;
}
@media (max-width:559px){.fab{right:20px;}}

/* ---- Modal / overlay ---- */
.overlay{
  position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;
  max-width:520px;margin:0 auto;
}
.overlay-head{
  display:flex;align-items:center;justify-content:space-between;padding:14px 16px;
  border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);
}
.overlay-title{font-size:calc(16px*var(--fs,1));font-weight:700;}
.overlay-head button{color:var(--text-dim);font-size:calc(15px*var(--fs,1));font-weight:600;padding:6px 4px;}
.overlay-body{flex:1;overflow-y:auto;padding:16px;}


/* ---- Field rows in entry modal ---- */
.field{margin-bottom:16px;}
.field label{display:block;font-size:calc(11.5px*var(--fs,1));color:var(--text-faint);text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:6px;font-weight:700;}
.quick-icons{display:flex;flex-wrap:wrap;gap:8px;margin:-6px 0 18px;}
.quick-icon-btn{width:38px;height:38px;border-radius:10px;background:var(--bg-elev-2);
  border:1px solid var(--border);font-size:calc(18px*var(--fs,1));display:flex;align-items:center;justify-content:center;}
.quick-icon-btn:active{background:var(--accent-soft);border-color:var(--accent);}
.picker-btn{
  width:100%;text-align:left;background:var(--bg-elev-2);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.picker-btn .val{font-size:calc(15px*var(--fs,1));font-weight:600;display:flex;align-items:center;gap:8px;min-width:0;}
.picker-btn .val span.txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.picker-btn .chev{color:var(--text-faint);font-size:calc(14px*var(--fs,1));}
.picker-btn.placeholder .val{color:var(--text-faint);font-weight:500;}
.amount-field{position:relative;}
.amount-field .sym{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:calc(20px*var(--fs,1));color:var(--text-dim);}
.amount-field input{padding-left:34px;font-size:calc(22px*var(--fs,1));font-weight:700;font-family:var(--font-mono);}
.row2{display:flex;gap:10px;}
.row2>.field{flex:1;}

.toggle-row{display:flex;align-items:center;justify-content:space-between;background:var(--bg-elev-2);
  border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:16px;}
.toggle-row .t{font-size:calc(14px*var(--fs,1));font-weight:600;}
.toggle-row .sub{font-size:calc(11.5px*var(--fs,1));color:var(--text-faint);margin-top:2px;}
.switch{width:44px;height:26px;border-radius:14px;background:var(--bg-elev-3);position:relative;flex-shrink:0;border:1px solid var(--border);}
.switch .knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--text-dim);transition:.15s;}
.switch.on{background:var(--paid-soft);border-color:var(--paid);}
.switch.on .knob{left:20px;background:var(--paid);}

.btn{padding:13px 16px;border-radius:var(--radius-sm);font-weight:700;font-size:calc(15px*var(--fs,1));text-align:center;}
.btn-primary{background:var(--accent);color:var(--accent-ink);}
.btn-ghost{background:var(--bg-elev-2);color:var(--text);border:1px solid var(--border);}
.btn-danger{background:var(--expense-soft);color:var(--expense);}
.btn-block{width:100%;display:block;}
.btn-row{display:flex;gap:10px;margin-top:22px;}
.btn-row .btn{flex:1;}

/* ---- Two-column picker (category/account) ---- */
.picker-cols{display:flex;height:100%;}
.picker-col{flex:1;overflow-y:auto;border-right:1px solid var(--border);}
.picker-col:last-child{border-right:none;}
.picker-item{
  padding:15px 12px;font-size:calc(14.5px*var(--fs,1));border-bottom:1px solid var(--border-soft);
  display:flex;align-items:center;justify-content:space-between;gap:6px;color:var(--text-dim);
}
.picker-item .lbl{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.picker-item.active{background:var(--accent-soft);color:var(--accent);font-weight:700;}
.picker-item .arrow{color:var(--text-faint);font-size:calc(13px*var(--fs,1));}
.picker-item.addnew{color:var(--accent);font-weight:600;}
.add-inline{padding:10px 12px;border-bottom:1px solid var(--border-soft);}
.add-inline input{margin-bottom:8px;font-size:calc(14px*var(--fs,1));padding:9px 10px;}
.add-inline .row{display:flex;gap:6px;}
.add-inline .row button{flex:1;padding:8px;border-radius:8px;font-size:calc(13px*var(--fs,1));font-weight:700;}

/* ---- Settings ---- */
.seg{display:flex;background:var(--bg-elev-2);border-radius:var(--radius-sm);padding:3px;margin-bottom:18px;border:1px solid var(--border);}
.seg button{flex:1;padding:9px 0;border-radius:7px;font-size:calc(13.5px*var(--fs,1));font-weight:700;color:var(--text-dim);}
.seg button.active{background:var(--bg-elev-3);color:var(--accent);}
.settings-section{margin-bottom:26px;}
.settings-section h3{font-size:calc(12px*var(--fs,1));color:var(--text-faint);text-transform:uppercase;letter-spacing:.6px;margin:0 0 10px;}
.group-card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;}
.group-head{display:flex;align-items:center;gap:8px;padding:13px 12px;}
.group-head .nm{flex:1;font-size:calc(14.5px*var(--fs,1));font-weight:700;display:flex;align-items:center;gap:8px;min-width:0;}
.group-head .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.icon-btn{color:var(--text-faint);padding:5px 6px;font-size:calc(14px*var(--fs,1));}
.brand-icon{width:34px;height:34px;border-radius:9px;object-fit:cover;box-shadow:0 2px 8px rgba(0,0,0,.18);}
.about-wrap{max-width:900px;margin:0 auto;padding-bottom:24px;}
.about-hero{background:linear-gradient(135deg,var(--bg-elev),var(--bg-elev-2));border:1px solid var(--border);border-radius:16px;padding:22px;display:flex;gap:18px;align-items:center;margin-bottom:16px;}
.about-logo{width:96px;height:96px;border-radius:22px;object-fit:cover;box-shadow:0 8px 24px rgba(0,0,0,.18);flex:0 0 auto;}
.about-hero h2{margin:0 0 5px;font-size:calc(24px*var(--fs,1));}
.about-hero p{margin:0;color:var(--text-dim);font-size:calc(13px*var(--fs,1));}
.about-hero-icon{width:96px;height:96px;object-fit:cover;border-radius:22px;flex:0 0 auto;box-shadow:0 8px 24px rgba(0,0,0,.35);}
.about-card{background:var(--bg-elev);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px;}
.about-card h3{margin:0 0 10px;font-size:calc(15px*var(--fs,1));color:var(--text);}
.about-card p,.about-card li{font-size:calc(13px*var(--fs,1));color:var(--text-dim);}
.about-card ul{margin:8px 0 0;padding-left:20px;}
.about-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
.about-feature{border:1px solid var(--border);border-radius:12px;padding:13px;background:var(--bg);}
.about-feature strong{display:block;font-size:calc(13px*var(--fs,1));margin-bottom:4px;color:var(--text);}
.about-feature span{font-size:calc(12px*var(--fs,1));color:var(--text-faint);}
.about-code{font-family:var(--font-mono);font-size:calc(12px*var(--fs,1));background:var(--bg-elev-2);padding:12px;border-radius:10px;overflow:auto;color:var(--text-dim);}
@media(max-width:600px){.about-hero{align-items:flex-start}.about-logo{width:76px;height:76px;border-radius:17px}.about-grid{grid-template-columns:1fr;}}

.icon-btn:active{color:var(--accent);}
.sub-list{border-top:1px solid var(--border-soft);}
.sub-item{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 22px;font-size:calc(13.5px*var(--fs,1));color:var(--text-dim);
  border-bottom:1px solid var(--border-soft);}
.sub-item span.nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sub-item:last-child{border-bottom:none;}
.add-row{padding:11px 12px;color:var(--accent);font-size:calc(13.5px*var(--fs,1));font-weight:700;display:flex;align-items:center;gap:6px;}
.add-row-top{padding:12px 14px;background:var(--bg-elev);border:1px dashed var(--border);border-radius:var(--radius);
  color:var(--accent);font-weight:700;font-size:calc(14px*var(--fs,1));text-align:center;}

.data-row{display:flex;align-items:center;justify-content:space-between;background:var(--bg-elev);
  border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px;margin-bottom:10px;}
.data-row .t{font-size:calc(14px*var(--fs,1));font-weight:600;}
.data-row .s{font-size:calc(11.5px*var(--fs,1));color:var(--text-faint);margin-top:2px;}
.data-row button{background:var(--bg-elev-2);border:1px solid var(--border);padding:8px 14px;border-radius:8px;font-weight:700;font-size:calc(13px*var(--fs,1));}

/* ---- Enhanced controls ---- */
.period-label{background:none;border:0;cursor:pointer;padding:6px 4px;}

.custom-range{display:flex;align-items:end;gap:10px;margin:0 0 14px;padding:11px 12px;background:var(--bg-elev);border:1px solid var(--border);border-radius:12px;}
.custom-range-field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0;}

.custom-range-field input{width:100%;box-sizing:border-box;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:9px;padding:9px 8px;font:inherit;}
.custom-range-arrow{color:var(--text-faint);font-weight:800;padding-bottom:9px;}
.custom-range-hint{font-size:calc(10px*var(--fs,1));color:var(--text-faint);white-space:nowrap;padding-bottom:9px;}
.search-row{display:flex;gap:8px;align-items:center;margin-bottom:12px;}
.search-wrap{position:relative;flex:1;min-width:0;}

.search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:var(--bg-elev-2);color:var(--text-dim);font-size:calc(20px*var(--fs,1));line-height:26px;font-weight:700;}

.calendar-detail-head{display:flex;align-items:center;justify-content:space-between;gap:12px;}

.calendar-view-btn{min-width:76px;padding:9px 16px;}
.pending-bulkbar{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--bg-elev);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin:0 0 12px;}
.pending-bulkbar .bulk-left{font-size:calc(12px*var(--fs,1));color:var(--text-dim);font-weight:700;}
.pending-bulkbar .bulk-actions{display:flex;gap:7px;align-items:center;}
.pending-check{width:20px;height:20px;accent-color:var(--accent);flex:0 0 auto;}
.txn-row.pending-selectable{cursor:pointer;}
.txn-row.pending-selected{background:var(--accent-soft);}
.entry-save-bottom{margin-top:22px;padding:14px 0 6px;}
.entry-save-bottom button{width:100%;background:var(--accent);color:var(--accent-ink);border:none;border-radius:12px;padding:15px 18px;font-size:calc(16px*var(--fs,1));font-weight:800;box-shadow:0 5px 14px rgba(217,164,65,.25);}
.entry-save-bottom button:active{transform:translateY(1px);}
.settings-collapse{width:30px;height:30px;border-radius:8px;background:var(--bg-elev-2);color:var(--text-dim);font-size:calc(15px*var(--fs,1));font-weight:800;flex:0 0 auto;}
.group-card.collapsed .sub-list,.group-card.collapsed .account-type-line{display:none;}
.group-card.collapsed .settings-collapse{transform:rotate(-90deg);}
.data-section-title{font-size:calc(12px*var(--fs,1));color:var(--text-faint);text-transform:uppercase;letter-spacing:.7px;margin:18px 2px 8px;}
.data-row + .data-row{margin-top:8px;}
.data-row.danger-row button{color:#ef6a62;border-color:rgba(239,106,98,.35);}

.pending-summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.pending-kpi{background:var(--bg-elev-2);border:1px solid var(--border);border-radius:10px;padding:12px;}
.pending-kpi .k{font-size:calc(10px*var(--fs,1));color:var(--text-faint);text-transform:uppercase;letter-spacing:.5px;}
.pending-kpi .v{font-size:calc(19px*var(--fs,1));font-weight:800;margin-top:4px;}
.pending-list{border-top:1px solid var(--border-soft);}
.pending-row{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid var(--border-soft);cursor:pointer;}
.pending-row:last-child{border-bottom:0;}
.pending-row .main{flex:1;min-width:0;}
.pending-row .name{font-size:calc(13px*var(--fs,1));font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pending-row .meta{font-size:calc(11px*var(--fs,1));color:var(--text-faint);margin-top:2px;}
.pending-row .amt{font-family:var(--font-mono);font-weight:800;}
.pending-row .mark{font-size:calc(10px*var(--fs,1));color:var(--expense);font-weight:800;}
.trend-bar{cursor:pointer;}
.trend-value{font-size:calc(9px*var(--fs,1));color:var(--text-dim);font-family:var(--font-mono);font-weight:700;white-space:nowrap;}
.account-type-line{display:flex;align-items:center;gap:8px;padding:0 12px 10px;color:var(--text-faint);font-size:calc(11px*var(--fs,1));}
.account-type-line .switch{transform:scale(.8);transform-origin:right center;}
.filter-link{color:var(--accent);font-weight:700;cursor:pointer;}
@media(max-width:430px){.pending-summary{grid-template-columns:1fr;}}

/* ---- Analysis ---- */
.period-pills{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;}
.period-pills button{padding:8px 13px;border-radius:20px;background:var(--bg-elev-2);border:1px solid var(--border);
  font-size:calc(12.5px*var(--fs,1));font-weight:700;color:var(--text-dim);white-space:nowrap;}
.period-pills button.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);}
.chart-card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
.chart-card h4{margin:0 0 14px;font-size:calc(13px*var(--fs,1));color:var(--text-faint);text-transform:uppercase;letter-spacing:.5px;}
.weeks-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;
  background:none;border:none;padding:0;margin:0 0 14px;cursor:pointer;text-align:left;}
.weeks-toggle .chev{color:var(--text-faint);font-size:calc(13px*var(--fs,1));transition:transform .15s;flex-shrink:0;}
.weeks-toggle.collapsed .chev{transform:rotate(-90deg);}
.week-row{display:flex;justify-content:space-between;align-items:center;padding:11px 10px;
  border-radius:10px;margin-bottom:4px;font-size:calc(13.5px*var(--fs,1));}
.week-row.current{background:var(--accent-soft);}
.week-row .rng{color:var(--text-dim);font-weight:600;font-family:var(--font-mono);font-size:calc(12.5px*var(--fs,1));}
.week-row.current .rng{color:var(--accent);font-weight:700;}
.week-row .amt{font-family:var(--font-mono);font-weight:700;}
.week-row .amt.zero{color:var(--text-faint);font-weight:600;}
.pie-wrap{display:flex;align-items:center;gap:18px;}
.pie{width:120px;height:120px;border-radius:50%;flex-shrink:0;}
.legend{flex:1;min-width:0;}
.legend-row{display:flex;align-items:center;gap:8px;font-size:calc(12.5px*var(--fs,1));padding:4px 0;}
.legend-row .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.legend-row .nm{flex:1;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.legend-row .pct{color:var(--text-faint);width:34px;text-align:right;}
.legend-row .amt{width:70px;text-align:right;font-weight:700;font-family:var(--font-mono);}
.bar-list-row{margin-bottom:12px;}
.bar-list-row .top{display:flex;justify-content:space-between;font-size:calc(13px*var(--fs,1));margin-bottom:5px;}
.bar-list-row .top .nm{font-weight:600;}
.bar-list-row .top .amt{font-family:var(--font-mono);font-weight:700;}
.bar-track{height:7px;background:var(--bg-elev-2);border-radius:4px;overflow:hidden;display:flex;}
.bar-fill{height:100%;}
.bar-sub{font-size:calc(11px*var(--fs,1));color:var(--text-faint);margin-top:4px;display:flex;gap:10px;}
.trend-chart{height:180px;width:100%;overflow:hidden;}
.trend-line-svg{display:block;width:100%;height:180px;overflow:visible;}
.trend-axis{stroke:var(--border);stroke-width:1;}
.trend-area{fill:rgba(226,102,90,.10);}
.trend-line{fill:none;stroke:#E2665A;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
.trend-point circle{fill:#E2665A;stroke:var(--bg-elev);stroke-width:2;}
.trend-point.current circle{fill:#E2665A;r:6;}
.trend-point text{fill:#E2665A;font-size:calc(10px*var(--fs,1));font-weight:700;font-family:var(--font-ui);}
.trend-point .trend-label{fill:var(--text-faint);font-size:calc(10px*var(--fs,1));font-weight:500;}
.search-input{margin-bottom:14px;}
.filter-chip{display:flex;align-items:center;gap:8px;background:var(--accent-soft);border:1px solid var(--accent);
  border-radius:20px;padding:8px 14px;margin-bottom:12px;font-size:calc(12.5px*var(--fs,1));font-weight:700;color:var(--accent);}
.filter-chip .x{margin-left:auto;color:var(--accent);font-weight:800;font-size:calc(16px*var(--fs,1));line-height:1;padding:2px 6px;cursor:pointer;}

.about-intro{align-items:center;}
.about-logo{width:104px;height:104px;border-radius:24px;object-fit:cover;box-shadow:0 8px 24px rgba(0,0,0,.35);flex:0 0 auto;}
.about-branding{min-width:0;}
.about-acronym{font-size:calc(25px*var(--fs,1));font-weight:800;letter-spacing:.4px;color:var(--text);display:none;}
.about-branding h2{margin:2px 0 4px;font-size:calc(20px*var(--fs,1));}
.about-tagline{font-size:calc(13px*var(--fs,1));font-weight:700;color:var(--accent);margin-bottom:8px;}
@media(max-width:600px){.about-logo{width:78px;height:78px;border-radius:18px}.about-acronym{font-size:calc(21px*var(--fs,1))}.about-branding h2{font-size:calc(17px*var(--fs,1))}}
.about-description{margin:0;color:var(--text-dim);font-size:calc(15px*var(--fs,1));line-height:1.65;max-width:760px;}

.amount-input-row{display:flex;align-items:center;gap:8px;}
.amount-input-row input{flex:1;min-width:0;}
.calculator-btn{width:44px;height:44px;flex:0 0 44px;border:1px solid var(--border);border-radius:10px;background:var(--bg-elev);color:var(--text-dim);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.calculator-btn:hover{color:var(--accent);border-color:var(--accent);}
.calculator-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;}
.calc-overlay{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;padding:18px;z-index:10000;}
.calc-panel{width:min(360px,100%);background:var(--bg);border:1px solid var(--border);border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.5);overflow:hidden;}
.calc-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);}
.calc-title{font-weight:800;}
.calc-close{border:0;background:none;color:var(--text-dim);font-size:calc(25px*var(--fs,1));cursor:pointer;}
.calc-display{padding:16px;text-align:right;font-size:calc(30px*var(--fs,1));font-weight:700;min-height:42px;word-break:break-all;color:var(--text);}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 14px 16px;}
.calc-key{min-height:54px;border:1px solid var(--border);border-radius:11px;background:var(--bg-elev);color:var(--text);font-size:calc(19px*var(--fs,1));font-weight:700;cursor:pointer;}
.calc-key:hover{border-color:var(--accent);color:var(--accent);}
.calc-key.operator{color:var(--accent);}
.calc-key.equals{background:var(--accent);color:#fff;border-color:var(--accent);}
.calc-key.add-result{grid-column:1/-1;background:#D9A441;color:#fff;border-color:#D9A441;font-size:calc(17px*var(--fs,1));font-weight:800;}
.calc-key.clear{color:#ef6a62;}


/* ======================= PIE additions ======================= */
:root{
  --income:#4FAE8C;
  --income-soft:rgba(79,174,140,.14);
  --info:#5B8FD9;
  --fs:1;
  --cloud:#F5A524;
}
body{font-size:calc(16px*var(--fs,1));}
.brand{cursor:pointer;user-select:none;-webkit-user-select:none;}
.brand-copy #brandTitle{font-size:calc(21px*var(--fs,1));}
.top-tools{display:flex;align-items:center;gap:2px;margin-left:auto;margin-right:2px;}
.sync-cloud{position:relative;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--cloud);}
.sync-cloud .ic{width:24px;height:24px;display:block;}
.sync-cloud .dot{position:absolute;top:6px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--bg);}
.sync-cloud.off{opacity:.55;}
.sync-cloud.err{color:var(--expense);}
.sync-cloud.busy .ic{animation:pieCloudPulse 1s ease-in-out infinite;}
@keyframes pieCloudPulse{0%,100%{opacity:1}50%{opacity:.3}}
.topbar{gap:6px;padding-left:max(14px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));}
.period-label{min-width:84px;}

.c-inc{color:var(--income)!important;} .c-exp{color:var(--expense)!important;} .c-acc{color:var(--accent)!important;} .c-dim{color:var(--text-dim)!important;} .c-faint{color:var(--text-faint)!important;} .c-info{color:var(--info)!important;}

/* summary strip with three figures */
.sum3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;}
.sum3 .label{margin-bottom:3px;}
.summary-strip .sum3 .amt,.calendar-summary .sum3 .amt{font-size:calc(19px*var(--fs,1));font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.summary-strip.multi{flex-direction:column;align-items:stretch;gap:9px;}
.summary-strip .others{font-size:calc(12px*var(--fs,1));color:var(--text-dim);border-top:1px dashed var(--border);padding-top:8px;display:flex;flex-wrap:wrap;gap:4px 12px;}
.summary-strip .others b{font-family:var(--font-mono);}
.summary-foot{display:flex;justify-content:space-between;gap:8px;font-size:calc(12px*var(--fs,1));color:var(--text-dim);}

.day-head .t{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;min-width:0;}
.txn-chip.inc{background:var(--income-soft);}
.txn-amt.inc{color:var(--income);} .txn-amt.exp{color:var(--expense);}

/* kind segmented toggle */
.kind-seg{display:flex;background:var(--bg-elev-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:3px;margin-bottom:16px;}
.kind-seg button{flex:1;padding:10px 0;border-radius:7px;font-size:calc(14px*var(--fs,1));font-weight:800;color:var(--text-dim);}
.kind-seg button.on[data-k="expense"]{background:var(--expense-soft);color:var(--expense);}
.kind-seg button.on[data-k="income"]{background:var(--income-soft);color:var(--income);}
.kind-seg button.on[data-k="both"]{background:var(--bg-elev-3);color:var(--accent);}
.kind-seg.sm{margin-bottom:12px;} .kind-seg.sm button{padding:8px 0;font-size:calc(13px*var(--fs,1));}
.kind-seg button:disabled{opacity:.45;}

/* amount row with currency chip */
.cur-chip{flex:0 0 auto;height:48px;min-width:58px;padding:0 10px;border-radius:10px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:calc(15px*var(--fs,1));display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;}
.cur-chip .cv{font-size:calc(10px*var(--fs,1));opacity:.8;}
.amount-input-row input{font-size:calc(22px*var(--fs,1));font-weight:700;font-family:var(--font-mono);height:48px;}
.amount-input-row .calculator-btn{height:48px;width:46px;flex:0 0 46px;}
.field-hint{font-size:calc(11.5px*var(--fs,1));color:var(--text-faint);margin-top:5px;line-height:1.45;}
.readonly-banner{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--bg-elev);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:14px;font-size:calc(13px*var(--fs,1));color:var(--text-dim);}
.overlay-body.ro input,.overlay-body.ro .picker-btn,.overlay-body.ro .kind-seg,.overlay-body.ro .cur-chip,.overlay-body.ro .calculator-btn,.overlay-body.ro .switch{pointer-events:none;opacity:.7;}

/* bottom sheet */
.sheet-back{position:fixed;inset:0;background:rgba(0,0,0,.58);z-index:9000;display:flex;align-items:flex-end;justify-content:center;}
.sheet{width:100%;max-width:520px;max-height:88vh;overflow-y:auto;background:var(--bg-elev);border:1px solid var(--border);border-bottom:0;border-radius:18px 18px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -12px 34px rgba(0,0,0,.5);}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--bg-elev-3);margin:0 auto 12px;}
.sheet-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
.sheet-title b{font-size:calc(16px*var(--fs,1));}
.sheet-title button{color:var(--accent);font-size:calc(14px*var(--fs,1));font-weight:700;}
.sheet .h5{font-size:calc(11px*var(--fs,1));color:var(--text-faint);text-transform:uppercase;letter-spacing:.6px;font-weight:800;margin:14px 0 8px;}
.opt-row{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--border-soft);font-size:calc(14px*var(--fs,1));cursor:pointer;}
.opt-row:last-child{border-bottom:0;}
.opt-row .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.opt-row .sym{width:34px;font-family:var(--font-mono);color:var(--accent);font-weight:800;text-align:center;flex:0 0 auto;}
.radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--text-faint);flex:0 0 auto;}
.radio.on{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 3px var(--bg-elev);}
.pill{display:inline-block;font-size:calc(10px*var(--fs,1));font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;}
.pill.inc{background:var(--income-soft);color:var(--income);} .pill.exp{background:var(--expense-soft);color:var(--expense);} .pill.n{background:var(--bg-elev-2);color:var(--text-dim);}
.cur-form{display:grid;grid-template-columns:70px 70px minmax(0,1fr);gap:8px;}
.cur-form input{padding:10px;font-size:calc(15px*var(--fs,1));}
.sym-picks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.sym-picks button{min-width:38px;height:34px;padding:0 8px;border-radius:8px;border:1px solid var(--border);background:var(--bg-elev-2);font-family:var(--font-mono);font-weight:800;color:var(--text);}
.sym-picks button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}
.code-picks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.code-picks button{padding:6px 9px;border-radius:14px;border:1px solid var(--border);background:var(--bg-elev-2);font-size:calc(12px*var(--fs,1));font-weight:700;color:var(--text-dim);}

/* collapsible cards (analysis + settings) */
.cc-card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;}
.cc-head{width:100%;display:flex;align-items:center;gap:8px;padding:15px 16px;text-align:left;}
.cc-head h4{margin:0;flex:1;min-width:0;font-size:calc(13px*var(--fs,1));color:var(--text-faint);text-transform:uppercase;letter-spacing:.5px;}
.cc-head .meta{font-size:calc(11.5px*var(--fs,1));color:var(--accent);font-weight:700;white-space:nowrap;text-transform:none;letter-spacing:0;}
.cc-head .chev{color:var(--text-faint);font-size:calc(14px*var(--fs,1));transition:transform .15s;flex:0 0 auto;}
.cc-card.collapsed .cc-head .chev{transform:rotate(-90deg);}
.cc-card.collapsed .cc-body{display:none;}
.cc-body{padding:0 16px 16px;min-width:0;}
.sec-wrap{margin-bottom:12px;}
.sec-head{width:100%;display:flex;align-items:center;gap:10px;padding:13px 14px;background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);text-align:left;}
.sec-head .nm{flex:1;min-width:0;font-size:calc(14.5px*var(--fs,1));font-weight:800;display:flex;align-items:center;gap:8px;}
.sec-head .cnt{font-size:calc(11.5px*var(--fs,1));color:var(--text-faint);font-weight:700;}
.sec-head .chev{color:var(--text-faint);font-size:calc(14px*var(--fs,1));transition:transform .15s;}
.sec-wrap.collapsed .sec-head .chev{transform:rotate(-90deg);}
.sec-wrap.collapsed .sec-body{display:none;}
.sec-wrap:not(.collapsed) .sec-head{border-radius:var(--radius) var(--radius) 0 0;border-bottom-color:var(--border-soft);}
.sec-body{border:1px solid var(--border);border-top:0;border-radius:0 0 var(--radius) var(--radius);padding:12px;background:var(--bg);}
.sec-body .group-card:last-child{margin-bottom:0;}
.sec-body .data-row:last-child{margin-bottom:0;}
.sec-note{font-size:calc(12px*var(--fs,1));color:var(--text-faint);line-height:1.55;margin:0 2px 10px;}
.empty-mini{font-size:calc(12.5px*var(--fs,1));color:var(--text-faint);padding:6px 2px 10px;}
.settings-seg button{font-size:calc(13px*var(--fs,1));}

/* analysis controls */
.an-controls{display:flex;flex-direction:column;gap:0;}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.chip{display:inline-flex;align-items:center;gap:5px;padding:7px 11px;border-radius:16px;border:1px solid var(--border);background:var(--bg-elev-2);font-size:calc(12.5px*var(--fs,1));font-weight:700;color:var(--text-dim);max-width:100%;}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}
.chip .x{font-size:calc(15px*var(--fs,1));line-height:1;margin-left:2px;}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
.kpi{background:var(--bg-elev-2);border:1px solid var(--border);border-radius:11px;padding:11px 12px;min-width:0;}
.kpi .k{font-size:calc(10.5px*var(--fs,1));color:var(--text-faint);text-transform:uppercase;letter-spacing:.5px;font-weight:700;}
.kpi .v{font-size:calc(18px*var(--fs,1));font-weight:800;margin-top:3px;font-family:var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kpi .d{font-size:calc(11px*var(--fs,1));color:var(--text-dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.up-good{color:var(--income);} .up-bad{color:var(--expense);}
.other-cur{margin-top:12px;border-top:1px dashed var(--border);padding-top:10px;}
.other-cur .row{display:flex;gap:10px;align-items:center;font-size:calc(12.5px*var(--fs,1));padding:3px 0;flex-wrap:wrap;}
.other-cur .row b{font-family:var(--font-mono);}
.legend-inline{display:flex;gap:12px;flex-wrap:wrap;font-size:calc(11px*var(--fs,1));color:var(--text-dim);margin-top:8px;}
.legend-inline i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px;}
.gran-pills{display:flex;gap:5px;margin-bottom:10px;}
.gran-pills button{padding:5px 10px;border-radius:14px;font-size:calc(11.5px*var(--fs,1));font-weight:700;color:var(--text-dim);background:var(--bg-elev-2);border:1px solid var(--border);}
.gran-pills button.active{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);}
.cf-svg{display:block;width:100%;height:auto;}
.cf-svg .hit{cursor:pointer;}
.brk-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:9px 10px;border-radius:10px;margin-bottom:3px;font-size:calc(13px*var(--fs,1));cursor:pointer;}
.brk-row.current{background:var(--accent-soft);}
.brk-row .rng{color:var(--text-dim);font-weight:600;font-family:var(--font-mono);font-size:calc(12.5px*var(--fs,1));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.brk-row.current .rng{color:var(--accent);font-weight:700;}
.brk-row .vals{display:flex;gap:8px;font-size:calc(11.5px*var(--fs,1)) !important;justify-content:flex-end;font-family:var(--font-mono);font-weight:700;font-size:calc(12.5px*var(--fs,1));white-space:nowrap;}
.brk-row .vals .z{color:var(--text-faint);font-weight:600;}
.bar-list-row.click{cursor:pointer;}
.bar-list-row .top .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px;}
.bar-list-row .top .chev{color:var(--text-faint);font-size:calc(12px*var(--fs,1));margin-left:4px;}
.delta{font-weight:700;}
.ins-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border-soft);font-size:calc(13px*var(--fs,1));}
.ins-row:last-child{border-bottom:0;}
.ins-row .grow{flex:1;min-width:0;}
.ins-row .grow .s{font-size:calc(11px*var(--fs,1));color:var(--text-faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ins-row .grow .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ins-row b{font-family:var(--font-mono);white-space:nowrap;}
.ins-h{font-size:calc(11px*var(--fs,1));color:var(--text-faint);text-transform:uppercase;letter-spacing:.5px;font-weight:800;margin:12px 0 2px;}
.ins-h:first-child{margin-top:0;}
.crumb{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:calc(13px*var(--fs,1));color:var(--text-dim);flex-wrap:wrap;}
.crumb .back{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--bg-elev);color:var(--text);font-size:calc(18px*var(--fs,1));display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.crumb .lvl{cursor:pointer;} .crumb .lvl.cur{color:var(--accent);font-weight:800;cursor:default;}
.drill-sum{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:15px 16px;margin-bottom:14px;}
.drill-sum .l{font-size:calc(11px*var(--fs,1));color:var(--text-faint);text-transform:uppercase;letter-spacing:.6px;font-weight:700;}
.drill-sum .v{font-size:calc(26px*var(--fs,1));font-weight:800;font-family:var(--font-mono);margin:3px 0 6px;}
.drill-sum .s{font-size:calc(12px*var(--fs,1));color:var(--text-dim);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.link-row{display:flex;justify-content:flex-end;margin:-4px 0 8px;}
.link-btn{color:var(--accent);font-size:calc(13px*var(--fs,1));font-weight:700;padding:4px 2px;}

/* statement grid (GRIDS-style) */
.st-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.st-wrap{overflow:auto;max-height:440px;border:1px solid var(--border);border-radius:10px;background:var(--bg);-webkit-overflow-scrolling:touch;}
.st-grid{border-collapse:collapse;width:max-content;min-width:100%;font-size:calc(12px*var(--fs,1));}
.st-grid th,.st-grid td{border-bottom:1px solid var(--border-soft);border-right:1px solid var(--border-soft);padding:7px 9px;white-space:nowrap;text-align:left;}
.st-grid th:last-child,.st-grid td:last-child{border-right:0;}
.st-grid thead th{position:sticky;top:0;z-index:2;background:var(--bg-elev-3);color:var(--text);font-size:calc(11px*var(--fs,1));font-weight:800;text-transform:uppercase;letter-spacing:.3px;}
.st-grid td.n,.st-grid th.n{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
.st-grid tbody tr:nth-child(even) td{background:rgba(255,255,255,.018);}
.st-grid td.desc{max-width:180px;overflow:hidden;text-overflow:ellipsis;}
.st-grid tfoot td{background:var(--bg-elev-2);font-weight:800;border-top:1px solid var(--accent);position:sticky;bottom:0;}
.st-grid tbody tr{cursor:pointer;}
.st-pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px;}
.st-pager .info{font-size:calc(11px*var(--fs,1));color:var(--text-faint);text-align:center;flex:1;}
.st-pager button{padding:7px 11px;border-radius:8px;border:1px solid var(--accent);color:var(--accent);font-size:calc(12.5px*var(--fs,1));font-weight:700;}
.st-pager button:disabled{opacity:.35;}
.st-actions{display:flex;gap:8px;margin-top:12px;}
.st-actions button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--bg-elev-2);font-size:calc(13px*var(--fs,1));font-weight:700;}

/* multi-select tree */
.ms-box{border:1px solid var(--border);border-radius:10px;background:var(--bg-elev-2);max-height:280px;overflow-y:auto;}
.ms-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border-soft);font-size:calc(13.5px*var(--fs,1));cursor:pointer;}
.ms-row:last-child{border-bottom:0;}
.ms-row.sub{padding-left:36px;color:var(--text-dim);font-size:calc(13px*var(--fs,1));}
.ms-row.grp{background:var(--bg-elev-3);font-size:calc(11px*var(--fs,1));font-weight:800;color:var(--text-faint);text-transform:uppercase;letter-spacing:.5px;cursor:default;padding:7px 12px;}
.ms-row.all{font-weight:800;}
.ms-row .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ck{width:18px;height:18px;border-radius:4px;border:2px solid var(--text-faint);display:inline-flex;align-items:center;justify-content:center;font-size:calc(12px*var(--fs,1));font-weight:900;color:var(--accent-ink);flex:0 0 auto;}
.ck.on{background:var(--accent);border-color:var(--accent);}
.ck.part{background:var(--accent-soft);border-color:var(--accent);}
.ms-sum{width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg-elev-2);border:1px solid var(--border);border-radius:10px;padding:11px 12px;font-size:calc(14px*var(--fs,1));font-weight:600;}
.ms-sum span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* calendar */
.calendar-summary.multi{flex-direction:column;align-items:stretch;}
.calendar-cell .cal-inc{margin-top:6px;font-size:calc(11.5px*var(--fs,1));font-weight:800;color:var(--income);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--font-mono);}
.calendar-cell .cal-exp{font-size:calc(11.5px*var(--fs,1));font-weight:800;color:var(--expense);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--font-mono);}
.calendar-cell .cal-inc + .cal-exp{margin-top:1px;}
.calendar-cell .cal-star{position:absolute;top:4px;right:4px;color:var(--info);font-size:calc(11px*var(--fs,1));line-height:1;}
.calendar-cell .pdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--expense);margin-left:3px;vertical-align:1px;}
@media(max-width:430px){.calendar-cell .cal-inc,.calendar-cell .cal-exp{font-size:calc(9.5px*var(--fs,1));}.calendar-cell .cal-star{top:3px;right:2px;font-size:calc(9px*var(--fs,1));}}
.cal-legend{display:flex;gap:10px;flex-wrap:wrap;font-size:calc(11px*var(--fs,1));color:var(--text-dim);}
.cal-legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;}
.cal-group-h{font-size:calc(11px*var(--fs,1));color:var(--text-faint);text-transform:uppercase;letter-spacing:.6px;font-weight:800;margin:14px 0 2px;display:flex;justify-content:space-between;}

/* settings forms */
.form-overlay .overlay-body{padding-bottom:40px;}
.radio-row{display:flex;gap:8px;}
.radio-row label{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 6px;border-radius:10px;border:1px solid var(--border);background:var(--bg-elev-2);font-size:calc(14px*var(--fs,1));font-weight:700;color:var(--text-dim);cursor:pointer;margin:0;text-transform:none;letter-spacing:0;}
.radio-row label.on[data-v="expense"]{border-color:var(--expense);color:var(--expense);background:var(--expense-soft);}
.radio-row label.on[data-v="income"]{border-color:var(--income);color:var(--income);background:var(--income-soft);}
.radio-row label.on[data-v="both"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}
.radio-row input{display:none;}
.gen-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px;margin-bottom:10px;}
.gen-row .t{font-size:calc(14px*var(--fs,1));font-weight:600;}
.gen-row .s{font-size:calc(11.5px*var(--fs,1));color:var(--text-faint);margin-top:2px;line-height:1.4;}
.gen-row > div:first-child{min-width:0;flex:1;}
.gen-row .ctl{flex:0 0 auto;}
.gen-row button.ghost{background:var(--bg-elev-2);border:1px solid var(--border);padding:8px 12px;border-radius:8px;font-weight:700;font-size:calc(13px*var(--fs,1));white-space:nowrap;}
.gen-row select{background:var(--bg-elev-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 9px;font-size:calc(13px*var(--fs,1));max-width:150px;}
.fs-slider{width:100%;accent-color:var(--accent);margin:10px 0 4px;}
.fs-labels{display:flex;justify-content:space-between;font-size:calc(11px*var(--fs,1));color:var(--text-faint);}
.fs-labels span.on{color:var(--accent);font-weight:800;}
.check-list{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.check-list label{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--border-soft);font-size:calc(14px*var(--fs,1));margin:0;text-transform:none;letter-spacing:0;color:var(--text);font-weight:600;cursor:pointer;background:var(--bg-elev-2);}
.check-list label:last-child{border-bottom:0;}
.check-list label.dis{color:var(--text-faint);cursor:default;}
.check-list input{width:18px;height:18px;accent-color:var(--accent);margin:0;}
.rec-code{background:var(--bg-elev-2);border:1px dashed var(--accent);border-radius:10px;padding:14px;text-align:center;font-family:var(--font-mono);font-size:calc(19px*var(--fs,1));font-weight:800;letter-spacing:1.5px;color:var(--accent);user-select:all;-webkit-user-select:all;word-break:break-all;}

/* CSV import */
.imp-table{border-collapse:collapse;width:max-content;min-width:100%;font-size:calc(12px*var(--fs,1));}
.imp-table th,.imp-table td{padding:6px 8px;border-bottom:1px solid var(--border-soft);white-space:nowrap;text-align:left;}
.imp-table th{position:sticky;top:0;background:var(--bg-elev-3);font-size:calc(10.5px*var(--fs,1));text-transform:uppercase;letter-spacing:.3px;color:var(--text-dim);}
.imp-wrap{overflow:auto;max-height:300px;border:1px solid var(--border);border-radius:10px;}
.imp-err{font-size:calc(12px*var(--fs,1));color:var(--expense);line-height:1.5;margin:8px 0;}
.imp-err div{margin-bottom:3px;}

/* unlock sheet + knock */
.knock-0{border-color:#8A9099 !important;}
.knock-1{border-color:#5B8FD9 !important;}
.knock-2{border-color:#4FAE8C !important;}
.search-input,.about-hero,.calendar-summary,.summary-strip,#settingsSeg{transition:border-color .25s ease;}
.code-input{font-size:calc(18px*var(--fs,1));letter-spacing:2px;text-align:center;font-family:var(--font-mono);}
.code-msg{font-size:calc(12px*var(--fs,1));color:var(--text-faint);min-height:18px;margin-top:8px;text-align:center;}
.code-msg.err{color:var(--expense);}
.shake{animation:pieShake .32s ease;}
@keyframes pieShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.forgot{display:block;margin:14px auto 0;color:var(--text-faint);font-size:calc(13px*var(--fs,1));}

/* toast */
.pie-toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--bg-elev-3);color:var(--text);border:1px solid var(--border);border-radius:20px;padding:9px 16px;font-size:calc(13px*var(--fs,1));font-weight:600;z-index:100000;box-shadow:0 8px 22px rgba(0,0,0,.4);max-width:calc(100% - 32px);text-align:center;}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}}

</style>

<script>
(function(){
"use strict";

/* ============================= BACK-BUTTON LAYERS =============================
   Every overlay, sheet, dialog and drill-down registers a "layer". The Android/browser
   back button closes the top layer first, then walks back through tab history, and
   only on Home asks for a second press before leaving the app. */
const layers = [];
function addLayer(close){
  const o = {close};
  layers.push(o);
  return ()=>{ const i = layers.indexOf(o); if(i>=0) layers.splice(i,1); };
}
function closeTopLayer(){
  const top = layers.pop();
  if(top){ try{ top.close(); }catch(e){ console.error(e); } return true; }
  return false;
}

/* ============================= DIALOGS ============================= */
let toastTimer = null;
function toast(msg){
  let t = document.getElementById("pieToast");
  if(!t){ t = document.createElement("div"); t.id = "pieToast"; t.className = "pie-toast"; document.body.appendChild(t); }
  t.textContent = msg; t.style.display = "block";
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ t.style.display = "none"; }, 2200);
}

(function(){
  let overlay=null, titleEl, messageEl, inputEl, cancelBtn, okBtn, resolver=null, mode=null, removeLayer=null;
  function ensureDialog(){
    if(overlay) return;
    overlay=document.createElement("div");
    overlay.id="petDialogOverlay";
    overlay.style.cssText="position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:99999;background:rgba(0,0,0,.55);padding:20px;";
    overlay.innerHTML=`
      <div id="petDialogBox" role="dialog" aria-modal="true" style="width:min(440px,100%);background:var(--bg-elev);color:var(--text);border:1px solid var(--border);border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.45);padding:20px;">
        <div id="petDialogTitle" style="font-size:calc(17px*var(--fs,1));font-weight:700;margin:0 0 10px;"></div>
        <div id="petDialogMessage" style="font-size:calc(14px*var(--fs,1));line-height:1.55;color:var(--text-dim);white-space:pre-wrap;"></div>
        <input id="petDialogInput" type="text" autocomplete="off" style="display:none;width:100%;box-sizing:border-box;margin-top:14px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg-elev-2);color:var(--text);font:inherit;font-size:calc(16px*var(--fs,1));outline:none;">
        <div style="display:flex;justify-content:flex-end;gap:9px;margin-top:18px;">
          <button id="petDialogCancel" type="button" style="display:none;border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:700;background:var(--bg-elev-2);color:var(--text-dim);border:1px solid var(--border);">Cancel</button>
          <button id="petDialogOk" type="button" style="border:0;border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:700;background:var(--accent);color:#111;">OK</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    titleEl=overlay.querySelector("#petDialogTitle"); messageEl=overlay.querySelector("#petDialogMessage");
    inputEl=overlay.querySelector("#petDialogInput"); cancelBtn=overlay.querySelector("#petDialogCancel"); okBtn=overlay.querySelector("#petDialogOk");
    okBtn.onclick=()=>finish(true);
    cancelBtn.onclick=()=>finish(false,true);
    overlay.onclick=e=>{if(e.target===overlay) finish(false,true);};
    inputEl.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();finish(true);} if(e.key==="Escape"){e.preventDefault();finish(false,true);}};
  }
  function finish(value, cancelled=false){
    if(!resolver) return;
    const r=resolver; resolver=null;
    if(removeLayer){ removeLayer(); removeLayer=null; }
    overlay.style.display="none";
    const v=mode==="prompt" ? (cancelled ? null : inputEl.value) : (mode==="notice" ? true : value);
    mode=null;
    r(v);
  }
  function open(){ overlay.style.display="flex"; removeLayer = addLayer(()=>{ removeLayer=null; finish(false,true); }); }
  window.showNotice=function(title,message){
    ensureDialog();
    return new Promise(resolve=>{
      if(resolver) finish(false,true);
      mode="notice"; resolver=resolve;
      titleEl.textContent=title; messageEl.textContent=message;
      inputEl.style.display="none"; cancelBtn.style.display="none"; okBtn.style.display=""; okBtn.textContent="OK";
      open(); okBtn.focus();
    });
  };
  window.petConfirm=function(title,message,okLabel){
    ensureDialog();
    return new Promise(resolve=>{
      if(resolver) finish(false,true);
      mode="confirm"; resolver=resolve; titleEl.textContent=title; messageEl.textContent=message;
      inputEl.style.display="none"; cancelBtn.style.display=""; okBtn.style.display=""; okBtn.textContent=okLabel||"OK";
      open(); okBtn.focus();
    });
  };
  window.petPrompt=function(title,message,defaultValue="",placeholder=""){
    ensureDialog();
    return new Promise(resolve=>{
      if(resolver) finish(false,true);
      mode="prompt"; resolver=resolve; titleEl.textContent=title; messageEl.textContent=message||"";
      inputEl.value=defaultValue||""; inputEl.placeholder=placeholder||""; inputEl.style.display="block"; cancelBtn.style.display=""; okBtn.style.display=""; okBtn.textContent="OK";
      open(); setTimeout(()=>{inputEl.focus();inputEl.select();},0);
    });
  };
})();

// Choice dialog (3+ buttons) styled like PIE's own dialogs.
function petChoice(title, message, buttons){
  return new Promise(resolve=>{
    const ov = document.createElement("div");
    ov.style.cssText = "position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:99999;background:rgba(0,0,0,.55);padding:20px;";
    const box = document.createElement("div");
    box.setAttribute("role","dialog"); box.setAttribute("aria-modal","true");
    box.style.cssText = "width:min(440px,100%);max-height:90vh;overflow-y:auto;background:var(--bg-elev);color:var(--text);border:1px solid var(--border);border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.45);padding:20px;";
    const h = document.createElement("div"); h.style.cssText = "font-size:calc(17px*var(--fs,1));font-weight:700;margin:0 0 10px;"; h.textContent = title;
    const p = document.createElement("div"); p.style.cssText = "font-size:calc(14px*var(--fs,1));line-height:1.55;color:var(--text-dim);white-space:pre-wrap;"; p.textContent = message;
    const row = document.createElement("div"); row.style.cssText = "display:flex;justify-content:flex-end;gap:9px;margin-top:18px;flex-wrap:wrap;";
    let rm = null;
    const done = v=>{ if(rm){ rm(); rm=null; } ov.remove(); resolve(v); };
    buttons.forEach(b=>{
      const el = document.createElement("button"); el.type = "button"; el.textContent = b.label;
      el.style.cssText = "border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:700;" + (b.primary
        ? "border:0;background:var(--accent);color:#111;"
        : "background:var(--bg-elev-2);color:var(--text-dim);border:1px solid var(--border);");
      el.onclick = ()=>done(b.value);
      row.appendChild(el);
    });
    box.append(h,p,row); ov.appendChild(box); document.body.appendChild(ov);
    rm = addLayer(()=>{ rm=null; ov.remove(); resolve(null); });
  });
}

/* Full-screen overlay helper (entry form, pickers, settings forms). */
function mountOverlay(el, onClose){
  document.getElementById("modal-root").appendChild(el);
  let rm = addLayer(()=>{ rm=null; close(); });
  function close(){
    if(rm){ rm(); rm=null; }
    if(el.parentNode) el.remove();
    if(onClose) onClose();
  }
  return close;
}
/* Bottom sheet helper. Returns {el, body, close}. */
function openSheet(title, opts){
  opts = opts || {};
  const back = document.createElement("div");
  back.className = "sheet-back";
  back.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div class="sheet-title"><b></b>${opts.action?`<button type="button" class="sheet-act"></button>`:""}</div><div class="sheet-body"></div></div>`;
  back.querySelector(".sheet-title b").textContent = title;
  if(opts.action){ const a=back.querySelector(".sheet-act"); a.textContent=opts.action.label; a.addEventListener("click",opts.action.fn); }
  document.body.appendChild(back);
  let rm = addLayer(()=>{ rm=null; close(); });
  function close(){ if(rm){ rm(); rm=null; } back.remove(); if(opts.onClose) opts.onClose(); }
  back.addEventListener("click", e=>{ if(e.target===back && !opts.modal) close(); });
  return {el:back, sheet:back.querySelector(".sheet"), body:back.querySelector(".sheet-body"), close};
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ console.error("storage", e); return false; } }

/* Bring ANY older/partial data up to PIE v2. Used for local storage, PET data, JSON backups and the
   Drive sync file, so a missing setting always falls back to its default instead of breaking. */
function normalizeState(data, opts){
  opts = opts || {};
  const d = (data && typeof data==="object") ? data : {};
  const out = {schema:2};
  const ds = defaultSettings();
  out.settings = Object.assign({}, ds, (d.settings && typeof d.settings==="object") ? d.settings : {});
  if(out.settings.defaultKind!=="income") out.settings.defaultKind = "expense";
  out.settings.fontStep = [0,1,2].includes(Number(out.settings.fontStep)) ? Number(out.settings.fontStep) : 0;
  out.settings.pinchZoom = !!out.settings.pinchZoom;

  let curs = Array.isArray(d.currencies) ? d.currencies.filter(c=>c && c.code) : [];
  const seen = new Set();
  curs = curs.filter(c=>{ c.code = String(c.code).trim().toUpperCase().slice(0,3); if(!c.code || seen.has(c.code)) return false; seen.add(c.code); return true; })
    .map((c,i)=>({id:c.id||("cur_"+c.code), code:c.code, symbol:String(c.symbol==null?"":c.symbol).slice(0,3), name:String(c.name||c.code), order:Number.isFinite(c.order)?c.order:i}));
  if(!curs.length) curs = defaultCurrencies();
  out.currencies = curs;

  out.categories = (Array.isArray(d.categories) ? d.categories : []).filter(Boolean).map(c=>({
    ...c, group: ["income","expense","both"].includes(c.group) ? c.group : "expense",
    icon: c.icon || "🗂️", subs: Array.isArray(c.subs) ? c.subs.filter(Boolean) : []
  }));
  out.accounts = (Array.isArray(d.accounts) ? d.accounts : []).filter(Boolean).map(a=>{
    const x = {...a, group: a.group==="income" ? "income" : "expense", subs: Array.isArray(a.subs) ? a.subs.filter(Boolean) : []};
    if(x.settlement!=="payment" && x.settlement!=="direct") x.settlement = /credit card/i.test(x.name||"") ? "payment" : "direct";
    return x;
  });
  if(!d.categories && !d.accounts && opts.fillDefaults){ const def = defaultState(); out.categories = def.categories; out.accounts = def.accounts; }

  // Transactions: a missing currency means it was entered in PET, which was always ₹ (INR).
  const fallbackCur = seen.has("INR") || !seen.size ? "INR" : out.settings.defaultCurrency;
  out.transactions = (Array.isArray(d.transactions) ? d.transactions : []).filter(t=>t && t.id).map(t=>{
    const x = {...t};
    x.currency = x.currency ? String(x.currency).toUpperCase().slice(0,3) : fallbackCur;
    x.amount = Number(x.amount) || 0;
    x.paid = !!x.paid;
    if(typeof x.date === "string" && x.date.length===10) x.date += "T00:00:00";
    return x;
  });
  // Make sure every currency used by a transaction exists.
  out.transactions.forEach(t=>{
    if(!out.currencies.some(c=>c.code===t.currency)){
      const k = KNOWN_CURRENCIES[t.currency];
      out.currencies.push({id:"cur_"+t.currency, code:t.currency, symbol:k?k[0]:"", name:k?k[1]:t.currency, order:out.currencies.length});
    }
  });
  if(!out.currencies.some(c=>c.code===out.settings.defaultCurrency)) out.settings.defaultCurrency = out.currencies[0].code;

  out.privacy = (d.privacy && typeof d.privacy==="object" && d.privacy.verifier) ? {...d.privacy} : null;
  normalizeOrders(out.categories); normalizeOrders(out.accounts); normalizeOrders(out.currencies);
  return out;
}

    const legacy = lsGet(LEGACY_KEY);

    const s = defaultState(); lsSet(LS_KEY, JSON.stringify(s)); return s;
  }catch(e){ console.error("load failed", e); return defaultState(); }
}

function sortByOrder(arr){ return [...arr].sort((a,b)=>(a.order||0)-(b.order||0)); }
function nextOrder(arr){ return arr.length ? Math.max(...arr.map(x=>x.order||0)) + 1 : 0; }
function normalizeOrders(list){
  sortByOrder(list).forEach((item, idx)=>{ item.order = idx; });

}
function catById(id){ return state.categories.find(c=>c.id===id); }

/* ============================= MONEY ============================= */
function curByCode(code){ return state.currencies.find(c=>c.code===code); }
function curLabel(code){ const c = curByCode(code); return c ? (c.symbol || c.code) : code; }
function defCur(){
  const ok = c => c && state.currencies.some(x=>x.code===c);
  if(ok(device.defaultCurrency)) return device.defaultCurrency;
  if(ok(state.settings.defaultCurrency)) return state.settings.defaultCurrency;
  return state.currencies[0] ? state.currencies[0].code : "INR";
}
function defKind(){ return device.defaultKind==="income" ? "income" : "expense"; }
function fmtNum(n){
  const v = Math.round((Math.abs(n)+Number.EPSILON)*100)/100;
  return v.toLocaleString(undefined,{minimumFractionDigits: v%1?2:0, maximumFractionDigits:2});
}
/* Amounts are always shown positive; colour says income or expense. signed=true only for net figures. */
function fmtMoney(n, code, signed){
  code = code || defCur();
  const c = curByCode(code);
  const sym = c ? (c.symbol || c.code) : code;
  const sep = /^[A-Za-z]/.test(sym) ? " " : "";   // "AED 1,200" but "₹1,200"
  const neg = signed && n < -0.004 ? "−" : "";
  return neg + sym + sep + fmtNum(n);
}
function fmtCompact(n){
  const a = Math.abs(n);
  if(a >= 1e7) return (a/1e7).toFixed(a>=1e8?0:1).replace(/\.0$/,"")+"Cr";
  if(a >= 1e5) return (a/1e5).toFixed(a>=1e6?0:1).replace(/\.0$/,"")+"L";
  if(a >= 1000) return (a/1000).toFixed(a>=10000?0:1).replace(/\.0$/,"")+"k";
  return String(Math.round(a));
}
/* Totals are kept per currency — different currencies are never added together. */
function sumByCurrency(txns){
  const m = {};
  txns.forEach(t=>{
    const c = t.currency || defCur();
    if(!m[c]) m[c] = {income:0, expense:0, count:0};
    m[c][kindOf(t)] += Number(t.amount)||0; m[c].count++;
  });
  return m;
}
function currencyOrder(codes){
  const order = sortByOrder(state.currencies).map(c=>c.code);
  const dc = defCur();
  return [...codes].sort((a,b)=>{
    if(a===dc) return -1; if(b===dc) return 1;
    const ia = order.indexOf(a), ib = order.indexOf(b);
    return (ia<0?999:ia) - (ib<0?999:ib);
  });
}
/* Shrink big figures until they fit their box instead of cutting them off with "…". */
function fitText(root){
  (root||document).querySelectorAll(".sum3 .amt, .summary-strip .amt, .kpi .v, .drill-sum .v, .calendar-summary .amt").forEach(el=>{
    el.style.fontSize = "";
    if(!el.clientWidth) return;
    let fs = parseFloat(getComputedStyle(el).fontSize), n = 0;
    while(el.scrollWidth > el.clientWidth + 0.5 && fs > 11 && n++ < 30){ fs -= 0.5; el.style.fontSize = fs + "px"; }
  });
}
function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ============================= PERIOD STATE ============================= */
let periodMode = "day";
function todayLocal(){ const now = new Date(); return new Date(now.getFullYear(), now.getMonth(), now.getDate()); }
let periodAnchor = todayLocal();
let calendarSelectedDate = todayLocal();
let calendarAnchor = todayLocal();
let customStart = startOfDay(new Date(todayLocal().getTime()-6*86400000));
let customEnd = endOfDay(todayLocal());
const CUSTOM_MAX_DAYS = 60;
const PERIODS = [["day","Day"],["week","Week"],["month","Month"],["year","Year"]];

function startOfDay(d){ const x=new Date(d); x.setHours(0,0,0,0); return x; }
function endOfDay(d){ const x=new Date(d); x.setHours(23,59,59,999); return x; }
function startOfWeek(d){ const x = new Date(d); const day = (x.getDay()+6)%7; x.setDate(x.getDate()-day); x.setHours(0,0,0,0); return x; }
function endOfWeek(d){ const s=startOfWeek(d); const e=new Date(s); e.setDate(e.getDate()+6); e.setHours(23,59,59,999); return e; }
function startOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
function endOfMonth(d){ return new Date(d.getFullYear(), d.getMonth()+1, 0, 23,59,59,999); }
function startOfYear(d){ return new Date(d.getFullYear(),0,1); }
function endOfYear(d){ return new Date(d.getFullYear(),11,31,23,59,59,999); }

function periodRange(mode, anchor){
  if(mode==="custom") return [customStart, customEnd];
  if(mode==="day") return [startOfDay(anchor), endOfDay(anchor)];
  if(mode==="week") return [startOfWeek(anchor), endOfWeek(anchor)];
  if(mode==="year") return [startOfYear(anchor), endOfYear(anchor)];
  return [startOfMonth(anchor), endOfMonth(anchor)];
}
function shiftPeriod(mode, anchor, dir){
  if(mode==="custom"){
    const span = Math.max(1, daysBetweenInclusive(customStart,customEnd));
    const ns = new Date(customStart); ns.setDate(ns.getDate()+dir*span);
    const ne = new Date(customEnd); ne.setDate(ne.getDate()+dir*span);
    customStart=startOfDay(ns); customEnd=endOfDay(ne);
    periodAnchor=new Date(customStart);
    return periodAnchor;
  }
  const d = new Date(anchor);
  if(mode==="day") d.setDate(d.getDate()+dir);
  else if(mode==="week") d.setDate(d.getDate()+7*dir);
  else if(mode==="month"){ d.setDate(1); d.setMonth(d.getMonth()+dir); }
  else if(mode==="year") d.setFullYear(d.getFullYear()+dir);
  return d;
}
/* Range for comparison: same-length previous period, or same period one year earlier. */
function compareRange(mode, anchor, how){
  if(how==="year"){
    const [s,e] = periodRange(mode, anchor);
    const s2=new Date(s); s2.setFullYear(s2.getFullYear()-1);
    const e2=new Date(e); e2.setFullYear(e2.getFullYear()-1);
    return [s2,e2];
  }
  if(mode==="custom"){
    const span = daysBetweenInclusive(customStart,customEnd);
    const s2=new Date(customStart); s2.setDate(s2.getDate()-span);
    const e2=new Date(customEnd); e2.setDate(e2.getDate()-span);
    return [startOfDay(s2), endOfDay(e2)];
  }
  return periodRange(mode, shiftPeriod(mode, anchor, -1));
}
function fmtPeriodLabel(mode, anchor){
  const [s,e] = periodRange(mode, anchor);
  const opt = {month:"short", day:"numeric"};
  if(mode==="custom") return s.toLocaleDateString(undefined,opt)+" – "+e.toLocaleDateString(undefined,opt);
  if(mode==="day") return anchor.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
  if(mode==="week") return s.toLocaleDateString(undefined,opt)+" – "+e.toLocaleDateString(undefined,opt);
  if(mode==="month") return anchor.toLocaleDateString(undefined,{month:"short",year:"numeric"});
  if(mode==="year") return String(anchor.getFullYear());
  return "";
}
function txnsInRange(s,e){
  return state.transactions.filter(t=>{ const d=new Date(t.date); return d>=s && d<=e; });
}
function dateInputValue(d){
  const x = new Date(d);
  const y = x.getFullYear(), m = String(x.getMonth()+1).padStart(2,"0"), day = String(x.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function daysBetweenInclusive(a,b){ return Math.round((startOfDay(b)-startOfDay(a))/86400000)+1; }
function fmtDMY(d){ const x=new Date(d); return String(x.getDate()).padStart(2,"0")+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+x.getFullYear(); }

function applyCustomRangeFrom(sVal, eVal, after){
  if(!sVal || !eVal) return;
  let sd=new Date(sVal+"T00:00:00"), ed=new Date(eVal+"T23:59:59.999");
  if(ed < sd){ showNotice("Date Range", "End date cannot be before start date."); after(); return; }
  if(daysBetweenInclusive(sd,ed) > CUSTOM_MAX_DAYS){ showNotice("Date Range", "Custom range can be a maximum of 60 days."); after(); return; }

  after();
}

/* ============================= BACK BUTTON ============================= */
let exitArmedUntil = 0;
function initBackHandling(){
  try{
    history.replaceState({pie:"base"}, "");
    history.pushState({pie:"guard"}, "");
  }catch(e){ return; }
  window.addEventListener("popstate", ()=>{
    // 1) close the top overlay/sheet/dialog/drill level
    if(closeTopLayer()){ rearm(); return; }
    // 2) previous tab
    while(tabHistory.length){
      const prev = tabHistory.pop();
      if(isScreenVisible(prev) && prev!==activeView){ showView(prev, {noHistory:true}); rearm(); return; }
    }
    // 3) go to the first screen before leaving
    const home = firstVisibleScreen();
    if(activeView!==home){ showView(home, {noHistory:true}); rearm(); return; }
    // 4) on Home: press back again to exit
    if(Date.now() < exitArmedUntil){ try{ history.back(); }catch(e){} return; }
    exitArmedUntil = Date.now() + 2000;
    toast("Press back again to exit");
    rearm();
  });
  function rearm(){ try{ history.pushState({pie:"guard"}, ""); }catch(e){} }
}

/* Summary strip: Income / Expenses / Net in the main currency, other currencies listed separately. */
function summaryHtml(txns, opts){
  opts = opts || {};
  const map = sumByCurrency(txns);
  const codes = currencyOrder(Object.keys(map));
  const main = codes.includes(defCur()) ? defCur() : (codes[0] || defCur());
  const m = map[main] || {income:0, expense:0, count:0};
  const others = codes.filter(c=>c!==main);
  const withIncome = hasIncome(txns);
  const countTxt = txns.length + (txns.length===1?" transaction":" transactions");
  if(!withIncome){
    const otherTxt = others.length ? `<div class="others">Also: ${others.map(c=>`<b class="c-exp">${fmtMoney(map[c].expense,c)}</b>`).join(" · ")}</div>` : "";
    return {cls:"summary-strip"+(others.length?" multi":""), html: others.length
      ? `<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:10px"><div><div class="label">${opts.label||"Expenses"}</div><div class="amt mono">${fmtMoney(m.expense, main)}</div></div><div class="sub">${countTxt}</div></div>${otherTxt}`
      : `<div><div class="label">${opts.label||"Expenses"}</div><div class="amt mono">${fmtMoney(m.expense, main)}</div></div><div class="sub">${countTxt}</div>`};
  }
  const net = m.income - m.expense;
  const otherTxt = others.length ? `<div class="others"><span>Also:</span>${others.map(c=>{const o=map[c];return `<span>${o.income?`<b class="c-inc">${fmtMoney(o.income,c)}</b>`:""}${o.income&&o.expense?" · ":""}${o.expense?`<b class="c-exp">${fmtMoney(o.expense,c)}</b>`:""}</span>`;}).join("")}</div>` : "";
  return {cls:"summary-strip multi", html:`<div class="sum3">
      <div><div class="label">Income</div><div class="amt mono c-inc">${fmtMoney(m.income, main)}</div></div>
      <div><div class="label">Expenses</div><div class="amt mono c-exp">${fmtMoney(m.expense, main)}</div></div>
      <div><div class="label">Net</div><div class="amt mono ${net<0?"c-exp":"c-acc"}">${fmtMoney(net, main, true)}</div></div>
    </div>${otherTxt}<div class="summary-foot"><span>${m.income>0?`Kept ${Math.max(0,Math.round(net/m.income*100))}% of income`:""}</span><span>${countTxt}</span></div>`};
}

  if(entryAccountFilter){
