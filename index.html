    const sub = acc ? subOf(acc.subs, entryAccountFilter.subAccId) : null;
    const label = (acc?acc.name:"Unknown") + (sub? " / "+sub.name : "");
    chipEl.classList.remove("hidden");
    chipEl.innerHTML = `<span>Filtered to ${escapeHtml(label)}</span><span class="x" id="clearAccFilter">×</span>`;
    document.getElementById("clearAccFilter").addEventListener("click", ()=>{ entryAccountFilter=null; renderEntryView(); });
  } else { chipEl.classList.add("hidden"); chipEl.innerHTML = ""; }
  const [s,e] = periodRange(periodMode, periodAnchor);
  let txns = txnsInRange(s,e);
  if(entryAccountFilter){
    txns = txns.filter(t=> t.accId===entryAccountFilter.accId && (entryAccountFilter.subAccId ? t.subAccId===entryAccountFilter.subAccId : true));
  }
  if(entryPendingOnly) txns = txns.filter(t=>accountNeedsPayment(t.accId) && !t.paid);
  txns = filterTransactions(txns, entrySearch).sort((a,b)=> new Date(b.date)-new Date(a.date));
  const sum = summaryHtml(txns);
  const se = document.getElementById("entrySummary"); se.className = sum.cls; se.innerHTML = sum.html; fitText(se);
  const pendingBtn=document.getElementById("entryPendingToggle");
  pendingBtn.classList.toggle("btn-primary", entryPendingOnly);
  pendingBtn.classList.toggle("btn-ghost", !entryPendingOnly);
  pendingBtn.textContent=entryPendingOnly?"Pending ✓":"Pending";

  const wrap = document.getElementById("txnListWrap");
  wrap.innerHTML = "";
  if(txns.length===0){
    pendingSelected.clear();
    wrap.innerHTML = `<div class="empty-state"><div class="ic">${entryPendingOnly?"✅":"🧾"}</div><div class="msg">${entryPendingOnly?"No pending payments in this period.":"Nothing logged for this period yet."}<br>${entryPendingOnly?"Everything is paid or no payment-required transactions exist.":"Tap + to add an entry."}</div></div>`;
    return;
  }
  if(entryPendingOnly){
    const visibleIds=new Set(txns.map(t=>t.id));
    [...pendingSelected].forEach(id=>{ if(!visibleIds.has(id)) pendingSelected.delete(id); });
    wrap.appendChild(buildPendingBulkBar(txns));
  }
  const groups = {};
  txns.forEach(t=>{ const key = t.date.slice(0,10); (groups[key] = groups[key]||[]).push(t); });
  Object.keys(groups).sort((a,b)=> b.localeCompare(a)).forEach(dayKey=>{
    const dayTxns = groups[dayKey];
    const map = sumByCurrency(dayTxns);
    const dObj = new Date(dayKey+"T00:00:00");
    const dHead = document.createElement("div");
    dHead.className = "day-group";
    const label = dObj.toLocaleDateString(undefined,{weekday:"short", day:"numeric", month:"short"});
    const inc = curList(map,"income","c-inc"), exp = curList(map,"expense","c-exp");
    dHead.innerHTML = `<div class="day-head"><span class="d">${label}</span><span class="t">${inc}${inc&&exp?"<span class='c-faint'>·</span>":""}${exp}</span></div>`;
    dayTxns.forEach(t=>{
      const row = document.createElement("div");
      row.className = "txn-row";
      const isPendingTxn = accountNeedsPayment(t.accId) && !t.paid;
      if(entryPendingOnly && isPendingTxn){ row.classList.add("pending-selectable"); if(pendingSelected.has(t.id)) row.classList.add("pending-selected"); }
      const check = entryPendingOnly && isPendingTxn ? `<input class="pending-check" type="checkbox" ${pendingSelected.has(t.id)?"checked":""} aria-label="Select pending transaction">` : "";
      row.innerHTML = txnRowHtml(t, {check});
      row.addEventListener("click", (ev)=>{
        if(entryPendingOnly && isPendingTxn){
          if(ev.target && ev.target.classList.contains("pending-check")) return;
          if(pendingSelected.has(t.id)) pendingSelected.delete(t.id); else pendingSelected.add(t.id);
          renderEntryView(); return;
        }
        openTxn(t.id);
      });
      if(entryPendingOnly && isPendingTxn){
        row.querySelector(".pending-check").addEventListener("change", ev=>{
          ev.stopPropagation();
          if(ev.target.checked) pendingSelected.add(t.id); else pendingSelected.delete(t.id);
          renderEntryView();
        });
      }
      dHead.appendChild(row);
    });
    wrap.appendChild(dHead);
  });
}

/* ============================= ENTRY MODAL ============================= */
let draft = null;
let closeEntry = null;
function defaultEntryDate(){
  const todayL = todayLocal();
  if(periodMode === "day") return dateInputValue(periodAnchor);
  const [s,e] = periodRange(periodMode, periodAnchor);
  if(todayL >= startOfDay(s) && todayL <= endOfDay(e)) return dateInputValue(todayL);
  return dateInputValue(s);
}

  closeEntry = mountOverlay(el, ()=>{ draft=null; closeEntry=null; });
  const body = el.querySelector("#entryBody");
  function applyRO(){
    body.classList.toggle("ro", readOnly);
    el.querySelector("#roBanner").classList.toggle("hidden", !readOnly);
    el.querySelector("#saveWrap").classList.toggle("hidden", readOnly);

  }

  el.querySelectorAll("#fKind button").forEach(b=>b.addEventListener("click", ()=>{
    if(readOnly || b.dataset.k===draft.kind) return;
    draft.kind = b.dataset.k;
    if(draft.accId){ const a=accById(draft.accId); if(!a || a.group!==draft.kind){ draft.accId=null; draft.subAccId=null; } }
    if(draft.catId && !catFitsKind(catById(draft.catId), draft.kind)){ draft.catId=null; draft.subId=null; }
    refreshKindSeg(); refreshCatBtn(); refreshAccBtn();
  }));
  el.querySelector("#entryCancel").addEventListener("click", ()=>closeEntry && closeEntry());
  el.querySelector("#entrySave").addEventListener("click", saveDraft);

function refreshKindSeg(){

}
function refreshCurChip(){

function refreshCatBtn(){

  const row = document.getElementById("paidRow"); if(!row) return;
  row.classList.toggle("hidden", !(draft.kind==="expense" && isCreditCard(draft.accId)));

async function saveDraft(){
  const amt = parseFloat(draft.amount);
  const what = draft.kind==="income" ? "Income Entry" : "Expense Entry";
  if(!amt || amt<=0){ showNotice(what, "Enter a valid amount."); return; }
  if(!draft.catId){ showNotice(what, "Choose a category."); return; }
  if(!draft.accId){ showNotice(what, "Choose an account."); return; }
  const isEdit = state.transactions.some(t=>t.id===draft.id);
  if(isEdit && !await ensureCanEdit()) return;
  const {kind, ...rest} = draft;
  const payload = {...rest, amount: amt, currency: draft.currency || defCur(), date: draft.date.length===10? draft.date+"T00:00:00" : draft.date};
  if(kind==="income" || !accountNeedsPayment(payload.accId)) payload.paid = !!payload.paid && accountNeedsPayment(payload.accId);
  const idx = state.transactions.findIndex(t=>t.id===payload.id);
  if(idx>=0) state.transactions[idx] = payload; else state.transactions.push(payload);
  save();
  if(closeEntry) closeEntry();
  refreshCurrentView();
}

/* ============================= TWO-COLUMN PICKER ============================= */
const PH = {
  accType:{expense:"Eg. Credit Card / UPI", income:"Eg. Bank Account / Cash"},
  accSub:{expense:"Eg. ICICI (Purp 1)", income:"Eg. HDFC Savings"},
  cat:{expense:"Eg. Food / Rent", income:"Eg. Salary / Sales", both:"Eg. Refund / Gift"},
  catSub:{expense:"Eg. Lunch", income:"Eg. Monthly", both:"Eg. General"}
};
function openPicker(kind){
  const k = draft.kind;
  const full = kind==="category" ? state.categories : state.accounts;
  const visible = ()=> sortByOrder(full).filter(x=> kind==="category" ? catFitsKind(x,k) : x.group===k);
  const selTopId = kind==="category" ? draft.catId : draft.accId;
  let activeTop = (selTopId && visible().some(x=>x.id===selTopId)) ? selTopId : (visible()[0] && visible()[0].id);
  const el = document.createElement("div");
  el.className = "overlay"; el.id = "pickerOverlay";
  el.innerHTML = `
    <div class="overlay-head"><button id="pickerClose" type="button">Close</button>
      <div class="overlay-title">${k==="income"?"Income ":"Expense "}${kind==="category"?"Category":"Account"}</div><span style="width:50px"></span></div>
    <div class="overlay-body" style="padding:0;"><div class="picker-cols"><div class="picker-col" id="pickerColLeft"></div><div class="picker-col" id="pickerColRight"></div></div></div>`;
  const close = mountOverlay(el);
  el.querySelector("#pickerClose").addEventListener("click", close);
  function renderLeft(){
    const colLeft = el.querySelector("#pickerColLeft");
    colLeft.innerHTML = "";
    visible().forEach(top=>{
      const item = document.createElement("div");
      item.className = "picker-item" + (top.id===activeTop?" active":"");
      item.innerHTML = `<span class="lbl">${kind==="category"?(top.icon+" "):""}${escapeHtml(top.name)}</span><span class="arrow">›</span>`;
      item.addEventListener("click", ()=>{ activeTop = top.id; renderLeft(); renderRight(); });
      colLeft.appendChild(item);
    });
    const addRow = document.createElement("div");
    addRow.className = "picker-item addnew";
    addRow.innerHTML = `<span class="lbl">+ Add ${kind==="category"?"category":"account type"}</span>`;
    addRow.addEventListener("click", ()=> inlineAdd(colLeft, addRow, kind==="category"?PH.cat[k]:PH.accType[k], (name)=>{
      const item = kind==="category"
        ? {id:uid(), name, order: nextOrder(full), subs:[], icon:"🗂️", group:k}
        : {id:uid(), name, order: nextOrder(full), subs:[], group:k, settlement:"direct"};
      full.push(item); save(); activeTop=item.id; renderLeft(); renderRight();
    }, true));
    colLeft.appendChild(addRow);
  }
  function renderRight(){
    const colRight = el.querySelector("#pickerColRight");
    colRight.innerHTML = "";
    const top = full.find(t=>t.id===activeTop);
    if(!top) return;
    const curSub = kind==="category" ? draft.subId : draft.subAccId;
    sortByOrder(top.subs).forEach(sub=>{
      const item = document.createElement("div");
      item.className = "picker-item" + (sub.id===curSub?" active":"");
      item.innerHTML = `<span class="lbl">${escapeHtml(sub.name)}</span>`;
      item.addEventListener("click", ()=>{ choose(top, sub); });
      colRight.appendChild(item);
    });
    const addRow = document.createElement("div");
    addRow.className = "picker-item addnew";
    addRow.innerHTML = `<span class="lbl">+ Add ${kind==="category"?"subcategory":"account"}</span>`;
    addRow.addEventListener("click", ()=> inlineAdd(colRight, addRow, kind==="category"?PH.catSub[top.group||"expense"]:PH.accSub[k], (name)=>{
      const item = {id:uid(), name, order: nextOrder(top.subs)};
      top.subs.push(item); save(); choose(top, item);
    }, false));
    colRight.appendChild(addRow);
  }
  function choose(top, sub){
    if(kind==="category"){ draft.catId = top.id; draft.subId = sub.id; refreshCatBtn(); }
    else { draft.accId = top.id; draft.subAccId = sub.id; refreshAccBtn(); }
    close();
  }
  function inlineAdd(col, afterRow, placeholder, onSave, left){
    const wrap = document.createElement("div");
    wrap.className = "add-inline";
    wrap.innerHTML = `<input type="text" placeholder="${escapeHtml(placeholder)}"><div class="row">
      <button class="btn-ghost" type="button" data-a="c">Cancel</button><button class="btn-primary" type="button" data-a="ok">Add</button></div>`;
    afterRow.replaceWith(wrap);
    const input = wrap.querySelector("input"); input.focus();
    wrap.querySelector('[data-a="c"]').addEventListener("click", ()=> left ? renderLeft() : renderRight());
    wrap.querySelector('[data-a="ok"]').addEventListener("click", commit);
    input.addEventListener("keydown", e=>{ if(e.key==="Enter") commit(); });
    function commit(){ const name = input.value.trim(); if(name) onSave(name); }
  }
  renderLeft(); renderRight();
}

/* ============================= CURRENCY PICKER ============================= */
function openCurrencyPicker(onPick, current){
  current = current || (draft && draft.currency) || defCur();
  const sh = openSheet("Currency");
  function render(){
    const list = sortByOrder(state.currencies);
    sh.body.innerHTML = list.map(c=>`<div class="opt-row" data-code="${escapeHtml(c.code)}"><span class="radio ${c.code===current?"on":""}"></span><span class="sym">${escapeHtml(c.symbol||c.code)}</span><span class="grow"><b>${escapeHtml(c.code)}</b> · ${escapeHtml(c.name)}</span>${c.code===defCur()?'<span class="pill">Default</span>':""}</div>`).join("")
      + `<div class="h5">Add currency</div>` + currencyFormHtml() + `<button class="btn btn-primary btn-block" type="button" id="curAddBtn" style="margin-top:12px">Add & use</button>`;
    sh.body.querySelectorAll(".opt-row").forEach(r=>r.addEventListener("click", ()=>{ onPick(r.dataset.code); sh.close(); }));
    bindCurrencyForm(sh.body);
    sh.body.querySelector("#curAddBtn").addEventListener("click", ()=>{
      const c = readCurrencyForm(sh.body); if(!c) return;
      state.currencies.push({id:"cur_"+c.code, code:c.code, symbol:c.symbol, name:c.name, order:nextOrder(state.currencies)});
      save(); onPick(c.code); sh.close(); toast(c.code+" added");
    });
  }
  render();
}
function currencyFormHtml(c){
  c = c || {code:"", symbol:"", name:""};
  return `<div class="cur-form"><input id="cfCode" maxlength="3" placeholder="Code" value="${escapeHtml(c.code)}" autocapitalize="characters" ${c.lockCode?"readonly":""}><input id="cfSym" maxlength="3" placeholder="Symbol" value="${escapeHtml(c.symbol)}"><input id="cfName" placeholder="Name, e.g. Euro" value="${escapeHtml(c.name)}"></div>
    <div class="field-hint">Code and symbol: up to 3 characters. Leave the symbol blank to show the code instead.</div>
    <div class="h5" style="margin-top:10px">Quick symbols</div><div class="sym-picks">${QUICK_SYMBOLS.map(s=>`<button type="button" data-sym="${s}">${s}</button>`).join("")}</div>
    ${c.lockCode?"":`<div class="code-picks">${QUICK_CODES.filter(k=>!curByCode(k)).map(k=>`<button type="button" data-qc="${k}">${k} ${escapeHtml(KNOWN_CURRENCIES[k][0])}</button>`).join("")}</div>`}`;
}
function bindCurrencyForm(root){
  const code = root.querySelector("#cfCode"), sym = root.querySelector("#cfSym"), name = root.querySelector("#cfName");
  const mark = ()=> root.querySelectorAll("[data-sym]").forEach(b=>b.classList.toggle("on", b.dataset.sym===sym.value));
  root.querySelectorAll("[data-sym]").forEach(b=>b.addEventListener("click", ()=>{ sym.value=b.dataset.sym; mark(); }));
  root.querySelectorAll("[data-qc]").forEach(b=>b.addEventListener("click", ()=>{ const k=b.dataset.qc; code.value=k; sym.value=KNOWN_CURRENCIES[k][0]; name.value=KNOWN_CURRENCIES[k][1]; mark(); }));
  code.addEventListener("input", ()=>{
    code.value = code.value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,3);
    const k = KNOWN_CURRENCIES[code.value];
    if(k && !code.readOnly){ if(!sym.value) sym.value = k[0]; if(!name.value) name.value = k[1]; mark(); }
  });
  sym.addEventListener("input", ()=>{ sym.value = [...sym.value].slice(0,3).join(""); mark(); });
  mark();
}
function readCurrencyForm(root, editing){
  const code = root.querySelector("#cfCode").value.trim().toUpperCase();
  const symbol = [...root.querySelector("#cfSym").value.trim()].slice(0,3).join("");
  const name = root.querySelector("#cfName").value.trim();
  if(!/^[A-Z0-9]{1,3}$/.test(code)){ showNotice("Currency", "Enter a code of up to 3 letters, for example EUR."); return null; }
  if(!editing && curByCode(code)){ showNotice("Currency", code+" is already in your list."); return null; }
  return {code, symbol, name: name || (KNOWN_CURRENCIES[code] ? KNOWN_CURRENCIES[code][1] : code)};
}

/* ============================= CALCULATOR ============================= */
function openCalculator(){
  if(document.getElementById("calculatorOverlay")) return;
  const overlay=document.createElement("div");
  overlay.className="calc-overlay"; overlay.id="calculatorOverlay";
  overlay.innerHTML=`
    <div class="calc-panel" role="dialog" aria-modal="true" aria-label="Calculator">
      <div class="calc-head"><div class="calc-title">Calculator</div><button class="calc-close" id="calcClose" type="button" aria-label="Close">×</button></div>
      <div class="calc-display" id="calcDisplay">0</div>
      <div class="calc-grid">
        <button class="calc-key clear" data-calc="clear">C</button><button class="calc-key" data-calc="(">(</button><button class="calc-key" data-calc=")">)</button><button class="calc-key operator" data-calc="/">÷</button>
        <button class="calc-key" data-calc="7">7</button><button class="calc-key" data-calc="8">8</button><button class="calc-key" data-calc="9">9</button><button class="calc-key operator" data-calc="*">×</button>
        <button class="calc-key" data-calc="4">4</button><button class="calc-key" data-calc="5">5</button><button class="calc-key" data-calc="6">6</button><button class="calc-key operator" data-calc="-">−</button>
        <button class="calc-key" data-calc="1">1</button><button class="calc-key" data-calc="2">2</button><button class="calc-key" data-calc="3">3</button><button class="calc-key operator" data-calc="+">+</button>
        <button class="calc-key" data-calc="0">0</button><button class="calc-key" data-calc=".">.</button><button class="calc-key" data-calc="del">⌫</button><button class="calc-key equals" data-calc="=">=</button>
        <button class="calc-key add-result" data-calc="add">Add to Amount</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  let rm = addLayer(()=>{ rm=null; overlay.remove(); });
  const close = ()=>{ if(rm){ rm(); rm=null; } overlay.remove(); };
  const amountInput=document.getElementById("fAmount");
  let expr = "";
  const display=overlay.querySelector("#calcDisplay");
  function render(){display.textContent=expr||"0";}
  function evaluate(){
    if(!expr.trim()) return null;
    if(!/^[0-9+\-*/().\s]+$/.test(expr)){display.textContent="Invalid";return null;}
    try{
      const result=Function('"use strict";return ('+expr+')')();
      if(!Number.isFinite(result)) throw new Error();
      expr=String(Math.round((result+Number.EPSILON)*100000000)/100000000);
      render(); return Number(expr);
    }catch(e){display.textContent="Invalid";return null;}
  }
  overlay.querySelectorAll("[data-calc]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const v=btn.dataset.calc;
      if(v==="clear"){expr="";render();return;}
      if(v==="del"){expr=expr.slice(0,-1);render();return;}
      if(v==="="){evaluate();return;}
      if(v==="add"){
        const result=evaluate();
        if(result!==null && amountInput){ amountInput.value=String(result); amountInput.dispatchEvent(new Event("input",{bubbles:true})); close(); }
        return;
      }
      expr+=v;render();
    });
  });
  render();
  overlay.querySelector("#calcClose").addEventListener("click",close);
  overlay.addEventListener("click",e=>{if(e.target===overlay)close();});
}

/* ============================= ANALYSIS ============================= */
let analysisSearch = "";
const anFilters = {currency:null, acc:null, cat:null, status:null};   // null = All
let drill = [];          // [{type:"cat"|"catSub"|"acc"|"accSub", kind, id, subId}]
let drillRemovers = [];
let stPage = 1, stCurrency = null, stKey = "";
let insightsShowAll = false;

const KIND_LABEL = {expense:"Expenses", income:"Income"};
const COL = {inc:"#4FAE8C", exp:"#E2665A", net:"#D9A441", grid:"#262B33", faint:"#5B616C", text:"#E8E6E1"};

/* ---------- multi-select keys ---------- */
function accLeaves(){ const out=[]; state.accounts.forEach(a=>{ if(a.subs.length) a.subs.forEach(s=>out.push(a.id+"|"+s.id)); else out.push(a.id+"|"); }); return out; }
function catLeaves(){ const out=[]; state.categories.forEach(c=>{ if(c.subs.length) c.subs.forEach(s=>out.push(c.id+"|"+s.id)); else out.push(c.id+"|"); }); return out; }
function passesSel(sel, list, topId, subId){
  if(!sel) return true;
  if(sel.has(topId+"|"+(subId||""))) return true;
  const top = list.find(x=>x.id===topId);
  if(!top) return false;
  // a transaction whose sub-item no longer exists counts as selected when its whole parent is selected
  const leaves = top.subs.length ? top.subs.map(s=>topId+"|"+s.id) : [topId+"|"];
  const known = leaves.includes(topId+"|"+(subId||""));
  return !known && leaves.every(k=>sel.has(k));
}
function statusOf(t){ return accountNeedsPayment(t.accId) ? (t.paid?"paid":"pending") : "direct"; }
function applyFilters(txns){
  return txns.filter(t=>
    passesSel(anFilters.acc, state.accounts, t.accId, t.subAccId) &&
    passesSel(anFilters.cat, state.categories, t.catId, t.subId) &&
    (!anFilters.status || anFilters.status.has(statusOf(t))) &&
    (!analysisSearch || txnHaystack(t).includes(analysisSearch)));
}

/* ---------- the data every card works from ---------- */
function analysisContext(){
  const [s,e] = periodRange(periodMode, periodAnchor);
  const base = applyFilters(txnsInRange(s,e));
  const incomeMode = hasIncome(base);
  const view = incomeMode ? ui.analysisView : "expense";
  const codes = currencyOrder(Object.keys(sumByCurrency(base)));
  let cur = anFilters.currency && codes.includes(anFilters.currency) ? anFilters.currency : (codes.includes(defCur()) ? defCur() : (codes[0] || defCur()));
  const inView = t=> view==="both" || kindOf(t)===view;
  const all = base.filter(t=>t.currency===cur);
  const txns = all.filter(inView);
  let cmp = null, cmpLabel = "";
  if(ui.compare!=="off"){
    const [cs,ce] = compareRange(periodMode, periodAnchor, ui.compare);
    cmp = applyFilters(txnsInRange(cs,ce)).filter(t=>t.currency===cur);
    cmpLabel = ui.compare==="year" ? "vs last year" : ("vs " + (periodMode==="custom" ? "previous range" : fmtPeriodLabel(periodMode, shiftPeriod(periodMode, new Date(periodAnchor), -1))));
  }
  return {s, e, base, incomeMode, view, codes, cur, all, txns, inView, cmp, cmpLabel};
}
function totals(txns){ let income=0, expense=0; txns.forEach(t=>{ if(kindOf(t)==="income") income+=Number(t.amount); else expense+=Number(t.amount); }); return {income, expense, net:income-expense, count:txns.length}; }
function deltaHtml(cur, prev, upIsGood, label){
  if(prev==null) return "";
  if(!prev && !cur) return `<span class="c-faint">no change ${escapeHtml(label)}</span>`;
  if(!prev) return `<span class="c-faint">new ${escapeHtml(label)}</span>`;
  const pct = (cur-prev)/prev*100;
  if(Math.abs(pct)<0.5) return `<span class="c-faint">same ${escapeHtml(label)}</span>`;
  const up = pct>0, good = up===upIsGood;
  return `<span class="delta ${good?"up-good":"up-bad"}">${up?"▲":"▼"} ${Math.abs(pct).toFixed(Math.abs(pct)<10?1:0)}%</span> <span class="c-faint">${escapeHtml(label)}</span>`;
}

      card.classList.toggle("collapsed", now); setCollapsed(card.dataset.cc, now); if(!now) fitText(card);

/* ---------- Level 1: overview ---------- */
function overviewCard(ctx){
  const T = totals(ctx.all), C = ctx.cmp ? totals(ctx.cmp) : null;
  const pend = ctx.all.filter(t=>kindOf(t)==="expense" && accountNeedsPayment(t.accId) && !t.paid);
  const pendAmt = pend.reduce((a,t)=>a+Number(t.amount),0);
  const pendCards = new Set(pend.map(t=>t.accId+"|"+(t.subAccId||""))).size;
  const tdy = todayLocal(), endRef = (tdy >= startOfDay(ctx.s) && tdy <= ctx.e) ? tdy : ctx.e;
  const days = Math.max(1, daysBetweenInclusive(ctx.s, endRef));
  const k = (label, val, cls, d)=>`<div class="kpi"><div class="k">${label}</div><div class="v ${cls||""}">${val}</div><div class="d">${d||"&nbsp;"}</div></div>`;
  const cur = ctx.cur;
  let tiles = "";
  const outTile = k("Card outstanding", fmtMoney(pendAmt,cur), pendAmt?"c-exp":"c-faint", pendAmt?`${pendCards} account${pendCards===1?"":"s"} · ${pend.length} pending`:"Nothing pending");
  if(ctx.view==="both"){
    tiles = k("Income", fmtMoney(T.income,cur), "c-inc", C?deltaHtml(T.income,C.income,true,ctx.cmpLabel):"")
      + k("Expenses", fmtMoney(T.expense,cur), "c-exp", C?deltaHtml(T.expense,C.expense,false,ctx.cmpLabel):"")
      + k("Net", fmtMoney(T.net,cur,true), T.net<0?"c-exp":"c-acc", T.income>0?`Kept ${Math.max(0,Math.round(T.net/T.income*100))}% of income`:"")
      + outTile;
  }else if(ctx.view==="expense"){
    tiles = k("Expenses", fmtMoney(T.expense,cur), "c-exp", C?deltaHtml(T.expense,C.expense,false,ctx.cmpLabel):"")
      + outTile
      + k("Transactions", String(ctx.txns.length), "", "")
      + k("Average per day", fmtMoney(T.expense/days,cur), "", `${days} day${days===1?"":"s"}`);
  }else{
    const byCat = {}; ctx.txns.forEach(t=>{ byCat[t.catId]=(byCat[t.catId]||0)+Number(t.amount); });
    const top = Object.entries(byCat).sort((a,b)=>b[1]-a[1])[0];
    const tc = top ? catById(top[0]) : null;
    tiles = k("Income", fmtMoney(T.income,cur), "c-inc", C?deltaHtml(T.income,C.income,true,ctx.cmpLabel):"")
      + k("Transactions", String(ctx.txns.length), "", "")
      + k("Top source", tc?escapeHtml(tc.name):"—", "", top?fmtMoney(top[1],cur):"")
      + k("Average per entry", fmtMoney(ctx.txns.length?T.income/ctx.txns.length:0,cur), "", "");
  }
  let others = "";
  const otherCodes = ctx.codes.filter(c=>c!==ctx.cur);
  if(otherCodes.length){
    const map = sumByCurrency(ctx.base.filter(ctx.inView));
    others = `<div class="other-cur"><div class="ins-h">Other currencies · tap to view</div>${otherCodes.map(c=>{const o=map[c]||{income:0,expense:0};const net=o.income-o.expense;return `<div class="row" data-cur="${escapeHtml(c)}" style="cursor:pointer"><span class="pill n">${escapeHtml(c)}</span>${ctx.view!=="expense"?`<b class="c-inc">${fmtMoney(o.income,c)}</b>`:""}${ctx.view!=="income"?`<b class="c-exp">${fmtMoney(o.expense,c)}</b>`:""}${ctx.view==="both"?`<span class="c-faint">net</span><b class="${net<0?"c-exp":"c-acc"}">${fmtMoney(net,c,true)}</b>`:""}</div>`;}).join("")}</div>`;
  }
  return ccCard("overview", "Overview", escapeHtml(fmtPeriodLabel(periodMode, periodAnchor)), `<div class="kpis">${tiles}</div>${others}`);
}

/* ---------- Level 2: time ---------- */
function bucketRange(gran, d){ return periodRange(gran, d); }
function bucketLabel(gran, s){
  if(gran==="day") return String(s.getDate());
  if(gran==="week") return s.toLocaleDateString(undefined,{day:"numeric",month:"short"});
  if(gran==="month") return s.toLocaleDateString(undefined,{month:"short"});
  return String(s.getFullYear());
}
function cashFlowCard(ctx){
  const gran = ui.gran || "month";
  const N = {day:10, week:8, month:6, year:5}[gran];
  let anchor = new Date(ctx.e > todayLocal() && ctx.s <= todayLocal() ? todayLocal() : ctx.e);
  const pts = [];
  for(let i=N-1;i>=0;i--){
    const a = shiftPeriod(gran, anchor, -i);
    const [s,e] = bucketRange(gran, a);
    const tx = applyFilters(txnsInRange(s,e)).filter(t=>t.currency===ctx.cur && ctx.inView(t));
    const T = totals(tx);
    pts.push({s, e, label: bucketLabel(gran, s), ...T, current: i===0});
  }
  const W=320, H=150, padL=8, padR=8, padT=16, padB=22;
  const showInc = ctx.view!=="expense", showExp = ctx.view!=="income", showNet = ctx.view==="both";
  let max = 0, min = 0;
  pts.forEach(p=>{ if(showInc) max=Math.max(max,p.income); if(showExp) max=Math.max(max,p.expense); if(showNet){ max=Math.max(max,p.net); min=Math.min(min,p.net); } });
  if(max===0 && min===0) max = 1;
  const y = v => padT + (H-padT-padB) * (max - v) / (max - min);
  const slot = (W-padL-padR)/N;
  const bw = showInc && showExp ? Math.min(14, slot*0.32) : Math.min(22, slot*0.5);
  let bars = "", net = [], labels = "", hits = "";
  pts.forEach((p,i)=>{
    const cx = padL + slot*i + slot/2;
    const y0 = y(0);
    const bar = (v, x, col)=>{ const h = Math.max(v>0?1.5:0, y0 - y(v)); return `<rect x="${x.toFixed(1)}" y="${(y0-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${col}"${p.current?` stroke="${COL.text}" stroke-width="1"`:""}/>`; };
    if(showInc && showExp){ bars += bar(p.income, cx-bw-1, COL.inc) + bar(p.expense, cx+1, COL.exp); }
    else if(showInc) bars += bar(p.income, cx-bw/2, COL.inc);
    else bars += bar(p.expense, cx-bw/2, COL.exp);
    if(showNet) net.push([cx, y(p.net)]);
    labels += `<text x="${cx.toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="9" fill="${p.current?COL.text:COL.faint}" font-weight="${p.current?700:400}">${escapeHtml(p.label)}</text>`;
    hits += `<rect class="hit" data-i="${i}" x="${(padL+slot*i).toFixed(1)}" y="0" width="${slot.toFixed(1)}" height="${H}" fill="transparent"/>`;
  });
  const zero = `<line x1="${padL}" y1="${y(0).toFixed(1)}" x2="${W-padR}" y2="${y(0).toFixed(1)}" stroke="${COL.grid}"/>`;
  const netSvg = showNet ? `<polyline points="${net.map(p=>p.map(v=>v.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="${COL.net}" stroke-width="2" stroke-dasharray="4 3"/>${net.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${pts[i].current?3.5:2.5}" fill="${COL.net}"/>`).join("")}` : "";
  const topLbl = `<text x="${W-padR}" y="10" text-anchor="end" font-size="8.5" fill="${COL.faint}">max ${escapeHtml(fmtMoney(max, ctx.cur))}</text>`;
  const last = pts[pts.length-1];
  const lastLine = `${escapeHtml(last.label)} ${gran==="day"?escapeHtml(last.s.toLocaleDateString(undefined,{month:"short"})):""}: ${showInc?`<b class="c-inc mono">${fmtMoney(last.income,ctx.cur)}</b> `:""}${showExp?`<b class="c-exp mono">${fmtMoney(last.expense,ctx.cur)}</b> `:""}${showNet?`net <b class="mono ${last.net<0?"c-exp":"c-acc"}">${fmtMoney(last.net,ctx.cur,true)}</b>`:""}`;
  const legend = `<div class="legend-inline">${showInc?`<span><i style="background:${COL.inc}"></i>Income</span>`:""}${showExp?`<span><i style="background:${COL.exp}"></i>Expenses</span>`:""}${showNet?`<span><i style="background:${COL.net}"></i>Net</span>`:""}<span class="c-faint">Tap a bar to open that period</span></div>`;
  const pills = `<div class="gran-pills">${[["day","Daily"],["week","Weekly"],["month","Monthly"],["year","Yearly"]].map(([g,l])=>`<button type="button" data-gran="${g}" class="${g===gran?"active":""}">${l}</button>`).join("")}</div>`;
  window.__pieCf = pts.map(p=>({s:p.s, gran}));
  return ccCard("cashflow", ctx.view==="both"?"Cash flow":"Trend", "", `${pills}<svg class="cf-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend chart">${zero}${bars}${netSvg}${labels}${topLbl}${hits}</svg><div style="font-size:calc(12px*var(--fs,1));color:var(--text-dim);margin-top:6px">${lastLine}</div>${legend}`);
}
function breakdownCard(ctx){
  if(periodMode==="day") return "";
  const rows = [];
  const today = todayLocal();
  if(periodMode==="year"){
    for(let m=0;m<12;m++){ const s=new Date(ctx.s.getFullYear(),m,1); rows.push({s, e:endOfMonth(s), label:s.toLocaleDateString(undefined,{month:"long"}), go:["month",s]}); }
  }else if(periodMode==="month"){
    let c = startOfWeek(ctx.s); const f = d=>String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0");
    while(c <= ctx.e){ const e=endOfWeek(c); rows.push({s:new Date(c), e, label:f(c)+" ~ "+f(e), go:["week",new Date(c)]}); c=new Date(c); c.setDate(c.getDate()+7); }
  }else{
    let c = startOfDay(ctx.s);
    while(c <= ctx.e){ rows.push({s:new Date(c), e:endOfDay(c), label:c.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"}), go:["day",new Date(c)]}); c=new Date(c); c.setDate(c.getDate()+1); }
  }
  const title = {year:"Months in this year", month:"Weeks in this month", week:"Days in this week", custom:"Days in this range"}[periodMode];
  const html = rows.map((r,i)=>{
    const T = totals(ctx.all.filter(t=>{ const d=new Date(t.date); return d>=r.s && d<=r.e && ctx.inView(t); }));
    const cur = today>=startOfDay(r.s) && today<=endOfDay(r.e);
    const v = (n,cls)=> n ? `<span class="${cls}">${fmtMoney(n,ctx.cur)}</span>` : `<span class="z">${fmtMoney(0,ctx.cur)}</span>`;
    const vals = ctx.view==="both" ? `${v(T.income,"c-inc")}${v(T.expense,"c-exp")}<span class="${T.net<0?"c-exp":"c-acc"}">${fmtMoney(T.net,ctx.cur,true)}</span>` : ctx.view==="income" ? v(T.income,"c-inc") : v(T.expense,"c-exp");
    return `<div class="brk-row${cur?" current":""}" data-bi="${i}"><span class="rng">${escapeHtml(r.label)}</span><span class="vals">${vals}</span></div>`;
  }).join("");
  window.__pieBrk = rows.map(r=>r.go);
  const head = ctx.view==="both" ? `<div class="brk-row" style="cursor:default;padding-top:0"><span></span><span class="vals c-faint" style="font-size:calc(10.5px*var(--fs,1));font-family:var(--font-ui)">Income · Expenses · Net</span></div>` : "";
  return ccCard("breakdown", title, "", head+html);
}

/* ---------- Level 3: categories ---------- */
function categoryCard(ctx, kind){
  const tx = ctx.all.filter(t=>kindOf(t)===kind);
  const total = tx.reduce((a,t)=>a+Number(t.amount),0);
  const prev = {};
  if(ctx.cmp) ctx.cmp.filter(t=>kindOf(t)===kind).forEach(t=>{ prev[t.catId]=(prev[t.catId]||0)+Number(t.amount); });
  const by = {}; tx.forEach(t=>{ by[t.catId]=(by[t.catId]||0)+Number(t.amount); });
  const entries = Object.entries(by).sort((a,b)=>b[1]-a[1]);
  const max = Math.max(1, ...entries.map(e=>e[1]));
  const col = kind==="income" ? COL.inc : COL.exp;
  const body = entries.length ? entries.map(([id,amt])=>{
    const c = catById(id);
    return `<div class="bar-list-row click" data-drill="cat" data-kind="${kind}" data-id="${escapeHtml(id)}"><div class="top"><span class="nm">${c?escapeHtml((c.icon||"")+" "+c.name):"Uncategorized"}<span class="chev">›</span></span><span class="amt mono">${fmtMoney(amt,ctx.cur)}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${(amt/max*100).toFixed(1)}%;background:${col}"></div></div>
      <div class="bar-sub"><span>${total?Math.round(amt/total*100):0}%</span>${ctx.cmp?`<span>${deltaHtml(amt, prev[id]||0, kind==="income", "")}</span>`:""}</div></div>`;
  }).join("") : emptyMsg(kind==="income"?"No income in this period.":"No expenses in this period.");
  return ccCard(kind==="income"?"catInc":"catExp", kind==="income"?"Where it comes from":"Where it goes", total?fmtMoney(total,ctx.cur):"", body);
}

/* ---------- Level 4: accounts ---------- */
function accountCard(ctx){
  const section = (kind)=>{
    const tx = ctx.all.filter(t=>kindOf(t)===kind);
    const by = {};
    tx.forEach(t=>{ const r = by[t.accId] = by[t.accId] || {amt:0, paid:0, pending:0, subs:new Set()}; r.amt+=Number(t.amount); r.subs.add(t.subAccId||""); if(accountNeedsPayment(t.accId)){ if(t.paid) r.paid+=Number(t.amount); else r.pending+=Number(t.amount);} });
    const entries = Object.entries(by).sort((a,b)=>b[1].amt-a[1].amt);
    const max = Math.max(1, ...entries.map(e=>e[1].amt));
    if(!entries.length) return emptyMsg(kind==="income"?"No income accounts used.":"No expense accounts used.");
    return entries.map(([id,r])=>{
      const a = accById(id);
      const pay = accountNeedsPayment(id);
      const track = pay && r.amt ? `<div class="bar-fill" style="width:${(r.paid/max*100).toFixed(1)}%;background:${COL.inc}"></div><div class="bar-fill" style="width:${(r.pending/max*100).toFixed(1)}%;background:${COL.exp}"></div>` : `<div class="bar-fill" style="width:${(r.amt/max*100).toFixed(1)}%;background:${kind==="income"?COL.inc:"var(--accent)"}"></div>`;
      return `<div class="bar-list-row click" data-drill="acc" data-kind="${kind}" data-id="${escapeHtml(id)}"><div class="top"><span class="nm">${escapeHtml(a?a.name:"Unknown")}<span class="chev">›</span></span><span class="amt mono">${fmtMoney(r.amt,ctx.cur)}</span></div>
        <div class="bar-track">${track}</div><div class="bar-sub"><span>${r.subs.size} account${r.subs.size===1?"":"s"}</span>${pay?`<span class="c-inc">Paid ${fmtMoney(r.paid,ctx.cur)}</span><span class="c-exp">Pending ${fmtMoney(r.pending,ctx.cur)}</span>`:""}</div></div>`;
    }).join("");
  };
  let body = "";
  if(ctx.view==="both") body = `<div class="ins-h">Paid from</div>${section("expense")}<div class="ins-h" style="margin-top:14px">Received in</div>${section("income")}`;
  else body = section(ctx.view);
  return ccCard("accounts", "Accounts", "", body);
}
function paymentCard(ctx){
  if(ctx.view==="income") return "";
  const payTx = ctx.all.filter(t=>kindOf(t)==="expense" && accountNeedsPayment(t.accId));
  if(!payTx.length && !state.accounts.some(a=>a.group==="expense" && a.settlement==="payment")) return "";
  const pending = payTx.filter(t=>!t.paid), paid = payTx.filter(t=>t.paid);
  const sum = a=>a.reduce((x,t)=>x+Number(t.amount),0);
  const grouped = {};
  pending.forEach(t=>{ const key=t.accId+"|"+(t.subAccId||""); const g = grouped[key] = grouped[key] || {accId:t.accId, subAccId:t.subAccId, amt:0, count:0}; g.amt+=Number(t.amount); g.count++; });
  const rows = Object.values(grouped).sort((a,b)=>b.amt-a.amt);
  let html = `<div class="pending-summary"><div class="pending-kpi"><div class="k">Pending payment</div><div class="v mono c-exp">${fmtMoney(sum(pending),ctx.cur)}</div></div><div class="pending-kpi"><div class="k">Paid / settled</div><div class="v mono c-inc">${fmtMoney(sum(paid),ctx.cur)}</div></div></div><div class="pending-list">`;
  if(!rows.length) html += `<div style="padding:12px 0;color:var(--paid);font-size:calc(13px*var(--fs,1));font-weight:700">✓ No pending card payments in this period.</div>`;
  const canHome = isScreenVisible("entry");
  rows.forEach(r=>{ const a=accById(r.accId), sub=a?subOf(a.subs,r.subAccId):null; html += `<div class="pending-row" data-acc="${r.accId}" data-sub="${r.subAccId||""}"><div class="main"><div class="name">${escapeHtml((a?a.name:"")+(sub?" / "+sub.name:""))}</div><div class="meta">${r.count} pending${canHome?` · <span class="filter-link">View &amp; mark paid</span>`:""}</div></div><div><div class="amt mono">${fmtMoney(r.amt,ctx.cur)}</div><div class="mark">PENDING</div></div></div>`; });
  html += `</div>`;
  return ccCard("payments", "Card settlements", "", html);
}

/* ---------- Level 5: comparisons + insights ---------- */
function recurringSpends(ctx){
  const end = ctx.e > todayLocal() ? todayLocal() : ctx.e;
  const months = [0,1,2,3].map(i=>{ const s=new Date(end.getFullYear(), end.getMonth()-i, 1); return [s, endOfMonth(s)]; });
  const map = {};
  months.forEach(([s,e],mi)=>{
    applyFilters(txnsInRange(s,e)).filter(t=>t.currency===ctx.cur && kindOf(t)==="expense" && (t.note||"").trim()).forEach(t=>{
      const k = t.note.trim().toLowerCase();
      const r = map[k] = map[k] || {name:t.note.trim(), months:new Set(), total:0, n:0};
      r.months.add(mi); r.total+=Number(t.amount); r.n++;
    });
  });
  return Object.values(map).filter(r=>r.months.size>=3).map(r=>({...r, avg:r.total/r.months.size})).sort((a,b)=>b.avg-a.avg).slice(0,5);
}
function insightsCard(ctx){
  if(!ctx.all.length) return ccCard("insights","Insights","",emptyMsg());
  const T = totals(ctx.all);
  let h = "";
  if(ctx.view==="both" && T.income>0){
    h += `<div class="ins-h">Cash flow</div><div class="ins-row"><div class="grow"><div class="t">Income left after expenses</div><div class="s">${fmtMoney(T.income,ctx.cur)} in · ${fmtMoney(T.expense,ctx.cur)} out</div></div><b class="${T.net<0?"c-exp":"c-acc"}">${T.net<0?"Overspent":Math.round(T.net/T.income*100)+"%"}</b></div>`;
  }
  const top = (kind,n)=>ctx.all.filter(t=>kindOf(t)===kind).sort((a,b)=>b.amount-a.amount).slice(0,n);
  const txRow = t=>`<div class="ins-row" data-open="${t.id}" style="cursor:pointer"><div class="grow"><div class="t">${escapeHtml(txnTitle(t))}</div><div class="s">${escapeHtml(new Date(t.date).toLocaleDateString(undefined,{day:"numeric",month:"short"})+" · "+txnMeta(t))}</div></div><b class="${kindOf(t)==="income"?"c-inc":"c-exp"}">${fmtMoney(t.amount,t.currency)}</b></div>`;
  if(ctx.view!=="income"){ const l = top("expense",3); if(l.length) h += `<div class="ins-h">Largest expenses</div>${l.map(txRow).join("")}`; }
  if(ctx.view!=="expense"){ const l = top("income",3); if(l.length) h += `<div class="ins-h">Largest income</div>${l.map(txRow).join("")}`; }
  if(ctx.cmp && ctx.view!=="income"){
    const now={}, prev={};
    ctx.all.filter(t=>kindOf(t)==="expense").forEach(t=>{ now[t.catId]=(now[t.catId]||0)+Number(t.amount); });
    ctx.cmp.filter(t=>kindOf(t)==="expense").forEach(t=>{ prev[t.catId]=(prev[t.catId]||0)+Number(t.amount); });
    const ch = [...new Set([...Object.keys(now),...Object.keys(prev)])].map(id=>({id, d:(now[id]||0)-(prev[id]||0), now:now[id]||0, prev:prev[id]||0})).filter(x=>Math.abs(x.d)>0.004).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d)).slice(0,3);
    if(ch.length) h += `<div class="ins-h">Biggest changes ${escapeHtml(ctx.cmpLabel)}</div>` + ch.map(x=>{ const c=catById(x.id); return `<div class="ins-row"><div class="grow"><div class="t">${c?escapeHtml(c.icon+" "+c.name):"Uncategorized"}</div><div class="s">${fmtMoney(x.prev,ctx.cur)} → ${fmtMoney(x.now,ctx.cur)}</div></div><b class="${x.d>0?"c-exp":"c-inc"}">${x.d>0?"▲":"▼"} ${fmtMoney(Math.abs(x.d),ctx.cur)}</b></div>`; }).join("");
  }
  if(ctx.view!=="income"){
    const rec = recurringSpends(ctx);
    if(rec.length) h += `<div class="ins-h">Recurring spending · 3 of last 4 months</div>` + rec.map(r=>`<div class="ins-row"><div class="grow"><div class="t">${escapeHtml(r.name)}</div><div class="s">${r.months.size} months · ${r.n} payments</div></div><b>${fmtMoney(r.avg,ctx.cur)}<span class="c-faint" style="font-weight:600">/mo</span></b></div>`).join("");
  }
  const byNote = {};
  ctx.txns.forEach(t=>{ const k=(t.note||"").trim(); if(!k) return; const r = byNote[k.toLowerCase()] = byNote[k.toLowerCase()] || {name:k, amt:0, n:0}; r.amt+=Number(t.amount); r.n++; });
  const notes = Object.values(byNote).sort((a,b)=>b.amt-a.amt).slice(0,5);
  if(notes.length) h += `<div class="ins-h">Top notes</div>` + notes.map(r=>`<div class="ins-row"><div class="grow"><div class="t">${escapeHtml(r.name)}</div><div class="s">${r.n} transaction${r.n===1?"":"s"}</div></div><b>${fmtMoney(r.amt,ctx.cur)}</b></div>`).join("");
  return ccCard("insights", "Insights", "", h || emptyMsg());
}

/* ---------- Statement (trial-balance style grid) ---------- */
function statementModel(ctx, code){
  const tx = ctx.base.filter(t=>t.currency===code && ctx.inView(t)).sort((a,b)=> new Date(a.date)-new Date(b.date) || 0);
  const anyInc = tx.some(t=>kindOf(t)==="income"), anyExp = tx.some(t=>kindOf(t)==="expense");
  const showInc = ctx.incomeMode && ctx.view!=="expense";
  const showExp = !ctx.incomeMode || ctx.view!=="income";
  const signed = showInc && showExp;
  let run = 0, ti = 0, te = 0;
  const rows = tx.map(t=>{
    const k = kindOf(t), amt = Number(t.amount);
    if(k==="income"){ ti+=amt; run += signed ? amt : amt; } else { te+=amt; run += signed ? -amt : amt; }
    const cat=catById(t.catId), sub=cat?subOf(cat.subs,t.subId):null, acc=accById(t.accId), sa=acc?subOf(acc.subs,t.subAccId):null;
    return {t, date:fmtDMY(t.date), desc:t.note || (sub?sub.name:(cat?cat.name:"")), account:(acc?acc.name:"")+(sa?" / "+sa.name:""), category:(cat?cat.name:"")+(sub?" / "+sub.name:""), inc:k==="income"?amt:null, exp:k==="expense"?amt:null, run};
  });
  return {code, rows, showInc, showExp, signed, ti, te, net: signed ? ti-te : (showInc?ti:te), anyInc, anyExp};
}
function statementCard(ctx){
  const codes = currencyOrder(Object.keys(sumByCurrency(ctx.base.filter(ctx.inView))));
  if(!codes.length) return ccCard("statement","Statement","",emptyMsg());
  const key = periodMode+"|"+dateInputValue(periodAnchor)+"|"+ctx.view+"|"+analysisSearch;
  if(key!==stKey){ stKey=key; stPage=1; }
  if(!stCurrency || !codes.includes(stCurrency)) stCurrency = codes.includes(ctx.cur) ? ctx.cur : codes[0];
  const m = statementModel(ctx, stCurrency);
  const PAGE = 10, pages = Math.max(1, Math.ceil(m.rows.length/PAGE));
  stPage = Math.min(Math.max(1, stPage), pages);
  const start = (stPage-1)*PAGE, pageRows = m.rows.slice(start, start+PAGE);
  const money = (v,cls)=> v==null ? "" : `<span class="${cls}">${fmtMoney(v,m.code)}</span>`;
  const runCell = r=> m.signed ? `<span class="${r.run<0?"c-exp":"c-inc"}">${fmtMoney(r.run,m.code,true)}</span>` : `<span class="${m.showInc?"c-inc":"c-exp"}">${fmtMoney(r.run,m.code)}</span>`;
  const head = `<tr><th>Date</th><th>Description</th><th>Account</th><th>Category</th>${m.showInc?'<th class="n">Income</th>':""}${m.showExp?`<th class="n">${m.showInc?"Expense":"Amount"}</th>`:""}<th class="n">${m.signed?"Total":"Running total"}</th></tr>`;
  const body = pageRows.map(r=>`<tr data-open="${r.t.id}"><td>${r.date}</td><td class="desc">${escapeHtml(r.desc)}</td><td>${escapeHtml(r.account)}</td><td>${escapeHtml(r.category)}</td>${m.showInc?`<td class="n">${money(r.inc,"c-inc")}</td>`:""}${m.showExp?`<td class="n">${money(r.exp,"c-exp")}</td>`:""}<td class="n">${runCell(r)}</td></tr>`).join("");
  const foot = `<tr><td colspan="4">Total · ${m.rows.length} rows</td>${m.showInc?`<td class="n c-inc">${fmtMoney(m.ti,m.code)}</td>`:""}${m.showExp?`<td class="n c-exp">${fmtMoney(m.te,m.code)}</td>`:""}<td class="n ${m.signed?(m.net<0?"c-exp":"c-inc"):(m.showInc?"c-inc":"c-exp")}">${fmtMoney(m.net,m.code,m.signed)}</td></tr>`;
  const tabs = codes.length>1 ? `<div class="st-tabs">${codes.map(c=>`<button type="button" class="chip ${c===stCurrency?"on":""}" data-stcur="${escapeHtml(c)}"><span>${escapeHtml(c)}</span></button>`).join("")}</div>` : "";
  const pager = pages>1 ? `<div class="st-pager"><button type="button" data-stpg="-1" ${stPage<=1?"disabled":""}>‹ Prev</button><div class="info">${start+1}–${Math.min(start+PAGE,m.rows.length)} of ${m.rows.length} · Page ${stPage}/${pages}</div><button type="button" data-stpg="1" ${stPage>=pages?"disabled":""}>Next ›</button></div>` : "";
  const body2 = `${tabs}<div class="st-wrap"><table class="st-grid"><thead>${head}</thead><tbody>${body||`<tr><td colspan="7" class="c-faint">No rows.</td></tr>`}</tbody><tfoot>${foot}</tfoot></table></div>${pager}
    <div class="st-actions"><button type="button" id="stCsv">⇩ Export CSV</button><button type="button" id="stImg">▣ Share as image</button></div>`;
  return ccCard("statement", "Statement", escapeHtml(stCurrency), body2);
}
function statementCSV(ctx){
  const m = statementModel(ctx, stCurrency);
  const csvEsc = v=>{ const s=String(v==null?"":v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const num = v=> v==null ? "" : Math.round(v*100)/100;
  const out = [];
  filterLines(ctx).forEach(l=>out.push(csvEsc(l)));
  out.push(["Date","Description","Account","Category", ...(m.showInc?["Income"]:[]), ...(m.showExp?[m.showInc?"Expense":"Amount"]:[]), m.signed?"Total":"Running total", "Currency"].map(csvEsc).join(","));
  m.rows.forEach(r=>out.push([r.date, r.desc, r.account, r.category, ...(m.showInc?[num(r.inc)]:[]), ...(m.showExp?[num(r.exp)]:[]), num(r.run), m.code].map(csvEsc).join(",")));
  out.push(["Total","","","", ...(m.showInc?[num(m.ti)]:[]), ...(m.showExp?[num(m.te)]:[]), num(m.net), m.code].map(csvEsc).join(","));
  downloadBlob("﻿"+out.join("\r\n"), "pie-statement-"+m.code+"-"+dstamp()+".csv", "text/csv;charset=utf-8");
  toast("CSV exported");
}
function filterLines(ctx){
  const lines = ["PIE Statement · "+fmtPeriodLabel(periodMode, periodAnchor)+" ("+fmtDMY(ctx.s)+" to "+fmtDMY(ctx.e)+")"];
  if(ctx.incomeMode) lines.push("View: "+(ctx.view==="both"?"Income & Expenses":KIND_LABEL[ctx.view]));
  lines.push("Currency: "+stCurrency);
  if(anFilters.acc){ const names = new Set(); state.accounts.forEach(a=>{ (a.subs.length?a.subs.map(s=>[a.id+"|"+s.id,a.name+" / "+s.name]):[[a.id+"|",a.name]]).forEach(([k,n])=>{ if(anFilters.acc.has(k)) names.add(n); }); }); lines.push("Accounts: "+[...names].join(", ")); }
  if(anFilters.cat){ const names = new Set(); state.categories.forEach(c=>{ (c.subs.length?c.subs.map(s=>[c.id+"|"+s.id,c.name+" / "+s.name]):[[c.id+"|",c.name]]).forEach(([k,n])=>{ if(anFilters.cat.has(k)) names.add(n); }); }); lines.push("Categories: "+[...names].join(", ")); }
  if(anFilters.status) lines.push("Status: "+[...anFilters.status].join(", "));
  if(analysisSearch) lines.push("Search: "+analysisSearch);
  return lines;
}
/* Statement image: drawn directly on a canvas so it works offline (no external library). */
function statementImageBlob(ctx, withFilters){
  const m = statementModel(ctx, stCurrency);
  if(m.rows.length > 600) return Promise.reject(new Error("too-many"));
  const cols = [{h:"Date",k:"date"},{h:"Description",k:"desc"},{h:"Account",k:"account"},{h:"Category",k:"category"}];
  if(m.showInc) cols.push({h:"Income",k:"inc",n:true,c:"#1B7F4F"});
  if(m.showExp) cols.push({h:m.showInc?"Expense":"Amount",k:"exp",n:true,c:"#B3261E"});
  cols.push({h:m.signed?"Total":"Running total",k:"run",n:true});
  const S = 2, font = "-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif";
  const cv = document.createElement("canvas"), g = cv.getContext("2d");
  const cell = (r,c)=>{ if(c.k==="run") return fmtMoney(r.run,m.code,m.signed); if(c.n) return r[c.k]==null?"":fmtMoney(r[c.k],m.code); return String(r[c.k]||""); };
  g.font = `600 12px ${font}`;
  const widths = cols.map(c=>{ let w = g.measureText(c.h.toUpperCase()).width; m.rows.forEach(r=>{ w = Math.max(w, g.measureText(cell(r,c)).width); }); if(!c.n) w = Math.min(w, 260); return Math.ceil(w)+20; });
  g.font = `800 12px ${font}`;
  const footVals = cols.map((c,i)=> i===0 ? "Total" : c.k==="inc" ? fmtMoney(m.ti,m.code) : c.k==="exp" ? fmtMoney(m.te,m.code) : c.k==="run" ? fmtMoney(m.net,m.code,m.signed) : "");
  footVals.forEach((v,i)=>{ widths[i] = Math.max(widths[i], Math.ceil(g.measureText(v).width)+20); });
  const lines = withFilters ? filterLines(ctx) : [];
  const pad = 18, rowH = 26, headH = 28, titleH = 46 + lines.length*16;
  const W = pad*2 + widths.reduce((a,b)=>a+b,0);
  const H = pad*2 + titleH + headH + rowH*(m.rows.length+1);
  cv.width = W*S; cv.height = H*S; g.scale(S,S);
  g.fillStyle = "#ffffff"; g.fillRect(0,0,W,H);
  g.fillStyle = "#182335"; g.font = `800 18px ${font}`; g.textBaseline = "alphabetic";
  g.fillText("PIE Statement", pad, pad+16);
  g.fillStyle = "#66758a"; g.font = `500 11px ${font}`;
  g.fillText(fmtPeriodLabel(periodMode, periodAnchor)+" · "+m.code+" · "+m.rows.length+" rows", pad, pad+32);
  lines.forEach((l,i)=>{ g.fillStyle="#3f526b"; g.fillText(l, pad, pad+48+i*16); });
  let y = pad + titleH;
  const clip = (txt, w)=>{ if(g.measureText(txt).width <= w) return txt; let s = txt; while(s.length>1 && g.measureText(s+"…").width > w) s = s.slice(0,-1); return s+"…"; };
  const drawRow = (vals, opts)=>{
    let x = pad;
    if(opts.bg){ g.fillStyle = opts.bg; g.fillRect(pad, y, W-pad*2, opts.h); }
    cols.forEach((c,i)=>{
      g.font = opts.font; g.fillStyle = opts.color ? opts.color(c,i,vals[i]) : "#182335";
      const txt = clip(vals[i], widths[i]-16);
      g.textAlign = c.n ? "right" : "left";
      g.fillText(txt, c.n ? x+widths[i]-10 : x+10, y + opts.h/2 + 4);
      x += widths[i];
    });
    g.strokeStyle = "#dfe5ee"; g.lineWidth = 1; g.beginPath(); g.moveTo(pad, y+opts.h+.5); g.lineTo(W-pad, y+opts.h+.5); g.stroke();
    y += opts.h;
  };
  drawRow(cols.map(c=>c.h.toUpperCase()), {h:headH, bg:"#1f3a5f", font:`800 11px ${font}`, color:()=>"#ffffff"});
  m.rows.forEach((r,ri)=> drawRow(cols.map(c=>cell(r,c)), {h:rowH, bg: ri%2?"#f5f8fc":"#ffffff", font:`500 12px ${font}`, color:(c)=> c.k==="run" ? (m.signed ? (r.run<0?"#B3261E":"#1B7F4F") : (m.showInc?"#1B7F4F":"#B3261E")) : (c.c || "#182335")}));
  drawRow(footVals, {h:rowH, bg:"#e9eef6", font:`800 12px ${font}`, color:(c)=> c.k==="inc" ? "#1B7F4F" : c.k==="exp" ? "#B3261E" : c.k==="run" ? (m.signed ? (m.net<0?"#B3261E":"#1B7F4F") : (m.showInc?"#1B7F4F":"#B3261E")) : "#182335"});
  g.textAlign = "left";
  return new Promise(r=>cv.toBlob(r,"image/png"));
}
async function shareStatementImage(ctx){
  const first = await petChoice("Share as image", "Choose what to include.", [{label:"Cancel", value:null},{label:"Grid + filters", value:"filters"},{label:"Grid only", value:"grid", primary:true}]);
  if(!first) return;

  const dest = await petChoice("Image destination", "Choose where the statement image should go.", [
    {label:"Cancel", value:null}, ...(canShare?[{label:"Share", value:"share"}]:[]), {label:"Save image file", value:"save"},
    ...(navigator.clipboard && window.ClipboardItem ? [{label:"Copy to clipboard", value:"clipboard", primary:true}] : [])
  ]);
  if(!dest) return;
  try{
    const blob = await statementImageBlob(ctx, first==="filters");

    else if(dest==="share"){ const file = new File([blob], name, {type:"image/png"}); if(navigator.canShare({files:[file]})) await navigator.share({title:"PIE Statement", files:[file]}); else { downloadBlob(blob, name, "image/png"); toast("Image saved"); } }
    else { downloadBlob(blob, name, "image/png"); toast("Image saved"); }
  }catch(e){
    if(e && e.name==="AbortError") return;
    showNotice("Share as image", e && e.message==="too-many" ? "This statement has more than 600 rows, which is too many for one image. Use Export CSV, or narrow the period or filters." : "Couldn't create the image. Try again.");
  }
}

/* ---------- drill-down ---------- */
function pushDrill(level){
  drill.push(level);
  drillRemovers.push(addLayer(()=>{ drill.pop(); drillRemovers.pop(); renderAnalysisResults(); }));
  renderAnalysisResults();
  const m = document.querySelector("main"); if(m) m.scrollTop = 0; window.scrollTo(0,0);
}
function popDrillTo(n){
  while(drill.length>n){ drill.pop(); const rm = drillRemovers.pop(); if(rm) rm(); }
  renderAnalysisResults();
}
function clearDrill(){ while(drill.length){ drill.pop(); const rm=drillRemovers.pop(); if(rm) rm(); } }
function drillScope(ctx){
  let tx = ctx.all;
  drill.forEach(l=>{
    tx = tx.filter(t=>kindOf(t)===l.kind);
    if(l.type==="cat") tx = tx.filter(t=>t.catId===l.id);
    if(l.type==="catSub") tx = tx.filter(t=>t.catId===l.id && (t.subId||"")===(l.subId||""));
    if(l.type==="acc") tx = tx.filter(t=>t.accId===l.id);
    if(l.type==="accSub") tx = tx.filter(t=>t.accId===l.id && (t.subAccId||"")===(l.subId||""));
  });
  return tx;
}
function levelName(l){
  if(l.type==="cat"){ const c=catById(l.id); return c?c.name:"Uncategorized"; }
  if(l.type==="acc"){ const a=accById(l.id); return a?a.name:"Unknown"; }
  if(l.type==="catSub"){ const c=catById(l.id), s=c?subOf(c.subs,l.subId):null; return s?s.name:"(none)"; }
  const a=accById(l.id), s=a?subOf(a.subs,l.subId):null; return s?s.name:"(none)";
}
function drillHtml(ctx){
  const top = drill[drill.length-1];
  const tx = drillScope(ctx).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const kindTotal = ctx.all.filter(t=>kindOf(t)===top.kind).reduce((a,t)=>a+Number(t.amount),0);
  const amt = tx.reduce((a,t)=>a+Number(t.amount),0);
  let prevAmt = null;
  if(ctx.cmp){ const saved = ctx.all; ctx.all = ctx.cmp; prevAmt = drillScope(ctx).reduce((a,t)=>a+Number(t.amount),0); ctx.all = saved; }
  const col = top.kind==="income" ? COL.inc : COL.exp;
  const crumb = `<div class="crumb"><button type="button" class="back" id="drillBack" aria-label="Back">‹</button><span class="lvl" data-lvl="0">${KIND_LABEL[top.kind]}</span>${drill.map((l,i)=>`<span>›</span><span class="lvl ${i===drill.length-1?"cur":""}" data-lvl="${i+1}">${escapeHtml(levelName(l))}</span>`).join("")}</div>`;
  const sum = `<div class="drill-sum"><div class="l">${escapeHtml(levelName(top))} · ${escapeHtml(fmtPeriodLabel(periodMode, periodAnchor))}</div><div class="v ${top.kind==="income"?"c-inc":"c-exp"}">${fmtMoney(amt,ctx.cur)}</div><div class="s"><span>${kindTotal?Math.round(amt/kindTotal*100):0}% of ${KIND_LABEL[top.kind].toLowerCase()} · ${tx.length} transaction${tx.length===1?"":"s"}</span><span>${prevAmt!=null?deltaHtml(amt,prevAmt,top.kind==="income",ctx.cmpLabel):""}</span></div></div>`;
  const bars = (groups, type)=>{
    const max = Math.max(1, ...groups.map(g=>g.amt));
    return groups.map(g=>`<div class="bar-list-row ${type?"click":""}" ${type?`data-type="${type}" data-sub="${escapeHtml(g.key)}"`:""}><div class="top"><span class="nm">${escapeHtml(g.name)}${type?'<span class="chev">›</span>':""}</span><span class="amt mono">${fmtMoney(g.amt,ctx.cur)}</span></div><div class="bar-track"><div class="bar-fill" style="width:${(g.amt/max*100).toFixed(1)}%;background:${g.color||col}"></div></div><div class="bar-sub"><span>${amt?Math.round(g.amt/amt*100):0}%</span><span>${g.n} txn${g.n===1?"":"s"}</span></div></div>`).join("");
  };
  const group = (keyFn, nameFn)=>{ const m={}; tx.forEach(t=>{ const k=keyFn(t); const r=m[k]=m[k]||{key:k, name:nameFn(t), amt:0, n:0}; r.amt+=Number(t.amount); r.n++; }); return Object.values(m).sort((a,b)=>b.amt-a.amt); };
  let subs = "";
  if(top.type==="cat"){ const c=catById(top.id); subs = ccCard("drill.sub","Subcategories","",bars(group(t=>t.subId||"", t=>{ const s=c?subOf(c.subs,t.subId):null; return s?s.name:"(none)"; }), "catSub")); }
  if(top.type==="acc"){ const a=accById(top.id); subs = ccCard("drill.sub","Accounts","",bars(group(t=>t.subAccId||"", t=>{ const s=a?subOf(a.subs,t.subAccId):null; return s?s.name:"(none)"; }), "accSub")); }
  let cross = "";
  if(top.type==="cat" || top.type==="catSub"){
    cross = ccCard("drill.cross", top.kind==="income"?"Received into":"Paid with", "", bars(group(t=>t.accId+"|"+(t.subAccId||""), t=>{ const a=accById(t.accId), s=a?subOf(a.subs,t.subAccId):null; return (a?a.name:"Unknown")+(s?" / "+s.name:""); }), null));
  }else{
    cross = ccCard("drill.cross", top.kind==="income"?"Sources":"Spent on", "", bars(group(t=>t.catId+"|"+(t.subId||""), t=>{ const c=catById(t.catId), s=c?subOf(c.subs,t.subId):null; return (c?c.icon+" "+c.name:"Uncategorized")+(s?" / "+s.name:""); }), null));
  }
  const canHome = isScreenVisible("entry") && (top.type==="cat" || top.type==="acc" || top.type==="accSub");
  const list = tx.slice(0, 60).map(t=>`<div class="txn-row" data-open="${t.id}" style="cursor:pointer">${txnRowHtml(t,{date:true})}</div>`).join("");
  const more = tx.length>60 ? `<div class="empty-mini">Showing the latest 60 of ${tx.length}. Use the Statement for the full list.</div>` : "";
  return crumb + sum + subs + cross + ccCard("drill.txns", "Transactions", String(tx.length), (canHome?`<div class="link-row"><button type="button" class="link-btn" id="drillHome">Open in Home ›</button></div>`:"") + (list || emptyMsg()) + more);
}

  out.querySelectorAll(".crumb .lvl").forEach(l=>l.addEventListener("click", ()=>{ const n=+l.dataset.lvl; if(n<drill.length) popDrillTo(n); }));

/* Tree multi-select with an All row: unticking any item unticks All, ticking All ticks everything. */
function multiTree(host, sections, sel, onChange){
  const leavesOf = it => it.children && it.children.length ? it.children.map(c=>c.key) : [it.key];
  const allLeaves = sections.flatMap(s=>s.items.flatMap(leavesOf));
  let cur = sel ? new Set(sel) : new Set(allLeaves);
  function state3(keys){ const n = keys.filter(k=>cur.has(k)).length; return n===0?"":n===keys.length?"on":"part"; }
  function render(){
    const all = state3(allLeaves);
    host.innerHTML = `<div class="ms-row all" data-all="1"><span class="ck ${all}">${all==="on"?"✓":all==="part"?"–":""}</span><span class="grow">All</span></div>` +
      sections.map(s=>`${s.title?`<div class="ms-row grp">${escapeHtml(s.title)}</div>`:""}` + s.items.map(it=>{
        const st = state3(leavesOf(it));
        return `<div class="ms-row" data-keys="${escapeHtml(leavesOf(it).join(","))}"><span class="ck ${st}">${st==="on"?"✓":st==="part"?"–":""}</span><span class="grow">${escapeHtml(it.label)}</span></div>` +
          (it.children||[]).map(c=>`<div class="ms-row sub" data-keys="${escapeHtml(c.key)}"><span class="ck ${cur.has(c.key)?"on":""}">${cur.has(c.key)?"✓":""}</span><span class="grow">${escapeHtml(c.label)}</span></div>`).join("");
      }).join("")).join("");
    host.querySelector("[data-all]").addEventListener("click", ()=>{ cur = state3(allLeaves)==="on" ? new Set() : new Set(allLeaves); render(); emit(); });
    host.querySelectorAll("[data-keys]").forEach(r=>r.addEventListener("click", ()=>{
      const keys = r.dataset.keys.split(","); const on = keys.every(k=>cur.has(k));
      keys.forEach(k=> on ? cur.delete(k) : cur.add(k)); render(); emit();
    }));
  }
  function emit(){ onChange(cur.size===allLeaves.length ? null : new Set(cur), cur.size, allLeaves.length); }
  render();
}
function openFilterSheet(){
  const draftF = {acc:anFilters.acc, cat:anFilters.cat, status:anFilters.status};
  const sh = openSheet("Filters", {action:{label:"Reset", fn:()=>{ anFilters.acc=anFilters.cat=anFilters.status=null; sh.close(); clearDrill(); renderAnalysisView(); }}});

  const catSections = [["expense","Expense"],["income","Income"],["both","Both"]].map(([g,l])=>({title:l+" categories", items: sortByOrder(state.categories.filter(c=>c.group===g)).map(c=>({key:c.id+"|", label:(c.icon||"")+" "+c.name, children:sortByOrder(c.subs).map(s=>({key:c.id+"|"+s.id, label:s.name}))}))})).filter(s=>s.items.length);
  const statusItems = [{title:"", items:[{key:"pending",label:"Pending (card not yet paid)"},{key:"paid",label:"Paid / settled"},{key:"direct",label:"Direct (no settlement needed)"}]}];
  sh.body.innerHTML = `
    <div class="h5" style="margin-top:0">Accounts</div><button type="button" class="ms-sum" data-ms="acc"><span></span><span class="c-faint">▾</span></button><div class="ms-box hidden" id="msAcc"></div>
    <div class="h5">Categories</div><button type="button" class="ms-sum" data-ms="cat"><span></span><span class="c-faint">▾</span></button><div class="ms-box hidden" id="msCat"></div>
    <div class="h5">Payment status</div><button type="button" class="ms-sum" data-ms="status"><span></span><span class="c-faint">▾</span></button><div class="ms-box hidden" id="msStatus"></div>
    <div class="field-hint" style="margin-top:12px">Period, view and currency are set at the top of Analysis. Filters apply to every card and the statement.</div>
    <button type="button" class="btn btn-primary btn-block" id="fApply" style="margin-top:14px">Apply</button>`;
  const label = (n, total)=> n===total ? "All" : n===0 ? "None selected" : `${n} of ${total} selected`;
  const setSum = (k, n, total)=>{ sh.body.querySelector(`[data-ms="${k}"] span`).textContent = label(n,total); };
  const mk = (k, host, sections)=>multiTree(sh.body.querySelector(host), sections, draftF[k], (sel,n,total)=>{ draftF[k]=sel; setSum(k,n,total); });
  mk("acc","#msAcc",accSections); mk("cat","#msCat",catSections); mk("status","#msStatus",statusItems);
  const count = (sel, sections)=>{ const all = sections.flatMap(s=>s.items.flatMap(it=>it.children&&it.children.length?it.children.map(c=>c.key):[it.key])); return [sel?all.filter(k=>sel.has(k)).length:all.length, all.length]; };
  setSum("acc", ...count(draftF.acc, accSections)); setSum("cat", ...count(draftF.cat, catSections)); setSum("status", ...count(draftF.status, statusItems));
  sh.body.querySelectorAll("[data-ms]").forEach(b=>b.addEventListener("click", ()=>{ const box = sh.body.querySelector("#ms"+b.dataset.ms[0].toUpperCase()+b.dataset.ms.slice(1)); box.classList.toggle("hidden"); }));
  sh.body.querySelector("#fApply").addEventListener("click", ()=>{ anFilters.acc=draftF.acc; anFilters.cat=draftF.cat; anFilters.status=draftF.status; sh.close(); clearDrill(); renderAnalysisView(); });
}

/* ============================= CALENDAR ============================= */
function calendarDateKey(y,m,d){ return dateInputValue(new Date(y,m,d)); }
function renderCalendarView(){
  const anchor=new Date(calendarAnchor.getFullYear(),calendarAnchor.getMonth(),1);
  calendarAnchor=anchor;
  setPeriodLabel();
  const monthStart=new Date(anchor.getFullYear(),anchor.getMonth(),1);
  const monthEnd=endOfMonth(monthStart);
  const monthTxns=txnsInRange(monthStart,monthEnd);
  const dc = defCur();
  const withIncome = hasIncome(monthTxns);
  const map = sumByCurrency(monthTxns);
  const m = map[dc] || {income:0, expense:0};
  const others = currencyOrder(Object.keys(map)).filter(c=>c!==dc);
  const otherLine = others.length ? `<div class="others" style="font-size:calc(12px*var(--fs,1));color:var(--text-dim);border-top:1px dashed var(--border);padding-top:8px;margin-top:2px"><span class="c-info">★</span> Also: ${others.map(c=>`${map[c].income?`<b class="mono c-inc">${fmtMoney(map[c].income,c)}</b> `:""}${map[c].expense?`<b class="mono c-exp">${fmtMoney(map[c].expense,c)}</b>`:""}`).join(" · ")}</div>` : "";
  const legend = `<div class="cal-legend">${withIncome?`<span><i style="background:var(--income)"></i>Income</span>`:""}<span><i style="background:var(--expense)"></i>Expense</span><span><i style="background:var(--expense);width:6px;height:6px"></i>Pending</span><span><b class="c-info">★</b> Other currency</span></div>`;
  const sumEl = document.getElementById("calendarSummary");
  sumEl.className = "calendar-summary multi";
  if(withIncome){
    const net = m.income - m.expense;
    sumEl.innerHTML = `<div class="sum3"><div><div class="label">Income</div><div class="amt mono c-inc">${fmtMoney(m.income,dc)}</div></div><div><div class="label">Expenses</div><div class="amt mono c-exp">${fmtMoney(m.expense,dc)}</div></div><div><div class="label">Net</div><div class="amt mono ${net<0?"c-exp":"c-acc"}">${fmtMoney(net,dc,true)}</div></div></div>${otherLine}${legend}`;
  }else{
    sumEl.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><div class="label">Month expenses</div><div class="amt mono">${fmtMoney(m.expense,dc)}</div></div></div>${otherLine}${legend}`;
  }
  const grid=document.getElementById("calendarGrid"); grid.innerHTML="";
  const firstWeekday=monthStart.getDay();
  const daysInMonth=new Date(anchor.getFullYear(),anchor.getMonth()+1,0).getDate();
  const prevDays=new Date(anchor.getFullYear(),anchor.getMonth(),0).getDate();
  const now=new Date(); const todayKey=calendarDateKey(now.getFullYear(),now.getMonth(),now.getDate());
  const selectedKey=calendarDateKey(calendarSelectedDate.getFullYear(),calendarSelectedDate.getMonth(),calendarSelectedDate.getDate());
  const narrow = window.innerWidth <= 430;
  const amt = (v)=> narrow ? fmtCompact(v) : fmtNum(v);
  for(let i=0;i<42;i++){
    const cell=document.createElement("div"); cell.className="calendar-cell";
    let day, y=anchor.getFullYear(), mo=anchor.getMonth(), inMonth=true;
    if(i<firstWeekday){ day=prevDays-firstWeekday+i+1; mo--; if(mo<0){mo=11;y--;} inMonth=false; }
    else if(i>=firstWeekday+daysInMonth){ day=i-(firstWeekday+daysInMonth)+1; mo++; if(mo>11){mo=0;y++;} inMonth=false; }
    else day=i-firstWeekday+1;
    const key=calendarDateKey(y,mo,day);
    if(!inMonth) cell.classList.add("other-month");
    if(key===todayKey) cell.classList.add("today");
    if(key===selectedKey && inMonth) cell.classList.add("selected");
    const dayTxns=txnsInRange(new Date(y,mo,day),new Date(y,mo,day,23,59,59,999));
    const dm = (sumByCurrency(dayTxns)[dc]) || {income:0, expense:0};
    const pending=dayTxns.some(t=>accountNeedsPayment(t.accId)&&!t.paid);
    const star = dayTxns.some(t=>t.currency!==dc);
    cell.innerHTML=`<div class="calendar-day-num">${day}${pending?'<span class="pdot" title="Pending payment"></span>':""}</div>${star?'<span class="cal-star" title="Has another currency">★</span>':""}${dm.income?`<div class="cal-inc">${amt(dm.income)}</div>`:""}${dm.expense?`<div class="cal-exp"${dm.income?"":' style="margin-top:6px"'}>${amt(dm.expense)}</div>`:""}`;
    cell.addEventListener("click",()=>{
      const chosen = new Date(y,mo,day);
      calendarSelectedDate = chosen;
      if(!inMonth) calendarAnchor = new Date(chosen.getFullYear(), chosen.getMonth(), 1);
      renderCalendarView();
    });
    grid.appendChild(cell);
  }
  renderCalendarDayDetails(calendarSelectedDate);
  fitText(sumEl);
}
function renderCalendarDayDetails(date){
  const el=document.getElementById("calendarDayDetails");
  const s=new Date(date.getFullYear(),date.getMonth(),date.getDate());
  const e=new Date(date.getFullYear(),date.getMonth(),date.getDate(),23,59,59,999);
  const txns=txnsInRange(s,e).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const label=date.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  const map = sumByCurrency(txns);
  const inc = curList(map,"income","c-inc"), exp = curList(map,"expense","c-exp");
  let out=`<div class="calendar-detail-head"><div><h4>${escapeHtml(label)}</h4><div class="calendar-detail-total" style="display:flex;gap:10px;flex-wrap:wrap;font-size:calc(17px*var(--fs,1))">${inc}${exp}${!inc&&!exp?`<span class="mono c-faint">${fmtMoney(0)}</span>`:""}</div></div></div>`;
  if(!txns.length){ el.innerHTML = out + `<div class="calendar-detail-empty">Nothing recorded for this day.</div>`; return; }
  el.innerHTML = out;
  const groups = [["income","Income"],["expense","Expenses"]].map(([k,l])=>[k,l,txns.filter(t=>kindOf(t)===k)]).filter(g=>g[2].length);
  groups.forEach(([k,l,list])=>{
    const h = document.createElement("div"); h.className = "cal-group-h";
    h.innerHTML = `<span>${l}</span><span>${curList(sumByCurrency(list),k,k==="income"?"c-inc":"c-exp")}</span>`;
    if(groups.length>1 || k==="income") el.appendChild(h);
    list.forEach(t=>{
      const row=document.createElement("div"); row.className="txn-row"; row.style.cursor="pointer";
      row.innerHTML = txnRowHtml(t, {direct:true});
      row.addEventListener("click",()=>openTxn(t.id));
      el.appendChild(row);
    });
  });
}

function renderSettingsView(){
  const body = document.getElementById("settingsBody");
  const main = document.querySelector("main"); const keep = main ? main.scrollTop : 0;
  body.innerHTML = "";
  if(settingsSeg==="wallet") body.appendChild(buildWalletTab());
