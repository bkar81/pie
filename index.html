/* Collapsible section with a remembered open/closed state. */
function secWrap(key, titleHtml, countText, defCollapsed){
  const w = document.createElement("div");
  w.className = "sec-wrap" + (isCollapsed("set."+key, defCollapsed) ? " collapsed" : "");
  w.innerHTML = `<button type="button" class="sec-head"><span class="nm">${titleHtml}</span>${countText!=null?`<span class="cnt">${countText}</span>`:""}<span class="chev">⌄</span></button><div class="sec-body"></div>`;
  w.querySelector(".sec-head").addEventListener("click", ()=>{ const now = !w.classList.contains("collapsed"); w.classList.toggle("collapsed", now); setCollapsed("set."+key, now); });
  return {el:w, body:w.querySelector(".sec-body")};
}
function addTopRow(label, fn){
  const d = document.createElement("div"); d.className = "add-row-top"; d.textContent = label; d.style.marginBottom = "10px";
  d.addEventListener("click", fn); return d;
}

/* ---------- Wallet ---------- */
function buildWalletTab(){
  const wrap = document.createElement("div"); wrap.className = "settings-section";
  [["income","Income accounts"],["expense","Expense accounts"]].forEach(([g,title])=>{
    const list = sortByOrder(state.accounts.filter(a=>a.group===g));
    const s = secWrap("wallet."+g, `<span class="pill ${g==="income"?"inc":"exp"}">${g==="income"?"Income":"Expense"}</span>${title}`, list.length+" type"+(list.length===1?"":"s"), false);
    s.body.appendChild(addTopRow("+ Add "+g+" account type", ()=>openAccountForm(null, g)));
    if(!list.length) s.body.insertAdjacentHTML("beforeend", `<div class="empty-mini">${g==="income"?"No income accounts yet. Add one to start recording income.":"No expense accounts yet."}</div>`);
    list.forEach((top, idx)=> s.body.appendChild(buildGroupCard(top, false, list, idx)));
    wrap.appendChild(s.el);
  });
  const cs = secWrap("wallet.currency", `<span class="pill n">${escapeHtml(curLabel(defCur()))}</span>Currencies`, state.currencies.length+"", false);
  cs.body.appendChild(addTopRow("+ Add currency", ()=>openCurrencyForm(null)));
  sortByOrder(state.currencies).forEach((c, idx, arr)=>{
    const used = state.transactions.filter(t=>t.currency===c.code).length;
    const isDef = c.code===defCur();
    const card = document.createElement("div"); card.className = "group-card";
    card.innerHTML = `<div class="group-head"><div class="nm"><span class="mono c-acc" style="min-width:30px;text-align:center">${escapeHtml(c.symbol||"—")}</span><span>${escapeHtml(c.code)} · ${escapeHtml(c.name)}</span></div>${isDef?'<span class="pill">Default</span>':""}
      <button class="icon-btn" type="button" data-a="up">▲</button><button class="icon-btn" type="button" data-a="down">▼</button><button class="icon-btn" type="button" data-a="edit">✎</button>${isDef?"":'<button class="icon-btn" type="button" data-a="del">🗑</button>'}</div>
      <div class="account-type-line"><span style="flex:1">${used?used+" transaction"+(used===1?"":"s"):"Not used yet"}</span>${isDef?"":'<button type="button" class="filter-link" data-a="def">Make default</button>'}</div>`;
    card.querySelector('[data-a="up"]').addEventListener("click", ()=>moveItem(state.currencies, c, -1));
    card.querySelector('[data-a="down"]').addEventListener("click", ()=>moveItem(state.currencies, c, 1));
    card.querySelector('[data-a="edit"]').addEventListener("click", ()=>openCurrencyForm(c));
    const del = card.querySelector('[data-a="del"]');
    if(del) del.addEventListener("click", async ()=>{
      if(used){ showNotice("Delete Currency", `${c.code} is used by ${used} transaction${used===1?"":"s"}, so it can't be deleted.`); return; }
      if(!await petConfirm("Delete Currency", `Delete ${c.code}?`)) return;
      state.currencies = state.currencies.filter(x=>x.code!==c.code); save(); renderSettingsView();
    });
    const md = card.querySelector('[data-a="def"]');
    if(md) md.addEventListener("click", ()=>{ device.defaultCurrency = c.code; saveDevice(); renderSettingsView(); toast(c.code+" is now the default"); });
    cs.body.appendChild(card);
  });
  wrap.appendChild(cs.el);
  wrap.insertAdjacentHTML("beforeend", `<div class="sec-note" style="margin-top:4px">The account group decides how an amount counts: income adds, expenses subtract. To tell similar accounts apart, add a note in brackets, e.g. <i>ICICI (Purp 1)</i>.</div>`);
  return wrap;
}

/* ---------- Category ---------- */
function buildCategoryTab(){
  const wrap = document.createElement("div"); wrap.className = "settings-section";
  [["income","Income"],["expense","Expense"],["both","Both"]].forEach(([g,title])=>{
    const list = sortByOrder(state.categories.filter(c=>c.group===g));
    const s = secWrap("cat."+g, `<span class="pill ${g==="income"?"inc":g==="expense"?"exp":""}">${title}</span>${g==="both"?"Used for income and expenses":title+" categories"}`, String(list.length), g==="both" && !list.length);
    s.body.appendChild(addTopRow("+ Add "+(g==="both"?"shared":g)+" category", ()=>openCategoryForm(null, g)));
    if(!list.length) s.body.insertAdjacentHTML("beforeend", `<div class="empty-mini">${g==="both"?"Categories here appear for both income and expense entries.":"No "+g+" categories yet."}</div>`);
    list.forEach((top, idx)=> s.body.appendChild(buildGroupCard(top, true, list, idx)));
    wrap.appendChild(s.el);
  });
  return wrap;
}

function buildGroupCard(top, isCat, list, idx){
  const card = document.createElement("div");
  card.className = "group-card";
  const collapseKey = isCat ? "categories" : "accounts";
  if(!expandedGroups[collapseKey].has(top.id)) card.classList.add("collapsed");
  const used = state.transactions.filter(t=> isCat ? t.catId===top.id : t.accId===top.id).length;
  const head = document.createElement("div");
  head.className = "group-head";
  head.innerHTML = `<button class="settings-collapse" type="button" data-a="toggle" aria-label="Expand or collapse">⌄</button>
    <div class="nm">${isCat? `<span>${top.icon||"🗂️"}</span>`:""}<span>${escapeHtml(top.name)}</span></div>
    <button class="icon-btn" type="button" data-a="up">▲</button><button class="icon-btn" type="button" data-a="down">▼</button>
    <button class="icon-btn" type="button" data-a="edit">✎</button><button class="icon-btn" type="button" data-a="del">🗑</button>`;
  const toggle = ()=>{ if(expandedGroups[collapseKey].has(top.id)) expandedGroups[collapseKey].delete(top.id); else expandedGroups[collapseKey].add(top.id); card.classList.toggle("collapsed"); };
  head.querySelector('[data-a="toggle"]').addEventListener("click", e=>{ e.stopPropagation(); toggle(); });
  head.querySelector('.nm').addEventListener("click", toggle);
  head.querySelector('[data-a="up"]').addEventListener("click", ()=> moveWithin(list, top, -1));
  head.querySelector('[data-a="down"]').addEventListener("click", ()=> moveWithin(list, top, 1));
  head.querySelector('[data-a="edit"]').addEventListener("click", ()=> isCat ? openCategoryForm(top) : openAccountForm(top));
  head.querySelector('[data-a="del"]').addEventListener("click", async ()=>{
    const what = isCat ? "Category" : "Account Type";
    if(used && !await petConfirm("Delete "+what, `${used} transaction${used===1?" uses":"s use"} "${top.name}". Delete anyway? They keep the old reference and show as Unknown.`)) return;
    if(!used && !await petConfirm("Delete "+what, `Delete "${top.name}"?`)) return;
    const arr = isCat? state.categories : state.accounts;
    arr.splice(arr.findIndex(x=>x.id===top.id),1); save(); renderSettingsView();
  });
  card.appendChild(head);
  const info = document.createElement("div"); info.className = "account-type-line";
  if(!isCat && top.group!=="income"){
    const needs = top.settlement==="payment";
    info.innerHTML = `<span style="flex:1">${needs?"Requires payment / settlement":"Direct debit — paid at transaction"}${used?` · ${used} txn${used===1?"":"s"}`:""}</span><div class="switch ${needs?'on':''}" title="Toggle whether transactions need separate payment"><div class="knob"></div></div>`;
    info.querySelector(".switch").addEventListener("click",()=>{ top.settlement=needs?"direct":"payment"; save(); renderSettingsView(); });
  }else{
    info.innerHTML = `<span style="flex:1">${used?used+" transaction"+(used===1?"":"s"):"Not used yet"}</span>`;
  }
  card.appendChild(info);
  const subList = document.createElement("div"); subList.className = "sub-list";
  const g = isCat ? (top.group||"expense") : top.group;
  sortByOrder(top.subs).forEach(sub=>{
    const row = document.createElement("div"); row.className = "sub-item";
    row.innerHTML = `<span class="nm">${escapeHtml(sub.name)}</span><button class="icon-btn" type="button" data-a="up">▲</button><button class="icon-btn" type="button" data-a="down">▼</button><button class="icon-btn" type="button" data-a="edit">✎</button><button class="icon-btn" type="button" data-a="del">🗑</button>`;
    row.querySelector('[data-a="up"]').addEventListener("click", ()=> moveItem(top.subs, sub, -1));
    row.querySelector('[data-a="down"]').addEventListener("click", ()=> moveItem(top.subs, sub, 1));
    row.querySelector('[data-a="edit"]').addEventListener("click", async ()=>{
      const name = await petPrompt("Rename", "Enter a new name", sub.name);
      if(name && name.trim()){ sub.name = name.trim(); save(); renderSettingsView(); }
    });
    row.querySelector('[data-a="del"]').addEventListener("click", async ()=>{
      if(!await petConfirm("Delete", `Delete "${sub.name}"?`)) return;
      top.subs.splice(top.subs.findIndex(x=>x.id===sub.id),1); save(); renderSettingsView();
    });
    subList.appendChild(row);
  });
  const addRow = document.createElement("div"); addRow.className = "add-row";
  addRow.textContent = "+ Add " + (isCat?"subcategory":"account");
  addRow.addEventListener("click", async ()=>{
    const name = await petPrompt("Add " + (isCat?"Subcategory":"Account"), isCat?"Enter a name":"Enter the account name. Add a note in brackets to tell similar accounts apart.", "", isCat?PH.catSub[g]:PH.accSub[g]);
    if(!name || !name.trim()) return;
    top.subs.push({id:uid(), name:name.trim(), order:nextOrder(top.subs)});
    expandedGroups[collapseKey].add(top.id);
    save(); renderSettingsView();
  });
  subList.appendChild(addRow);
  card.appendChild(subList);
  return card;
}
function moveItem(arr, item, dir){
  const sorted = sortByOrder(arr);
  const i = sorted.findIndex(x=>x.id===item.id), j = i+dir;
  if(j<0 || j>=sorted.length) return;
  const tmp = sorted[i].order; sorted[i].order = sorted[j].order; sorted[j].order = tmp;
  save(); renderSettingsView();
}
/* Move within the visible group only (orders are shared across groups). */
function moveWithin(groupList, item, dir){
  const i = groupList.findIndex(x=>x.id===item.id), j = i+dir;
  if(j<0 || j>=groupList.length) return;
  const tmp = groupList[i].order; groupList[i].order = groupList[j].order; groupList[j].order = tmp;
  save(); renderSettingsView();
}

function openAccountForm(existing, presetGroup){
  let group = existing ? existing.group : (presetGroup || "expense");
  let settlement = existing ? existing.settlement : "direct";
  const el = document.createElement("div"); el.className = "overlay form-overlay";
  el.innerHTML = `<div class="overlay-head"><button type="button" id="afCancel">Cancel</button><div class="overlay-title">${existing?"Edit Account Type":"Add Account Type"}</div><button type="button" id="afSave" style="color:var(--accent)">Save</button></div>
    <div class="overlay-body">
      <div class="field"><label>Account group</label><div class="kind-seg" id="afGroup" style="margin-bottom:6px"><button type="button" data-k="expense">Expense</button><button type="button" data-k="income">Income</button></div>
        <div class="field-hint" id="afHint"></div></div>
      <div class="field"><label>Account type name</label><input type="text" id="afName" value="${escapeHtml(existing?existing.name:"")}"></div>
      <div class="toggle-row" id="afSettle"><div><div class="t">Requires payment / settlement</div><div class="sub">Turn on for credit cards: purchases stay pending until you mark them paid.</div></div><div class="switch" id="afSettleSw"><div class="knob"></div></div></div>
    </div>`;
  const close = mountOverlay(el);
  const name = el.querySelector("#afName");
  function paint(){
    el.querySelectorAll("#afGroup button").forEach(b=>b.classList.toggle("on", b.dataset.k===group));
    name.placeholder = PH.accType[group];
    el.querySelector("#afHint").textContent = group==="income" ? "Money received into these accounts counts as income." : "Money paid from these accounts counts as an expense.";
    el.querySelector("#afSettle").classList.toggle("hidden", group!=="expense");
    el.querySelector("#afSettleSw").classList.toggle("on", settlement==="payment");
  }
  el.querySelectorAll("#afGroup button").forEach(b=>b.addEventListener("click", ()=>{ group=b.dataset.k; paint(); }));
  el.querySelector("#afSettleSw").addEventListener("click", ()=>{ settlement = settlement==="payment"?"direct":"payment"; paint(); });
  el.querySelector("#afCancel").addEventListener("click", close);
  el.querySelector("#afSave").addEventListener("click", async ()=>{
    const nm = name.value.trim();
    if(!nm){ showNotice("Account Type", "Enter a name."); return; }
    if(existing){
      if(existing.group!==group){
        const n = state.transactions.filter(t=>t.accId===existing.id).length;
        if(n && !await petConfirm("Change Account Group", `${n} transaction${n===1?"":"s"} in "${existing.name}" will count as ${group} instead of ${existing.group}.`, "Change")) return;
      }
      existing.name = nm; existing.group = group; existing.settlement = settlement;
    }else{
      state.accounts.push({id:uid(), name:nm, group, settlement: group==="income"?"direct":settlement, order:nextOrder(state.accounts), subs:[]});
      setCollapsed("set.wallet."+group, false);
    }
    save(); close(); renderSettingsView();
  });
  paint(); setTimeout(()=>name.focus(), 50);
}

function cyrb53(str){
  let h1=0xdeadbeef, h2=0x41c6ce57;
  for(let i=0;i<str.length;i++){ const ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);
}
function canon(v){
  if(Array.isArray(v)) return "["+v.map(canon).join(",")+"]";
  if(v && typeof v==="object") return "{"+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+":"+canon(v[k])).join(",")+"}";
  return JSON.stringify(v);
}
function flattenState(st){
  const m = new Map();
  const put = (k,o)=>m.set(k,{obj:o, hash:cyrb53(canon(o))});
  (st.categories||[]).forEach(c=>{ const {subs, ...rest} = c; put("c:"+c.id, rest); (subs||[]).forEach(s=>put("cs:"+c.id+":"+s.id, s)); });
  (st.accounts||[]).forEach(a=>{ const {subs, ...rest} = a; put("a:"+a.id, rest); (subs||[]).forEach(s=>put("as:"+a.id+":"+s.id, s)); });
  (st.currencies||[]).forEach(c=>put("cur:"+c.code, c));
  if(st.settings) put("s:settings", st.settings);
  if(st.privacy) put("p:privacy", st.privacy);
  (st.transactions||[]).forEach(t=>put("t:"+t.id, t));

}
function hashesOf(m){ const o={}; m.forEach((v,k)=>{ o[k]=v.hash; }); return o; }
function unflattenState(m){
  const cats=[], accs=[], txns=[], curs=[], cIdx=new Map(), aIdx=new Map();
  let settings=null, privacy=null;
  m.forEach((v,k)=>{
    if(k.startsWith("c:")){ const c={...v.obj, subs:[]}; cats.push(c); cIdx.set(v.obj.id,c); }
    else if(k.startsWith("a:")){ const a={...v.obj, subs:[]}; accs.push(a); aIdx.set(v.obj.id,a); }
    else if(k.startsWith("t:")) txns.push(v.obj);
    else if(k.startsWith("cur:")) curs.push(v.obj);
    else if(k==="s:settings") settings = v.obj;
    else if(k==="p:privacy") privacy = v.obj;
  });
  m.forEach((v,k)=>{
    if(k.startsWith("cs:")){ const p=cIdx.get(k.split(":")[1]); if(p) p.subs.push(v.obj); }
    else if(k.startsWith("as:")){ const p=aIdx.get(k.split(":")[1]); if(p) p.subs.push(v.obj); }
  });
  const byOrder=(a,b)=>(a.order||0)-(b.order||0);
  cats.sort(byOrder); accs.sort(byOrder); curs.sort(byOrder);
  cats.concat(accs).forEach(x=>x.subs.sort(byOrder));

}
function changesSince(st, baseHashes){

    [...(st.currencies||[])].map(c=>c.code).sort()

}

function alignToRemote(local, remote){
  const L = JSON.parse(JSON.stringify(local)), norm = s=>String(s||"").trim().toLowerCase();
  const own = (o,k)=>Object.prototype.hasOwnProperty.call(o,k);
  const align = (lList, rList, idMap, subMap, sameGroup)=>{
    const rIds = new Set(rList.map(x=>x.id)), lIds = new Set(lList.map(x=>x.id)), used = new Set();
    lList.forEach(x=>{ if(rIds.has(x.id)) used.add(x.id); });
    lList.forEach(x=>{
      if(rIds.has(x.id)) return;
      const m = rList.find(y=>!used.has(y.id) && !lIds.has(y.id) && norm(y.name)===norm(x.name) && (!sameGroup || (y.group||"expense")===(x.group||"expense")));
      if(!m) return;
      used.add(m.id); const oldId = x.id; idMap[oldId] = m.id; x.id = m.id;
      const rs = m.subs||[], rsIds = new Set(rs.map(s=>s.id)), lsIds = new Set((x.subs||[]).map(s=>s.id)), usedS = new Set();
      (x.subs||[]).forEach(s=>{ if(rsIds.has(s.id)) usedS.add(s.id); });
      (x.subs||[]).forEach(s=>{
        if(rsIds.has(s.id)) return;
        const ms = rs.find(t=>!usedS.has(t.id) && !lsIds.has(t.id) && norm(t.name)===norm(s.name));
        if(!ms) return;
        usedS.add(ms.id); subMap[oldId+"|"+s.id] = ms.id; s.id = ms.id;
      });
    });
  };

  align(L.categories||[], remote.categories||[], catMap, catSub, false);
  align(L.accounts||[], remote.accounts||[], accMap, accSub, true);
  (L.transactions||[]).forEach(t=>{
    const oc=t.catId, oa=t.accId, os=t.subId, oas=t.subAccId;
    if(oc && own(catMap,oc)) t.catId = catMap[oc];
    if(os && own(catSub,oc+"|"+os)) t.subId = catSub[oc+"|"+os];
    if(oa && own(accMap,oa)) t.accId = accMap[oa];

/* Per-record 3-way merge. baseHashes = {} on a first sync (=> plain union).

function mergeStates(local, remote, baseHashes){

    const l=L.get(k), r=R.get(k), inBase=Object.prototype.hasOwnProperty.call(baseHashes,k), b=baseHashes[k];
    if(k==="p:privacy" && l && r && l.hash!==r.hash){

    }
    const lCh = l ? (!inBase || l.hash!==b) : inBase;
    const rCh = r ? (!inBase || r.hash!==b) : inBase;
    if(l && r){
      if(l.hash===r.hash || !rCh) out.set(k,l);
      else if(!lCh) out.set(k,r);
      else { out.set(k,l); conflicts++; }
    }else if(l){
      if(!inBase) out.set(k,l);
      else if(lCh){ out.set(k,l); conflicts++; }
    }else if(r){
      if(!inBase) out.set(k,r);
      else if(rCh){ out.set(k,r); conflicts++; }
    }
  });
  return {state:unflattenState(out), conflicts};
}
function planSync(local, remote, base){
  if(remote===null) return {action:"upload"};
  if(!base || isPristineState(local)){
    if(isPristineState(local)) return isPristineState(remote) ? {action:"upload"} : {action:"restore", first:true};
    if(isPristineState(remote)) return {action:"upload"};
    return {action:"merge", first:true};
  }
  const lc = changesSince(local, base), rc = changesSince(remote, base);
  if(!lc.total && !rc.total) return {action:"noop"};
  if(!rc.total) return {action:"upload", lc};
  if(!lc.total) return {action:"restore", lc, rc};
  return {action:"merge", lc, rc};
}
function loadSyncBase(fileId){
  try{ const b = JSON.parse(lsGet(SYNC_BASE_KEY)||"null"); if(b && b.hashes && b.fileId===fileId) return b.hashes; }catch(e){}
  return null;
}
function saveSyncBase(fileId, st){ lsSet(SYNC_BASE_KEY, JSON.stringify({fileId, hashes:hashesOf(flattenState(st))})); }
function unsyncedCount(){
  try{
    if(!syncConfig.wasConnected) return 0;
    const base = syncConfig.driveFileId ? loadSyncBase(syncConfig.driveFileId) : null;
    if(!base) return isPristineState(state) ? 0 : flattenState(state).size;
    return changesSince(state, base).total;
  }catch(e){ return 0; }
}
const fmtChanges = c => `${c.added} new, ${c.edited} changed, ${c.removed} removed`;
function syncSnapshot(){ return {...completeSnapshot(), backupType:"PIE_SYNC", privacy: state.privacy}; }

/* ---------- top-bar cloud ---------- */

/* ---------- Google sign-in ---------- */
function hasValidDriveToken(){ return !!driveAccessToken && Date.now() < driveTokenExpiresAt - 30000; }
function ensureGisLoaded(){ return !!(window.google && window.google.accounts && window.google.accounts.oauth2); }
let gisScriptPromise = null;
function loadGisScript(){
  if(ensureGisLoaded()) return Promise.resolve(true);
  if(gisScriptPromise) return gisScriptPromise;
  gisScriptPromise = new Promise((resolve, reject)=>{
    const s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client"; s.async = true; s.defer = true;
    s.onload = ()=> resolve(true);
    s.onerror = ()=>{ gisScriptPromise = null; reject(new Error("load-failed")); };
    document.head.appendChild(s);
  });
  return gisScriptPromise;
}
function requestDriveToken(promptType, hint){
  return new Promise((resolve, reject)=>{
    const cfg = {
      client_id: PET_GOOGLE_CLIENT_ID, scope: DRIVE_SCOPES,
      callback: (resp)=>{
        if(resp && resp.access_token){
          driveAccessToken = resp.access_token;
          driveTokenExpiresAt = Date.now() + ((Number(resp.expires_in)||3600) * 1000);
          resolve(resp.access_token);
        }else reject(new Error((resp && (resp.error_description||resp.error)) || "No access token"));
      },
      error_callback: (err)=>reject(new Error((err && (err.type||err.message)) || "Sign-in cancelled"))
    };
    if(hint) cfg.hint = hint;
    google.accounts.oauth2.initTokenClient(cfg).requestAccessToken({prompt: promptType});
  });
}
async function driveRequest(url, opts){
  const res = await fetch(url, {...(opts||{}), headers:{...((opts&&opts.headers)||{}), Authorization:"Bearer "+driveAccessToken}});
  if(!res.ok){ const e = new Error("Drive request failed ("+res.status+")"); e.status = res.status; throw e; }
  return res;
}
async function fetchAccountEmail(){
  try{ const res = await driveRequest("https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)"); const d = await res.json(); return (d.user && d.user.emailAddress) || null; }
  catch(e){ return null; }
}
async function verifyAccount(){
  const email = await fetchAccountEmail();
  const prev = syncConfig.accountEmail || null;
  if(email && prev && email.toLowerCase()!==prev.toLowerCase()){
    const choice = await petChoice("Different Google account",
      "This device was last synced with "+prev+".\nYou are now connecting "+email+".\n\n"+
      "• Sync this device's data to the new account: it is merged into "+email+"'s Drive.\n"+
      "• Reset this device first: clears the data on this device so you can restore "+email+"'s data from Drive.",
      [{label:"Cancel", value:"cancel"},{label:"Reset this device first", value:"reset"},{label:"Sync to new account", value:"keep", primary:true}]);
    if(choice==="reset"){
      if(!await petConfirm("Reset This Device", "This erases ALL data on this device. Continue?")) return false;
      save(defaultState());
      syncConfig.driveFileId = null; syncConfig.lastSyncedAt = null;
      try{ localStorage.removeItem(SYNC_BASE_KEY); }catch(e){}
      refreshCurrentView();
    }else if(choice==="keep"){
      syncConfig.driveFileId = null;
      try{ localStorage.removeItem(SYNC_BASE_KEY); }catch(e){}
    }else return false;
  }
  if(email) syncConfig.accountEmail = email;
  saveSyncConfig();
  return true;
}
async function connectGoogleDrive(){
  try{
    await loadGisScript();
    await requestDriveToken(syncConfig.wasConnected ? "" : "consent", syncConfig.accountEmail);
    if(!await verifyAccount()){ driveAccessToken = null; driveTokenExpiresAt = 0; renderSettingsView(); return; }
    syncConfig.wasConnected = true; saveSyncConfig();
    renderSettingsView();
  }catch(e){
    console.warn("Google connect failed", e);
    driveAccessToken = null; driveTokenExpiresAt = 0;
    renderSettingsView();
    if(e && e.message==="load-failed") showNotice("Google Drive Sync", "Google sign-in needs an internet connection. Connect and try again.");
  }
}
async function reconnectDrive(){
  try{
    await loadGisScript();
    await requestDriveToken("", syncConfig.accountEmail);
    if(!await verifyAccount()){ driveAccessToken = null; driveTokenExpiresAt = 0; return false; }
    syncConfig.wasConnected = true; saveSyncConfig();
    return true;
  }catch(e){
    console.warn("Reconnect failed", e);
    driveAccessToken = null; driveTokenExpiresAt = 0;
    showNotice("Google Drive Sync", e && e.message==="load-failed" ? "Google sign-in needs an internet connection. Connect and try again." : "Couldn't renew the Google connection. Try again.");
    return false;
  }
}
async function disconnectGoogleDrive(){
  if(!await petConfirm("Google Drive Sync", "Disconnect Google Drive? Nothing on this device or in Drive is deleted.")) return;
  if(driveAccessToken && ensureGisLoaded()) google.accounts.oauth2.revoke(driveAccessToken, ()=>{});
  driveAccessToken = null; driveTokenExpiresAt = 0;
  syncConfig.wasConnected = false; saveSyncConfig();
  renderSettingsView();
}

/* ---------- Drive file access ---------- */
async function listDriveFiles(name){
  const q = encodeURIComponent(`name='${name}' and trashed=false`);
  const res = await driveRequest(`https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=modifiedTime%20desc&fields=files(id,name,modifiedTime)&spaces=drive`);
  const data = await res.json();
  return data.files || [];
}
async function driveUpload(fileId, content){
  const metadata = {name: DRIVE_FILE_NAME, mimeType: "application/json"};
  const boundary = "piesyncboundary";
  const body = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${content}\r\n--${boundary}--`;
  const url = fileId ? `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=multipart` : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
  const res = await driveRequest(url, {method: fileId ? "PATCH" : "POST", headers:{"Content-Type": `multipart/related; boundary=${boundary}`}, body});
  return res.json();
}
async function driveDownload(fileId){ const res = await driveRequest(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`); return res.text(); }
function validRemote(r){ return r && typeof r==="object" && Array.isArray(r.categories) && Array.isArray(r.accounts) && Array.isArray(r.transactions); }

/* ---------- Sync ---------- */
async function driveSyncNow(){
  if(syncBusy) return;
  if(!navigator.onLine){ showNotice("Google Drive Sync", "You are offline. Connect to the internet and try again."); return; }
  if(!hasValidDriveToken()){
    if(!syncConfig.wasConnected){ showNotice("Google Drive Sync", "Connect Google Drive first."); return; }
    if(!await reconnectDrive()) return;
  }
  // A locked device (screen privacy on) never asks about merging: it merges or restores on its own.
  const auto = isLockedMode();
  syncBusy = true; updateSyncIndicator(); if(activeView==="settings") renderSettingsView();
  let ok = false;
  try{
    if(!syncConfig.accountEmail){ const em = await fetchAccountEmail(); if(em){ syncConfig.accountEmail = em; saveSyncConfig(); } }
    const files = await listDriveFiles(DRIVE_FILE_NAME);
    let fileId = (syncConfig.driveFileId && files.some(f=>f.id===syncConfig.driveFileId)) ? syncConfig.driveFileId : (files.length ? files[0].id : null);
    if(files.length>1 && !driveDupWarned && !auto){
      const list = files.map(f=>"• modified "+new Date(f.modifiedTime).toLocaleString()+(f.id===fileId?"  ← will be used":"")).join("\n");
      const c = await petChoice("Multiple PIE files on Google Drive", `Google Drive has ${files.length} files named "${DRIVE_FILE_NAME}":\n${list}\n\nSync will use the one marked above. Delete the extra file(s) in Google Drive to avoid confusion.`, [{label:"Cancel sync", value:"cancel"},{label:"Continue", value:"go", primary:true}]);
      if(c!=="go") return;
      driveDupWarned = true;
    }
    let remote = null;
    if(fileId){
      const raw = JSON.parse(await driveDownload(fileId));
      if(!validRemote(raw)){ showNotice("Google Drive Sync", "The file on Drive doesn't look like a valid PIE file, so nothing was changed."); return; }
      remote = normalizeState(raw);
    }else{
      // First PIE sync with this account: adopt PET's file if there is one.
      const legacy = await listDriveFiles(LEGACY_DRIVE_FILE);
      if(legacy.length){ const raw = JSON.parse(await driveDownload(legacy[0].id)); if(validRemote(raw)) remote = normalizeState(raw); }
    }
    const base = fileId ? loadSyncBase(fileId) : null;
    const plan = planSync(state, remote, base);
    let finalState = state, upload = false;
    if(plan.action==="upload") upload = true;
    else if(plan.action==="restore"){
      const choice = auto ? "restore" : plan.first
        ? await petChoice("Restore from Google Drive?", "Google Drive has data that is not on this device. Restore it?", [{label:"Cancel", value:"cancel"},{label:"Restore from Drive", value:"restore", primary:true}])
        : await petChoice("Newer data on Google Drive", "Google Drive has newer data than this device ("+fmtChanges(plan.rc)+").\nRestore it to this device?", [{label:"Keep Local", value:"cancel"},{label:"Restore", value:"restore", primary:true}]);
      if(choice!=="restore") return;
      finalState = remote;
      if(!fileId) upload = true;   // adopted from PET: write PIE's own file
    }else if(plan.action==="merge"){
      let choice = "merge";
      if(!auto){
        const msg = plan.first
          ? "This device and Google Drive both have data. Merge them?\nTransactions are combined; categories and accounts with the same name are treated as the same."
          : "Both this device ("+fmtChanges(plan.lc)+") and Google Drive ("+fmtChanges(plan.rc)+") changed since the last sync.\nMerge keeps new items from both, applies deletions, and keeps this device's version when the same item changed on both.";
        choice = await petChoice("Merge with Google Drive?", msg, [{label:"Cancel", value:"cancel"},{label:"Overwrite Drive", value:"local"},{label:"Merge", value:"merge", primary:true}]);
        if(choice!=="merge" && choice!=="local") return;
        if(choice==="local" && !await petConfirm("Overwrite Drive", "Replace the copy on Google Drive with this device's data? Changes made on other devices will be lost.")) return;
      }
      if(choice==="merge") finalState = mergeStates(plan.first ? alignToRemote(state, remote) : state, remote, base||{}).state;
      upload = true;
    }
    if(finalState!==state){ save(finalState); applyDisplaySettings(); applyTabVisibility(); refreshCurrentView(); }
    if(upload){ const result = await driveUpload(fileId, JSON.stringify(syncSnapshot())); fileId = result.id || fileId; }
    saveSyncBase(fileId, state);
    syncConfig.driveFileId = fileId;
    syncConfig.lastSyncedAt = new Date().toISOString();
    syncConfig.lastError = false;
    saveSyncConfig();
    ok = true;
    toast(plan.action==="noop" ? "Already in sync" : "Synced with Google Drive");
  }catch(e){
    console.error(e);
    syncConfig.lastError = true; saveSyncConfig();
    if(e && e.status===401){ driveAccessToken = null; driveTokenExpiresAt = 0; showNotice("Google Drive Sync", "Your Google session expired. Tap sync again to reconnect."); }
    else showNotice("Google Drive Sync", "Sync failed. Check your connection and try again.");
  }finally{
    syncBusy = false; updateSyncIndicator();
    if(activeView==="settings") renderSettingsView();
  }
  return ok;
}
function buildSyncSection(){
  const wrap = document.createElement("div");
  wrap.innerHTML = `<div class="sec-note">Optional and off by default. When connected, your settings and transactions are kept in a file in your Google Drive. Family devices signed in to the same Google account share it. Tap the cloud at the top to sync any time.</div>`;
  const connected = hasValidDriveToken();
  const expired = !connected && syncConfig.wasConnected;
  if(expired) loadGisScript().catch(()=>{});
  const when = syncConfig.lastSyncedAt ? new Date(syncConfig.lastSyncedAt).toLocaleString() : null;
  const statusRow = document.createElement("div"); statusRow.className = "data-row";
  statusRow.innerHTML = `<div style="min-width:0"><div class="t">${connected ? "Connected" : expired ? "Reconnect needed" : "Not connected"}</div>
    <div class="s">${expired ? "Session expired — tap Sync to reconnect.<br>" : ""}${when ? "Last synced "+escapeHtml(when) : "Never synced"}</div>
    ${syncConfig.accountEmail && (connected||expired) ? `<div class="s" style="color:var(--accent);font-weight:700;overflow:hidden;text-overflow:ellipsis">${escapeHtml(syncConfig.accountEmail)}</div>` : ""}</div>
    <button type="button">${connected ? "Disconnect" : expired ? "Disconnect" : "Connect"}</button>`;
  statusRow.querySelector("button").addEventListener("click", ()=> (connected||expired) ? disconnectGoogleDrive() : connectGoogleDrive());
  wrap.appendChild(statusRow);
  if(connected || expired){
    const n = unsyncedCount();
    const syncRow = document.createElement("div"); syncRow.className = "data-row";
    syncRow.innerHTML = `<div><div class="t">Sync now</div><div class="s">${n>0 ? escapeHtml(n+" change"+(n>1?"s":"")+" not yet synced.") : "Everything on this device is synced."}</div></div>
      <button type="button" ${syncBusy?"disabled":""}>${syncBusy ? "Syncing…" : "Sync"}</button>`;
    syncRow.querySelector("button").addEventListener("click", ()=>driveSyncNow());
    wrap.appendChild(syncRow);
  }
  wrap.insertAdjacentHTML("beforeend", `<div class="sec-note" style="margin:8px 2px 0">Want the data in Google Sheets? Use CSV export below and open the file with the Sheets app.</div>`);
  return wrap;
}

/* ============================= SCREEN PRIVACY =============================
   Hides chosen screens on this device until the code is entered. This discourages casual browsing;
   it is not encryption. The code itself is never stored: only a PBKDF2 verifier (with a random salt)
   is kept in the shared, synced data, so a new code set on one phone reaches every family device.
   Which screens are visible is a per-device choice and is never synced or backed up. */
const KDF_ITER = 250000;
const SCREEN_LABELS = {entry:"🏠 Home & add entry", analysis:"📊 Analysis", calendar:"📅 Calendar", settings:"⚙️ Settings"};
let memUnlocked = false;

function hasCode(){ return !!(state.privacy && state.privacy.verifier); }
function sessionUnlocked(){ try{ return sessionStorage.getItem(SESSION_KEY)==="1" || memUnlocked; }catch(e){ return memUnlocked; } }
function setUnlocked(v){ memUnlocked = !!v; try{ if(v) sessionStorage.setItem(SESSION_KEY,"1"); else sessionStorage.removeItem(SESSION_KEY); }catch(e){} }
function privacyActive(){ return device.privacyOn && hasCode(); }
function isLockedMode(){ return privacyActive() && !sessionUnlocked(); }
function isScreenVisible(key){
  if(key==="about") return true;
  if(!isLockedMode()) return true;
  return (device.visible||[]).includes(key);
}
/* Editing an existing entry (or marking it paid) can require the code, even with Home visible. */
async function ensureCanEdit(){
  if(device.editLock && hasCode() && !sessionUnlocked()) return await requestUnlock();
  return true;
}
async function requireCode(){ return sessionUnlocked() || !hasCode() ? true : await requestUnlock(); }

/* ---------- crypto ---------- */
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
function randomB64(n){ const a = new Uint8Array(n); crypto.getRandomValues(a); return b64(a); }
async function deriveB64(secret, saltB64, iter){
  const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(secret), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({name:"PBKDF2", hash:"SHA-256", salt:unb64(saltB64), iterations:iter||KDF_ITER}, key, 256);
  return b64(bits);
}
function sameB64(a,b){ if(!a || !b || a.length!==b.length) return false; let d=0; for(let i=0;i<a.length;i++) d|=a.charCodeAt(i)^b.charCodeAt(i); return d===0; }
async function sha256Hex(s){ const h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
const normEmail = e => String(e||"").trim().toLowerCase();
function makeRecoveryCode(){
  const A = "23456789ABCDEFGHJKMNPQRSTUVWXYZ", r = new Uint8Array(12); crypto.getRandomValues(r);
  const s = [...r].map(x=>A[x % A.length]).join("");
  return "PIE-"+s.slice(0,4)+"-"+s.slice(4,8)+"-"+s.slice(8,12);
}
const normRecovery = s => String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"").replace(/^PIE/,"");
function validCode(c){ return typeof c==="string" && c.length>=4 && c.length<=20 && !/\s/.test(c); }
async function checkCode(code){ const p = state.privacy; if(!p) return false; return sameB64(await deriveB64(code, p.salt, p.iter), p.verifier); }
async function setNewCode(code){
  const salt = randomB64(16);
  state.privacy = {...(state.privacy||{}), kdf:"PBKDF2-SHA256", iter:KDF_ITER, salt, verifier: await deriveB64(code, salt, KDF_ITER), updatedAt:new Date().toISOString()};
}
async function setNewRecovery(){
  const rc = makeRecoveryCode(), salt = randomB64(16);
  state.privacy = {...state.privacy, recSalt:salt, recVerifier: await deriveB64(normRecovery(rc), salt, KDF_ITER), updatedAt:new Date().toISOString()};
  return rc;
}

/* ---------- wrong-code backoff: 5 tries, then 30s, doubling up to 15 minutes ---------- */
function waitLeft(){ return Math.max(0, Math.ceil(((device.lockUntil||0) - Date.now())/1000)); }
function recordFail(){
  device.fails = (device.fails||0) + 1;
  if(device.fails >= 5) device.lockUntil = Date.now() + Math.min(15*60, 30 * Math.pow(2, device.fails-5)) * 1000;
  saveDevice();
}
function recordSuccess(){ device.fails = 0; device.lockUntil = 0; saveDevice(); }
function fmtWait(s){ return s>=60 ? Math.ceil(s/60)+" min" : s+"s"; }

/* ---------- unlock sheet ---------- */
let unlockPromise = null;
function requestUnlock(){
  if(!hasCode()) return Promise.resolve(true);
  if(unlockPromise) return unlockPromise;
  unlockPromise = new Promise(resolve=>{
    let done = false;
    const finish = v=>{ if(done) return; done = true; unlockPromise = null; resetKnock(); resolve(v); };
    const sh = openSheet("Enter code", {onClose:()=>finish(false)});
    sh.body.innerHTML = `<form id="ulForm" autocomplete="off"><input type="password" class="code-input" id="ulInput" maxlength="20" autocomplete="off" aria-label="Code">
      <div class="code-msg" id="ulMsg"></div>
      <div class="btn-row" style="margin-top:12px"><button type="button" class="btn btn-ghost" id="ulCancel">Cancel</button><button type="submit" class="btn btn-primary" id="ulOk">OK</button></div>
      <button type="button" class="forgot" id="ulForgot">Forgot code?</button></form>`;
    const input = sh.body.querySelector("#ulInput"), msg = sh.body.querySelector("#ulMsg"), ok = sh.body.querySelector("#ulOk");
    let timer = null;
    function tick(){
      const w = waitLeft();
      input.disabled = ok.disabled = w>0;
      msg.className = "code-msg" + (w>0?" err":"");
      if(w>0){ msg.textContent = "Too many tries. Try again in "+fmtWait(w)+"."; timer = setTimeout(tick, 1000); }
      else if(msg.dataset.wait){ msg.textContent = ""; delete msg.dataset.wait; }
      if(w>0) msg.dataset.wait = "1";
    }
    tick(); setTimeout(()=>{ if(!input.disabled) input.focus(); }, 80);
    sh.body.querySelector("#ulCancel").addEventListener("click", ()=>{ clearTimeout(timer); sh.close(); });
    sh.body.querySelector("#ulForm").addEventListener("submit", async e=>{
      e.preventDefault();
      if(waitLeft()>0) return;
      const v = input.value;
      if(!v) return;
      ok.disabled = true;
      const good = await checkCode(v).catch(()=>false);
      ok.disabled = false;
      if(good){ recordSuccess(); clearTimeout(timer); unlockSession(); finish(true); sh.close(); return; }
      recordFail(); input.value = "";
      const box = sh.sheet; box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
      tick();
    });
    sh.body.querySelector("#ulForgot").addEventListener("click", ()=>{ clearTimeout(timer); forgotFlow(sh, finish); });
  });
  return unlockPromise;
}
function unlockSession(){ setUnlocked(true); applyTabVisibility(); refreshCurrentView(); }

/* ---------- forgot code ---------- */
function forgotFlow(sh, finish){
  sh.sheet.querySelector(".sheet-title b").textContent = "Reset the code";
  sh.body.innerHTML = `<div class="sec-note">Choose one way to prove it's you. Then set a new code; it reaches your other devices on their next sync.</div>
    <div class="h5">Recovery code</div><input type="text" id="rcInput" placeholder="PIE-XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters" style="font-family:var(--font-mono);letter-spacing:1px">
    <button type="button" class="btn btn-primary btn-block" id="rcGo" style="margin-top:10px">Use recovery code</button>
    <div class="h5">Or</div><button type="button" class="btn btn-ghost btn-block" id="gGo">Verify with Google</button>
    <div class="field-hint">Sign in with the Google account you gave as the recovery email. PIE only reads its email address.</div>
    <div class="code-msg" id="fMsg"></div>`;
  const msg = sh.body.querySelector("#fMsg");
  sh.body.querySelector("#rcGo").addEventListener("click", async ()=>{
    if(waitLeft()>0){ msg.className="code-msg err"; msg.textContent="Too many tries. Try again in "+fmtWait(waitLeft())+"."; return; }
    const p = state.privacy;
    if(!p.recVerifier){ msg.className="code-msg err"; msg.textContent="No recovery code was set up. Use Google instead."; return; }
    const good = sameB64(await deriveB64(normRecovery(sh.body.querySelector("#rcInput").value), p.recSalt, p.iter), p.recVerifier);
    if(!good){ recordFail(); msg.className="code-msg err"; msg.textContent="That recovery code doesn't match."; return; }
    recordSuccess(); newCodeStep(sh, finish);
  });
  sh.body.querySelector("#gGo").addEventListener("click", async ()=>{
    const p = state.privacy;
    if(!p.emailHash){ msg.className="code-msg err"; msg.textContent="No recovery email was set up."; return; }
    msg.className="code-msg"; msg.textContent="Opening Google sign-in…";
    try{
      const email = await googleVerifyEmail();
      if(email && await sha256Hex(normEmail(email))===p.emailHash){ recordSuccess(); newCodeStep(sh, finish); }
      else { msg.className="code-msg err"; msg.textContent = email ? email+" is not the recovery email for PIE." : "Google sign-in didn't complete."; }
    }catch(e){ msg.className="code-msg err"; msg.textContent = e && e.message==="load-failed" ? "Google sign-in needs an internet connection." : "Google sign-in didn't complete."; }
  });
}

function googleVerifyEmail(){
  return loadGisScript().then(()=>new Promise((resolve, reject)=>{
    google.accounts.oauth2.initTokenClient({
      client_id: PET_GOOGLE_CLIENT_ID, scope:"openid email",
      callback: async resp=>{
        if(!resp || !resp.access_token){ reject(new Error("no-token")); return; }
        try{
          const r = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {headers:{Authorization:"Bearer "+resp.access_token}});
          const d = await r.json();
          // The token is only used for this one check and then dropped (not revoked: revoking can also
          // withdraw the Drive permission when the recovery email is the same account used for sync).
          resolve(d.email || null);
        }catch(e){ reject(e); }
      },
      error_callback: err=>reject(new Error((err && err.type) || "cancelled"))
    }).requestAccessToken({prompt:"select_account"});
  }));
}

/* ============================= CSV IMPORT ============================= */
function parseCSV(text){
  text = String(text||"").replace(/^﻿/,"");
  const first = text.split(/\r?\n/)[0] || "";
  const counts = {",":(first.match(/,/g)||[]).length, ";":(first.match(/;/g)||[]).length, "\t":(first.match(/\t/g)||[]).length};
  const delim = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][1] ? Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0] : ",";
  const rows = []; let row = [], cell = "", q = false;
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q = false; }
      else cell += ch;
    }else if(ch==='"') q = true;
    else if(ch===delim){ row.push(cell); cell=""; }
    else if(ch==="\n" || ch==="\r"){ if(ch==="\r" && text[i+1]==="\n") i++; row.push(cell); rows.push(row); row=[]; cell=""; }
    else cell += ch;
  }
  if(cell!=="" || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==""));
}
const HEADER_ALIASES = {
  date:["date","txndate","transactiondate","day"], type:["type","kind","group","accountgroup","incomeexpense"],
  category:["category","cat"], subcategory:["subcategory","subcat","sub"], accountType:["accounttype","acctype","accountgroupname","paymentmethod"],
  account:["account","subaccount","accountname"], amount:["amount","amt","value"], currency:["currency","cur","ccy"],
  paid:["paid","status","paidstatus"], note:["note","notes","description","desc","remarks","merchant"]
};
function mapHeader(cells){
  const idx = {};
  cells.forEach((h,i)=>{ const k = String(h).toLowerCase().replace(/[^a-z]/g,""); Object.entries(HEADER_ALIASES).forEach(([f,al])=>{ if(idx[f]==null && al.includes(k)) idx[f]=i; }); });
  return idx;
}
const MONTHS = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
function detectDateFormat(values){
  let dmy=false, mdy=false;
  values.forEach(v=>{ const p = String(v).trim().split(/[\sT]/)[0].split(/[-/.]/); if(p.length===3 && p[0].length<=2 && /^\d+$/.test(p[0]+p[1])){ if(+p[0]>12) dmy=true; if(+p[1]>12) mdy=true; } });
  return mdy && !dmy ? "MDY" : "DMY";
}
function parseDateStr(v, fmt){
  const s = String(v||"").trim(); if(!s) return null;
  let y, m, d;
  const datePart = s.split(/[T ]/).length>1 && /^\d{4}-\d{2}-\d{2}/.test(s) ? s.slice(0,10) : s.replace(/,/g," ").replace(/\s+\d{1,2}:\d{2}(:\d{2})?\s*(am|pm)?$/i,"").trim();
  const parts = datePart.split(/[-/.\s]+/).filter(Boolean);
  if(parts.length!==3) return null;
  const mi = parts.findIndex(p=>MONTHS.includes(p.slice(0,3).toLowerCase()) && /^[a-z]/i.test(p));
  if(mi>=0){
    m = MONTHS.indexOf(parts[mi].slice(0,3).toLowerCase())+1;
    const rest = parts.filter((_,i)=>i!==mi).map(Number);
    if(rest[0]>31){ y=rest[0]; d=rest[1]; } else { d=rest[0]; y=rest[1]; }
  }else{
    const n = parts.map(Number); if(n.some(isNaN)) return null;
    if(parts[0].length===4){ [y,m,d] = n; }
    else if(fmt==="MDY"){ [m,d,y] = n; }
    else { [d,m,y] = n; }
  }
  if(y<100) y += 2000;
  const dt = new Date(y, m-1, d);
  if(dt.getFullYear()!==y || dt.getMonth()!==m-1 || dt.getDate()!==d) return null;
  return dateInputValue(dt);
}
function parseAmount(v){
  let s = String(v||"").trim(); if(!s) return NaN;
  if(/^\(.*\)$/.test(s)) return -1;
  s = s.replace(/[^\d.,-]/g,"");
  if(/,\d{1,2}$/.test(s) && !/\./.test(s)) s = s.replace(/\./g,"").replace(",",".");   // 1234,56
  s = s.replace(/,/g,"");
  return s ? Number(s) : NaN;
}
function startCsvImport(){
  chooseFile(".csv,text/csv,text/plain", true, (txt, file)=>{
    const rows = parseCSV(txt);
    if(rows.length<2){ showNotice("Import CSV", "That file has no data rows."); return; }
    const idx = mapHeader(rows[0]);
    const missing = ["date","amount"].filter(f=>idx[f]==null);
    if(missing.length){ showNotice("Import CSV", "The first row must be a header with at least Date and Amount columns. Download the template to see the format."); return; }
    openImportPreview(file.name, rows.slice(1), idx);
  });
}
function planImport(dataRows, idx, opts){
  const work = JSON.parse(JSON.stringify({categories:state.categories, accounts:state.accounts, currencies:state.currencies}));
  const created = {categories:[], subcats:[], accounts:[], subaccs:[], currencies:[], upgraded:[]};
  const norm = s=>String(s||"").trim().toLowerCase();
  const cell = (r,f)=> idx[f]==null ? "" : String(r[idx[f]]==null?"":r[idx[f]]).trim();
  const existingKeys = new Set(state.transactions.map(t=>[t.date.slice(0,10), Number(t.amount), t.currency, t.accId, t.subAccId||"", norm(t.note)].join("|")));
  const items = [];
  dataRows.forEach((r, i)=>{
    const line = i+2, errs = [];
    const date = parseDateStr(cell(r,"date"), opts.dateFmt);
    if(!date) errs.push(`"${cell(r,"date")}" isn't a valid date`);
    const amt = parseAmount(cell(r,"amount"));
    if(!(amt>0)) errs.push(cell(r,"amount") ? `amount "${cell(r,"amount")}" must be a positive number` : "amount is missing");
    const tRaw = norm(cell(r,"type"));
    const kind = !tRaw ? defKind() : /^(i|inc|income|credit|cr|in)$/.test(tRaw) ? "income" : /^(e|exp|expense|debit|dr|out)$/.test(tRaw) ? "expense" : null;
    if(!kind) errs.push(`type "${cell(r,"type")}" should be Income or Expense`);
    let code = cell(r,"currency").toUpperCase() || defCur();
    if(!/^[A-Z0-9]{1,3}$/.test(code)) errs.push(`currency "${cell(r,"currency")}" should be a code of up to 3 letters`);
    const catName = cell(r,"category"), accName = cell(r,"accountType");
    if(!catName) errs.push("category is missing");
    if(!accName) errs.push("account type is missing");
    const item = {line, raw:{date:cell(r,"date"), type:kind?(kind==="income"?"Income":"Expense"):cell(r,"type"), category:catName+(cell(r,"subcategory")?" / "+cell(r,"subcategory"):""), account:accName+(cell(r,"account")?" / "+cell(r,"account"):""), amount:cell(r,"amount"), currency:code}};
    if(errs.length){ item.status="err"; item.msg = errs.join("; "); items.push(item); return; }
    let isNew = false;
    if(!work.currencies.some(c=>c.code===code)){ const k=KNOWN_CURRENCIES[code]; work.currencies.push({id:"cur_"+code, code, symbol:k?k[0]:"", name:k?k[1]:code, order:work.currencies.length}); created.currencies.push(code); isNew=true; }
    let cat = work.categories.find(c=>norm(c.name)===norm(catName));
    if(!cat){ cat = {id:uid(), name:catName, icon:"🗂️", group:kind, order:work.categories.length, subs:[]}; work.categories.push(cat); created.categories.push(catName); isNew=true; }
    else if(cat.group!=="both" && cat.group!==kind){ cat.group = "both"; created.upgraded.push(cat.name); }
    let subId = null; const subName = cell(r,"subcategory");
    if(subName){ let s = cat.subs.find(x=>norm(x.name)===norm(subName)); if(!s){ s={id:uid(), name:subName, order:cat.subs.length}; cat.subs.push(s); created.subcats.push(catName+" / "+subName); isNew=true; } subId = s.id; }
    let acc = work.accounts.find(a=>norm(a.name)===norm(accName) && a.group===kind);
    if(!acc){ acc = {id:uid(), name:accName, group:kind, settlement: kind==="expense" && /credit\s*card/i.test(accName) ? "payment" : "direct", order:work.accounts.length, subs:[]}; work.accounts.push(acc); created.accounts.push(accName+" ("+kind+")"); isNew=true; }
    let subAccId = null; const saName = cell(r,"account");
    if(saName){ let s = acc.subs.find(x=>norm(x.name)===norm(saName)); if(!s){ s={id:uid(), name:saName, order:acc.subs.length}; acc.subs.push(s); created.subaccs.push(accName+" / "+saName); isNew=true; } subAccId = s.id; }
    const pRaw = norm(cell(r,"paid"));
    const paid = acc.group==="expense" && acc.settlement==="payment" && /^(y|yes|paid|true|1|settled)$/.test(pRaw);
    const note = cell(r,"note");
    const txn = {id:uid(), date:date+"T00:00:00", amount:Math.round(amt*100)/100, currency:code, catId:cat.id, subId, accId:acc.id, subAccId, note, paid};
    const key = [date, txn.amount, code, acc.id, subAccId||"", norm(note)].join("|");
    item.txn = txn;
    item.status = existingKeys.has(key) ? "dup" : isNew ? "new" : "ok";
    items.push(item);
  });
  return {work, created, items};
}
function openImportPreview(fileName, dataRows, idx){
  const opts = {dateFmt: detectDateFormat(dataRows.map(r=>idx.date!=null?r[idx.date]:"")), mode:"add", skipDups:true};
  const el = document.createElement("div"); el.className = "overlay form-overlay";
  el.innerHTML = `<div class="overlay-head"><button type="button" id="impCancel">Cancel</button><div class="overlay-title">Import transactions</div><span style="width:52px"></span></div><div class="overlay-body" id="impBody"></div>`;
  const close = mountOverlay(el);
  el.querySelector("#impCancel").addEventListener("click", close);
  let plan = null;
  function render(){
    plan = planImport(dataRows, idx, opts);
    const c = s=>plan.items.filter(i=>i.status===s).length;
    const ready = c("ok")+c("new")+(opts.mode==="replace"||!opts.skipDups?c("dup"):0);
    const cr = plan.created;
    const newBits = [cr.categories.length&&`${cr.categories.length} categor${cr.categories.length===1?"y":"ies"}`, cr.subcats.length&&`${cr.subcats.length} subcategor${cr.subcats.length===1?"y":"ies"}`, cr.accounts.length&&`${cr.accounts.length} account type${cr.accounts.length===1?"":"s"}`, cr.subaccs.length&&`${cr.subaccs.length} account${cr.subaccs.length===1?"":"s"}`, cr.currencies.length&&`${cr.currencies.length} currenc${cr.currencies.length===1?"y":"ies"}`].filter(Boolean);
    const pill = s=> s==="ok" ? '<span class="pill inc">OK</span>' : s==="new" ? '<span class="pill">New</span>' : s==="dup" ? '<span class="pill n">Dup?</span>' : '<span class="pill exp">Error</span>';
    const errs = plan.items.filter(i=>i.status==="err");
    const body = el.querySelector("#impBody");
    body.innerHTML = `<div class="drill-sum"><div class="l">${escapeHtml(fileName)}</div><div style="font-size:calc(13px*var(--fs,1));color:var(--text-dim);margin-top:4px">${dataRows.length} rows · ${Object.keys(idx).length} columns recognised</div>
      <div class="chip-row" style="margin:10px 0 0"><span class="chip on" style="border-color:var(--income);color:var(--income);background:var(--income-soft)"><span>${ready} ready</span></span>${c("dup")?`<span class="chip"><span>${c("dup")} possible duplicate${c("dup")===1?"":"s"}</span></span>`:""}${errs.length?`<span class="chip" style="border-color:var(--expense);color:var(--expense)"><span>${errs.length} error${errs.length===1?"":"s"}</span></span>`:""}</div>
      ${newBits.length?`<div class="field-hint" style="margin-top:8px">Will be created: ${newBits.join(", ")}.</div>`:""}
      ${cr.upgraded.length?`<div class="field-hint">Will be offered for both income and expenses: ${escapeHtml([...new Set(cr.upgraded)].join(", "))}.</div>`:""}</div>
      <div class="field"><label>Dates in this file are</label><div class="chip-row" style="margin:0">${[["DMY","DD-MM-YYYY"],["MDY","MM-DD-YYYY"]].map(([k,l])=>`<button type="button" class="chip ${opts.dateFmt===k?"on":""}" data-df="${k}"><span>${l}</span></button>`).join("")}<span class="chip" style="border-style:dashed"><span>YYYY-MM-DD is always read</span></span></div></div>
      <div class="field"><label>Import mode</label><div class="kind-seg sm" style="margin:0"><button type="button" data-k="both" data-md="add" class="${opts.mode==="add"?"on":""}">Add to existing</button><button type="button" data-k="both" data-md="replace" class="${opts.mode==="replace"?"on":""}">Replace all</button></div></div>
      ${opts.mode==="add"&&c("dup")?`<div class="toggle-row"><div><div class="t">Skip possible duplicates</div><div class="sub">Same date, amount, currency, account and note as an existing entry</div></div><div class="switch ${opts.skipDups?"on":""}" id="impDup"><div class="knob"></div></div></div>`:""}
      <div class="imp-wrap"><table class="imp-table"><thead><tr><th></th><th>Row</th><th>Date</th><th>Type</th><th>Category</th><th>Account</th><th>Amount</th></tr></thead><tbody>
      ${plan.items.slice(0,200).map(i=>`<tr><td>${pill(i.status)}</td><td>${i.line}</td><td>${escapeHtml(i.txn?fmtDMY(i.txn.date):i.raw.date)}</td><td class="${i.raw.type==="Income"?"c-inc":"c-exp"}">${escapeHtml(i.raw.type)}</td><td>${escapeHtml(i.raw.category)}</td><td>${escapeHtml(i.raw.account)}</td><td class="mono">${escapeHtml(i.raw.currency)} ${escapeHtml(i.raw.amount)}</td></tr>`).join("")}</tbody></table></div>
      ${plan.items.length>200?`<div class="field-hint">Showing the first 200 rows.</div>`:""}
      ${errs.length?`<div class="imp-err">${errs.slice(0,25).map(i=>`<div>Row ${i.line}: ${escapeHtml(i.msg)}.</div>`).join("")}${errs.length>25?`<div>…and ${errs.length-25} more.</div>`:""}<div class="c-faint">Rows with errors are skipped. Fix them in the file and import again if needed.</div></div>`:""}
      <div class="entry-save-bottom"><button type="button" id="impGo" ${ready?"":"disabled"}>${opts.mode==="replace"?"Replace with":"Import"} ${ready} transaction${ready===1?"":"s"}</button></div>`;
    body.querySelectorAll("[data-df]").forEach(b=>b.addEventListener("click", ()=>{ opts.dateFmt=b.dataset.df; render(); }));
    body.querySelectorAll("[data-md]").forEach(b=>b.addEventListener("click", ()=>{ opts.mode=b.dataset.md; render(); }));
    const d = body.querySelector("#impDup"); if(d) d.addEventListener("click", ()=>{ opts.skipDups=!opts.skipDups; render(); });
    body.querySelector("#impGo").addEventListener("click", commit);
  }
  async function commit(){
    const take = plan.items.filter(i=>i.txn && (i.status!=="dup" || opts.mode==="replace" || !opts.skipDups)).map(i=>i.txn);
    if(!take.length) return;
    if(opts.mode==="replace" && !await petConfirm("Replace all transactions", `Delete all ${state.transactions.length} transactions on this device and keep only the ${take.length} from this file?`, "Replace")) return;
    const txns = opts.mode==="replace" ? take : state.transactions.concat(take);
    save(normalizeState({...state, categories:plan.work.categories, accounts:plan.work.accounts, currencies:plan.work.currencies, transactions:txns}));
    close(); renderSettingsView();
    showNotice("Import CSV", `${take.length} transaction${take.length===1?"":"s"} imported.`);
  }
  render();
}

/* ============================= INIT ============================= */
applyDisplaySettings();
if(privacyActive() && sessionUnlocked() && device.lastHidden && Date.now()-device.lastHidden >= (Number(device.autoLockMin)||0)*60000 && document.visibilityState==="visible"){
  // reopened after the auto-lock time in the same browser session
  setUnlocked(false);
}
applyTabVisibility();
showView(firstVisibleScreen(), {noHistory:true});
updateSyncIndicator();
initBackHandling();
window.addEventListener("resize", ()=>{ if(activeView==="calendar") renderCalendarView(); });

/* ---------- PWA update notification + manual update check ---------- */
(function(){
  if(!("serviceWorker" in navigator)) return;
  const notice = document.getElementById("petUpdateNotice");
  let registration = null, waitingWorker = null;
  const show = w=>{ waitingWorker = w || waitingWorker; if(notice) notice.classList.add("is-visible"); };
  const hide = ()=>{ if(notice) notice.classList.remove("is-visible"); };
  const status = m=>{ const s=document.getElementById("petUpdateCheckStatus"); if(s) s.textContent = m; };
  async function checkForUpdate(manual){
    const btn = document.getElementById("petCheckUpdateBtn"), label = btn ? btn.querySelector(".pet-check-label") : null;
    if(!registration){ if(manual) status("Update check is not ready yet."); return; }
    if(btn){ btn.classList.add("is-checking"); if(label) label.textContent = "Checking…"; }
    status("");
    try{
      await registration.update();
      if(registration.waiting){ show(registration.waiting); status("A new version is ready to install."); }
      else if(manual) status("You're using the latest version of PIE.");
    }catch(e){ console.warn("PIE update check failed:", e); if(manual) status("Could not check for updates. Please try again."); }
    finally{ if(btn){ btn.classList.remove("is-checking"); if(label) label.textContent = "Check for updates"; } }
  }
  window.__pieBindUpdate = ()=>{ const b = document.getElementById("petCheckUpdateBtn"); if(b && !b.dataset.bound){ b.dataset.bound="1"; b.addEventListener("click", ()=>checkForUpdate(true)); } };
  window.__pieBindUpdate();
  navigator.serviceWorker.register("./service-worker.js").then(reg=>{
    registration = reg;
    if(reg.waiting) show(reg.waiting);
    reg.addEventListener("updatefound", ()=>{
      const nw = reg.installing; if(!nw) return;
      nw.addEventListener("statechange", ()=>{ if(nw.state==="installed" && navigator.serviceWorker.controller) show(nw); });
    });
    checkForUpdate(false);
  }).catch(e=>{ console.warn("PIE service worker registration failed:", e); status("Update service unavailable."); });
  document.getElementById("petUpdateNow").addEventListener("click", ()=>{
    const w = waitingWorker || (registration && registration.waiting);
    if(w) w.postMessage({type:"SKIP_WAITING"});
    hide();
  });
  document.getElementById("petUpdateLater").addEventListener("click", hide);
  let refreshing = false;
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{ if(refreshing) return; refreshing = true; window.location.reload(); });
})();
})();

</script>
